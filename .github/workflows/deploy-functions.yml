# Ива — выкладка функций Supabase (Edge Functions) из GitHub (решение владельца №21 от 04.10.2026, вариант А).
# Что делает: выкладывает папки supabase/functions/* в проект Supabase. Только функции —
# SQL-правки базы по-прежнему применяет владелец (решение владельца, не менять без его слова).
# Секреты (кладёт владелец: Settings → Secrets and variables → Actions; агент их не видит):
#   SUPABASE_ACCESS_TOKEN — обязателен (токен доступа Supabase);
#   SMTP_USER, SMTP_PASS  — необязательны: если заданы, переносятся в секреты функций Supabase.
# Когда запускается: при изменении supabase/functions/** или этого файла в ветке агента или в main,
# а также вручную (Actions → «Выкладка функций Supabase» → Run workflow).
# Проверка: после выкладки функция должна отвечать (а не NOT_FOUND) — итог одной строкой в заметке к запуску.
# Откат: удалить файл через Pull Request / `git revert`; токен отозвать в Supabase → Account → Access Tokens.
name: Выкладка функций Supabase
on:
  push:
    branches: ['main', 'arena/01a101d5-arenda-nvk']
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-functions
  cancel-in-progress: false
env:
  PROJECT_REF: wdxdeatphizclskfmfxi
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Токен на месте?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Нет токена::В секретах GitHub нет SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "токен есть (значение не показывается)"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Выложить функции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for d in supabase/functions/*/; do
            fn="$(basename "$d")"
            [ -f "$d/index.ts" ] || continue
            echo "== выкладываю $fn"
            # Проверку JWT выключаем: функции защищены своими одноразовыми пропусками (см. код функции).
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done

      - name: Секреты почты (если заданы в GitHub)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            f="$(mktemp)"; chmod 600 "$f"
            printf 'SMTP_USER=%s\nSMTP_PASS=%s\n' "$SMTP_USER" "$SMTP_PASS" > "$f"
            supabase secrets set --env-file "$f" --project-ref "$PROJECT_REF" >/dev/null
            rm -f "$f"
            echo "SMTP_USER/SMTP_PASS перенесены в Supabase (значения не показываются)"
            echo "SMTP_SET=да" >> "$GITHUB_ENV"
          else
            echo "SMTP_USER/SMTP_PASS в GitHub не заданы — секреты в Supabase не трогаю"
            echo "SMTP_SET=нет (не трогал)" >> "$GITHUB_ENV"
          fi

      - name: Проверка — функции отвечают
        run: |
          res=""
          fail=0
          for d in supabase/functions/*/; do
            fn="$(basename "$d")"
            code="$(curl -s -o /tmp/r.txt -w '%{http_code}' "https://$PROJECT_REF.supabase.co/functions/v1/$fn")"
            body="$(head -c 160 /tmp/r.txt | tr '\n' ' ')"
            echo "$fn → HTTP $code: $body"
            if [ "$code" = "200" ]; then res="$res ✔ $fn"; else res="$res ✘ $fn (HTTP $code)"; fail=1; fi
          done
          echo "::notice title=Выкладка функций::$res · секреты почты: $SMTP_SET"
          exit $fail
