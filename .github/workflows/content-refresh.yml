# ============================================================================
# Контент-машина (этап П7): сайт сам держит контент свежим.
#
# Раз в неделю (и по кнопке Run workflow) запускает tools/content-refresh.sh:
# снимки из боевой базы -> пересборка страниц городов -> проверка проекта ->
# Pull Request, если контент изменился.
#
# Секреты не нужны: чтение из базы идёт с публичным publishable-ключом (он и так
# в коде сайта), Pull Request создаётся токеном самого Actions.
# В main не коммитит и историю не переписывает — только ветка + Pull Request.
#
# Откат: git revert коммита с этим файлом — автообновление прекратится,
# сборка сайта и сами страницы не изменятся.
# ============================================================================
name: Контент-машина

on:
  schedule:
    - cron: '17 3 * * 1'   # каждый понедельник, 03:17 UTC (10:17 по Новосибирску)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Форки репозитория боевую базу дёргать не должны
    if: github.repository == 'eclipsru/Arenda-Nvk'
    runs-on: ubuntu-latest
    steps:
      - name: Взять репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Освежить контент и, если изменился, открыть Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/content-refresh.sh
