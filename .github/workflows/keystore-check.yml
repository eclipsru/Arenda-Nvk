# Ива — проверка ключа подписи приложения (keystore) из секретов GitHub. Ничего не собирает и не выкладывает.
# Зачем: новые версии приложения (10.15+) должны быть подписаны ТЕМ ЖЕ ключом, что и 10.14,
# иначе они не встанут поверх. Владелец кладёт ключ в секреты GitHub (не в чат и не в репозиторий):
#   ANDROID_KEYSTORE_B64  — файл ключа (prokat-new.p12), переведённый в текст (base64);
#   ANDROID_KEYSTORE_PASS — пароль от ключа (из менеджера паролей владельца);
#   ANDROID_KEYSTORE_PASS_LIST — необязательно: все найденные варианты пароля, по одному в строке.
#     Проверка перебирает их и называет только НОМЕР подошедшей строки (сами пароли не выводятся).
# Что проверяет: текст раскодируется в файл → пароль подходит → пробная подпись копии
# ProkatInstrumenta-10.14.apk проходит → сертификат = новый ключ №6 (с 05.10.2026, решение №22)
# или старый №5 (как у 10.14) — тогда пароль к старому ключу нашёлся.
# Итог одной строкой в заметке к запуску. Пароль и ключ не выводятся; временный файл удаляется.
# Запуск: при изменении этого файла; кнопка Run workflow появится только после слияния в main
# (GitHub показывает её лишь для файлов из основной ветки — выяснено 05.10.2026 по скриншоту владельца).
# Запуски агентом: 05.10.2026 — после «положил», «добавил пароль», «ещё другой пароль», «вот ещё вариант» владельца.
# Откат: удалить файл (`git revert`); секреты удалить в Settings → Secrets and variables → Actions.
name: Проверка ключа подписи
on:
  push:
    branches: ['main', 'arena/01a101d5-arenda-nvk']
    paths: ['.github/workflows/keystore-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ProkatInstrumenta-10.14.apk
            tools/p12-info.py
          sparse-checkout-cone-mode: false

      - name: Проверить ключ
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_LIST: ${{ secrets.ANDROID_KEYSTORE_PASS_LIST }}
        run: |
          set -euo pipefail
          say() { echo "::notice title=Ключ подписи::$1"; }
          bad() { echo "::error title=Ключ подписи::$1"; exit 1; }
          [ -n "$KS_B64" ]  || { say "секрета ANDROID_KEYSTORE_B64 нет — ключ ещё не положен (это не ошибка)"; exit 0; }
          # Отпечаток пароля: 3 знака хеша — только чтобы видеть, менялся ли секрет между запусками (пароль по нему не восстановить).
          FP_P=$(printf '%s' "$KS_PASS" | sha256sum | cut -c1-3)
          FP_F=$(printf '%s' "$KS_B64" | tr -d ' \r\n' | sha256sum | cut -c1-3)
          say "отпечаток пароля: $FP_P · отпечаток файла ключа: $FP_F (если после обновления секрета отпечаток тот же — секрет не сохранился)"
          export KS="$RUNNER_TEMP/ks.p12"; OUT="$RUNNER_TEMP/test.apk"
          trap 'rm -f "$KS" "$OUT" "$OUT.idsig"' EXIT
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$KS" 2>/dev/null \
            || bad "ANDROID_KEYSTORE_B64 не похож на ключ: скопирован не весь текст или не тот файл"
          [ -s "$KS" ] || bad "ANDROID_KEYSTORE_B64 пустой после раскодирования"
          # Подробности без секретов: размер, контрольная сумма файла (известна из APK-ИНСТРУКЦИЯ.md), тип ошибки.
          SIZE=$(stat -c %s "$KS"); SHA=$(sha1sum "$KS" | cut -c1-40)
          KNOWN=d8df7536d5ca5788304ca966b34a4b59eb2c0501
          if [ "$SHA" = "$KNOWN" ]; then SAME="файл тот же, что записан в APK-ИНСТРУКЦИЯ.md"; else SAME="контрольная сумма ${SHA:0:8}… (в инструкции d8df7536…; другая — если файл другой или пароль в нём уже меняли)"; fi
          FIRST=$(head -c1 "$KS" | od -An -tx1 | tr -d ' ')
          [ "$FIRST" = "30" ] || bad "раскодированный текст — не файл ключа (размер $SIZE байт). Скопирован не тот файл или не весь текст"
          # Перебор списка вариантов (если задан): выводятся только номера строк.
          if [ -n "${KS_LIST:-}" ]; then
            LRES=$(python3 - <<'PY'
          import os, subprocess
          ks = os.environ['KS']
          lines = [l.rstrip('\r') for l in os.environ.get('KS_LIST', '').split('\n')]
          ru = 'йцукенгшщзхъфывапролджэячсмитьбюё'; en = "qwertyuiop[]asdfghjkl;'zxcvbnm,.`"
          tbl = {**{r: e for r, e in zip(ru, en)}, **{r.upper(): e.upper() for r, e in zip(ru, en)}}
          def ok(v):
              env = dict(os.environ, KS_TRY=v)
              return subprocess.run(['keytool', '-list', '-keystore', ks, '-storepass:env', 'KS_TRY'], env=env, capture_output=True).returncode == 0
          n = 0; found = []
          for i, l in enumerate(lines, 1):
              if not l.strip(): continue
              n += 1
              for name, v in (('как есть', l), ('без пробелов по краям', l.strip()),
                              ('в английской раскладке', ''.join(tbl.get(c, c) for c in l.strip())),
                              ('с Caps Lock', l.strip().swapcase()), ('с другой первой буквой', l.strip()[:1].swapcase() + l.strip()[1:])):
                  if ok(v): found.append(f'строка №{i} ({name})'); break
          print(f'проверено вариантов: {n}; ' + ('ПОДОШЛО: ' + ', '.join(found) if found else 'ни один не подошёл'))
          PY
            ) || LRES="перебор не выполнен"
            say "список вариантов: $LRES"
          fi
          # Что видно без пароля: имя ключа, метка, способ шифрования → какой из 5 ключей истории (tools/p12-info.py).
          python3 tools/p12-info.py "$KS" 2>&1 | while IFS= read -r line; do say "без пароля: $line"; done || true
          [ -n "$KS_PASS" ] || bad "файл ключа есть, а пароля нет: добавьте секрет ANDROID_KEYSTORE_PASS"
          if ! LIST=$(keytool -J-Duser.language=en -list -keystore "$KS" -storepass:env KS_PASS 2>&1); then
            WHY=$(printf '%s\n' "$LIST" | grep -m1 -oiE 'password was incorrect|invalid keystore format|toDerInputStream|unsupported|DerInputStream|EOF|keystore was tampered' || echo "другая")
            TRIM=$(printf '%s' "$KS_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ "$TRIM" != "$KS_PASS" ]; then
              export KS_TRIM="$TRIM"
              if keytool -list -keystore "$KS" -storepass:env KS_TRIM >/dev/null 2>&1; then
                bad "в пароле лишний пробел или перевод строки по краям. Обновите ANDROID_KEYSTORE_PASS без пробелов"
              fi
              ED="; лишние пробелы по краям пароля есть, но и без них не подходит"
            else ED=""; fi
            # Вторая программа (OpenSSL) и частые ошибки набора — без вывода пароля.
            if openssl pkcs12 -in "$KS" -nokeys -legacy -passin env:KS_PASS -out /dev/null 2>/dev/null \
               || openssl pkcs12 -in "$KS" -nokeys -passin env:KS_PASS -out /dev/null 2>/dev/null; then
              bad "OpenSSL пароль ПРИНЯЛ, а keytool — нет: пароль верный, нужна доработка проверки (сообщите агенту)"
            fi
            HINT=$(python3 - <<'PY'
          import os, subprocess
          p = os.environ.get('KS_PASS', '')
          ru = 'йцукенгшщзхъфывапролджэячсмитьбюё' ; en = "qwertyuiop[]asdfghjkl;'zxcvbnm,.`"
          tbl = {**{r: e for r, e in zip(ru, en)}, **{r.upper(): e.upper() for r, e in zip(ru, en)}}
          hints = []
          cyr = any(ch in tbl for ch in p)
          hints.append('русские буквы: ' + ('есть' if cyr else 'нет'))
          hints.append('пробелы внутри: ' + ('есть' if ' ' in p.strip() else 'нет'))
          tries = []
          if cyr: tries.append(('в английской раскладке', ''.join(tbl.get(ch, ch) for ch in p)))
          tries.append(('с другим регистром первой буквы', p[:1].swapcase() + p[1:]))
          tries.append(('с нажатым Caps Lock', p.swapcase()))
          for name, v in tries:
              env = dict(os.environ, KS_TRY=v)
              ok = subprocess.run(['keytool', '-list', '-keystore', os.environ['KS'], '-storepass:env', 'KS_TRY'],
                                  env=env, capture_output=True).returncode == 0
              if ok: hints.append('ПОДОШЁЛ вариант «' + name + '» — исправьте пароль так в секрете'); break
          print('; '.join(hints))
          PY
            ) || HINT="подсказки не получены"
            bad "пароль не подходит к ключу (keytool: $WHY; OpenSSL тоже не принял; $HINT). Файл $SIZE байт, $SAME$ED"
          fi
          ALIAS=$(printf '%s\n' "$LIST" | grep -i 'PrivateKeyEntry' | head -1 | cut -d, -f1)
          [ -n "$ALIAS" ] || bad "в файле нет закрытого ключа (это сертификат, а не ключ подписи)"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$ALIAS" \
            --out "$OUT" ProkatInstrumenta-10.14.apk >/dev/null 2>&1 \
            || bad "пробная подпись не прошла (пароль ключа отличается от пароля файла?)"
          OLD=$("$BT/apksigner" verify --print-certs ProkatInstrumenta-10.14.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          NEW=$("$BT/apksigner" verify --print-certs "$OUT" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          # Эталон — ключ №6, который владелец создаёт САМ у себя на компьютере (решение №22, 05.10.2026).
          # Пока ключ не создан — PENDING: проверка сообщает отпечаток, агент вписывает его сюда и в docs/КЛЮЧ-ПОДПИСИ.md.
          EXPECTED=PENDING
          if [ "$EXPECTED" = "PENDING" ] && [ "$OLD" != "$NEW" ]; then
            say "✔ ключ рабочий: файл читается, пароль подходит, alias $ALIAS, пробная подпись прошла. Отпечаток нового ключа: ${NEW^^} — агент впишет его как эталон №6"
            exit 0
          fi
          if [ "${NEW^^}" = "$EXPECTED" ]; then
            say "✔ НОВЫЙ ключ №6: файл читается, пароль подходит, alias $ALIAS, пробная подпись прошла, сертификат ${NEW:0:8}… = эталон — можно подписывать 10.15"
          elif [ "$OLD" = "$NEW" ]; then
            say "✔ это СТАРЫЙ ключ №5 (как у 10.14, ${NEW:0:8}…) и пароль к нему подошёл. Сообщите агенту: можно обойтись без переустановки"
          else
            case "${NEW^^}" in
              6D077A92*) WHO="№1 исходный (v1.1…10.11)";; ACBF8076*) WHO="№2 разовый (24.09 12:54)";;
              1398FE07*) WHO="№3 разовый (24.09 13:19)";; 8AD9D6A9*) WHO="№4 первая 10.12 (24.09 21:36)";; *) WHO="не из истории";;
            esac
            bad "ключ рабочий, но не тот: это ключ $WHO, сертификат ${NEW:0:8}…. Нужен новый ключ №6 (эталон ${EXPECTED:0:8}…) из папки KLUCH-IVA-2026"
          fi
