# Ива — сборка приложения 10.57 (тестовая: чат обновляется сам, значок-логотип в уведомлениях; 10.56 — «Настройки» в кабинете — уведомления с переключателями; 10.55 — заявка — ФИО по полям, свой срок у инструмента, «+ Добавить инструмент»; 10.54 — чат по инструментам; правки шторки и главной 10.46–10.53): на главной «Ваш город», ручка внизу над меню и шторка фильтров снизу (10.45 — ручка слева; поверх 10.44 — «Избранное / Мои инструменты» под логотипом, 10.42 — имя, 10.41 — фото, 10.40 — экран настроек профиля). Подпись — ключом №6 из секретов.
# Почему так: исходников 10.14 нет, есть только APK. Сборка разбирает APK (apktool, без пересборки ресурсов),
# вставляет только стабильные точки вызова android/patches/apply.py из версии 10.21, меняет версию
# в двоичном манифесте (axml_version.py), добавляет IvaPatch, IvaClientPatch и IvaSearchPatch
# в следующий classes*.dex; из клиентских hooks apply.py вызывает только onProfile (как в 10.39).
# В кабинете нет добавленной белой карточки: штатная тёмная строка «Клиент» и её оболочки открывают
# отдельный полноэкранный экран «Настройки профиля» (шапка «←», личные и паспортные данные, фото профиля,
# закреплённая кнопка «Сохранить»; системная «Назад» закрывает экран). Результат выбора фото принимает
# вспомогательный Fragment внутри IvaClientPatch — hook onActivityResult в MainActivity по-прежнему не нужен.
# 10.41: фото клиента (приватный bucket customer-avatars) скачивается по токену и показывается в штатном кружке
# строки «Клиент» (avatarImg) и в кружке «Кабинета» нижнего меню — из того же hook onProfile, без новых точек вставки.
# 10.42: вместо «Клиент» в строке — имя из поля «Имя» профиля (и его первая буква в кружке без фото).
# 10.43: логотип у клиента — раздел «Избранное» и «Мои инструменты» (штатные карточки feedCard) вместо формы
# заявки; обработчики ставятся на штатные navPlus/detBack, скрытие — из onTab; новых точек вставки нет.
# 10.44: «Брали в аренду» — по статусу части заявки (order_parts.status: rented/closed), иначе по статусу заявки.
# 10.45: IvaSearchPatch — строка «Ваш город» над поиском (город профиля / ручной выбор в prokat_session), полоса
# слева с ручкой, панель фильтров (категория, цена за сутки, доставка, состояние; «Показать N»). Ставится из onTab
# (конец штатного showTab), лента — штатный renderFeed по отфильтрованному полю tools; новых точек вставки нет.
# 10.46: ручка — полоса над нижним меню, шторка снизу (свайп вверх/вниз); категории без пустых; «от» > «до» — местами;
# без цены — не под фильтром цены; город как на сайте; радиус — неактивная заготовка (без геолокации).
# 10.47: шторка открывается заполненной (в 10.46 категории и кнопки появлялись только после «доставки»), до шапки
# приложения; шапка шторки компактная, выбранные условия — текстом с ✕.
# 10.48: шторка снова 85% (как 10.46); выбранное — в один ряд с прокруткой вбок свайпом; нажатие на полосу вверху закрывает.
# 10.49: шапка шторки прокручивается с фильтрами; на главной «Ваш город» компактнее, справа «Фильтр»; поиск 36dp;
# ряд условий под поиском — вбок свайпом, без кнопки «Фильтры».
# 10.50: поиск снова сверху (37dp), под ним «Ваш город · Фильтр» и ряд условий; плитки категорий на главной скрыты.
# 10.51: поиск 38dp, строка города 35dp, кнопки города и «Фильтр» 31dp; в шторке кнопки 48dp, поля цены 46dp.
# 10.52: картинка-шапка главной и ряд выбранных условий — на всю ширину экрана (на любом телефоне).
# 10.53: картинка по высоте — до строки города (без условий) или до низа ряда условий; кнопки и поля цены в шторке — толщиной со строку поиска.
# 10.54: чат (IvaChatPatch) — «Спросить об инструменте» без автосообщения; список «Чаты» по инструментам (аватар проката, картинка инструмента,
#        время и дата); закреплённые карточка инструмента и «Назад к чатам»; аватарки у сообщений; свои справа; под чатами — «Написать прокату».
# 10.55: заявка (IvaOrderPatch) — ФИО из профиля по полям; без выбора количества; свой срок у каждого инструмента; «+ Добавить инструмент»
#        (карточки того же проката; при доставке — только с доставкой и подсказка); доставка — средняя; в заявке один прокат.
# 10.56: уведомления (IvaNotifyPatch) — «Настройки» в кабинете: общий переключатель, «Новые сообщения», «Новые заявки» (админам),
#        «Обновления приложения»; свои каналы Android; штатный опрос заменён своим (те же запросы, учёт настроек).
# 10.57: открытый чат обновляется сам (раз в 4 с лёгкая проверка → штатный loadChat); уведомления — силуэт логотипа в строке
#        состояния, цветной логотип в шторке; в «Чате» не уведомляем только о видимом; первый запуск — непрочитанные за сутки.
# Остальные client hooks, polling и разрешения геолокации отключены.
# Проверки перед выдачей: тесты логики IvaPatch; пакет ru.prokatnvsk.app, версия 131 / 10.57;
# подпись проходит apksigner verify; сертификат = эталон ключа №6 (как в keystore-check.yml).
# Результат — артефакт ProkatInstrumenta-10.57 (APK + SHA-256). На ветке агента APK и app-test.json
# коммитятся в эту же ветку, а последний шаг сразу публикует тестовую сборку на боевом сайте в main
# (app-test.json читает жёлтая карточка «тестовая версия» владельца на сайте; выпущенный APK не перезаписывается).
# Тестовый канал: app-test.json лежит на том же сайте, что и страницы; поле apk — только имя файла
# ProkatInstrumenta-<версия>.apk. Имя ветки в фид не попадает и при смене сессии менять его не нужно.
# Секреты: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS — только через переменные окружения, не выводятся;
# файл ключа во временной папке, удаляется в конце. Из Pull Request (чужих веток) не запускается.
# Запуск: при изменении этого файла или android/patches/**; workflow_dispatch доступен после слияния в main.
# Ветка агента в этом файле НЕ прописана: запуск — на main и arena/**, шаг коммита в ветку — только arena/**.
# Откат: git revert коммита с этим файлом; APK 10.14 остаётся в репозитории.
name: Сборка приложения
on:
  push:
    branches: ['main', 'arena/**']
    paths: ['.github/workflows/build-apk.yml', 'android/patches/**', 'tools/publish-test-apk.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false
env:
  SRC_APK: ProkatInstrumenta-10.14.apk
  OLD_NAME: '10.14'
  NEW_NAME: '10.124'
  NEW_CODE: '198'
  APKTOOL_VER: '2.10.0'
  # Тестовый канал (жёлтая карточка владельца на сайте): описание сборки для app-test.json
  TEST_NOTES: 'Тестовая сборка 10.124. Разные сроки — в одной заявке: внутри по срокам, у каждого инструмента чек (цена × сутки), итог по сроку, своя подсветка, таймер и «Вернули» (после SQL 20261115). Карточки заявок подсвечены: зелёным — новые, жёлтым — выданные, красным — срок вышел; закрытые без подсветки.'
  TEST_REINSTALL: 'false'  # 10.15–10.57 подписаны одним ключом №6 — ставится поверх, удалять не нужно
  # Эталон ключа №6 (решение №22, 05.10.2026) — тот же, что в keystore-check.yml и docs/КЛЮЧ-ПОДПИСИ.md
  EXPECTED: 5D2B9F8BB54AD0B816A779B5991746957EBD6FA056D8A63D1D1635077BED5DDE
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Старый app-test и список сохранённых APK нужны шагу публикации: при переносе
          # фида на 10.20 предыдущая тестовая версия не должна стать «мёртвым» файлом.
          sparse-checkout: |
            ProkatInstrumenta-10.14.apk
            ProkatInstrumenta-*.apk
            app-test.json
            app-keep-apks.txt
            android/patches
            tools/publish-test-apk.py
            # 10.81: IvaPatchTest проверяет автоподбор на настоящем словаре и общих случаях (как сайт)
            supabase/migrations/20261015_category_tree.sql
            supabase/migrations/20261016_kind_words.sql
            tests/kind-guess-cases.txt
            # 10.82: IvaPatchTest проверяет поиск моделей на настоящем справочнике и общих случаях (как сайт)
            supabase/migrations/20261017_models.sql
            supabase/migrations/20261017_models_data_*.sql
            tests/model-search-cases.txt
            # 10.84: IvaPatchTest проверяет предложения, комплектацию, описание и цену на общих случаях и настоящей комплектации
            tests/model-stage4-cases.txt
            supabase/models/kit.txt
            # 10.85: IvaPatchTest проверяет фильтр по характеристикам на общих случаях (как сайт)
            tests/spec-filter-cases.txt
            # 10.86: IvaPatchTest проверяет поля формы («Питание», напряжение) на общих случаях (как сайт)
            tests/form-fields-cases.txt
            # 10.92: IvaPatchTest проверяет «Цензуру» на общих случаях (их же — база, tools/censor-stand.py)
            tests/censor-cases.txt
            # 10.100: свой звук уведомлений (файл владельца без тегов) — кладётся в APK как assets/iva_notify.mp3
            android/sounds/iva_notify.mp3
          sparse-checkout-cone-mode: false

      - name: Инструменты
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          PLAT="$ANDROID_HOME/platforms/$(ls "$ANDROID_HOME/platforms" | grep -E '^android-[0-9]+$' | sort -t- -k2 -n | tail -1)"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$PLAT/android.jar" >> "$GITHUB_ENV"
          # Повторы: 12.10.2026 сборка 10.46 упала на разовой ошибке скачивания apktool (curl 22).
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar"
          echo "apktool ${APKTOOL_VER}: $(sha256sum "$RUNNER_TEMP/apktool.jar" | cut -c1-16)…; build-tools: $(basename "$BT"); $(basename "$PLAT"); $(javac -version 2>&1)"

      - name: Компиляция и тесты IvaPatch
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/cls"
          mkdir -p "$C"
          # Ошибки компилятора и проваленные проверки дублируются в аннотации задачи.
          fail() { grep -E "$2" "$1" 2>/dev/null | while IFS= read -r l; do echo "::error title=$3::$l"; done; exit 1; }
          if ! javac -encoding UTF-8 -source 8 -target 8 -nowarn -bootclasspath "$ANDROID_JAR" -d "$C" android/patches/IvaPatch.java android/patches/IvaClientPatch.java android/patches/IvaSearchPatch.java android/patches/IvaChatPatch.java android/patches/IvaOrderPatch.java android/patches/IvaNotifyPatch.java android/patches/IvaReviewPatch.java android/patches/IvaPushPatch.java android/patches/IvaRentPatch.java android/patches/IvaKindPatch.java android/patches/IvaModelPatch.java android/patches/IvaFormPatch.java android/patches/IvaPhotoPatch.java android/patches/IvaCensorPatch.java android/patches/IvaChiefPatch.java android/patches/IvaTestPatch.java android/patches/IvaPickupPatch.java android/patches/IvaAvatarPatch.java android/patches/IvaShopPatch.java android/patches/IvaSoundPatch.java android/patches/IvaToolPointPatch.java android/patches/IvaOrderPointPatch.java android/patches/IvaStaffPatch.java android/patches/IvaStaffOrdersPatch.java android/patches/IvaStaffToolsPatch.java android/patches/IvaStaffChatPatch.java android/patches/IvaStaffJournalPatch.java android/patches/IvaAdminsPatch.java android/patches/IvaAccessPatch.java android/patches/IvaRealtimePatch.java android/patches/IvaLogoPatch.java android/patches/IvaProkatPatch.java android/patches/IvaOrderViewPatch.java android/patches/IvaMyToolsPatch.java android/patches/IvaToolEditPatch.java android/patches/IvaChatWhoPatch.java android/patches/IvaOrderEditPatch.java 2>&1 | tee "$RUNNER_TEMP/j1.log"; then
            fail "$RUNNER_TEMP/j1.log" 'error:|ошибка:' 'Компиляция IvaPatch'
          fi
          T="$RUNNER_TEMP/tcls"
          mkdir -p "$T"
          if ! javac -encoding UTF-8 -cp "$C:$ANDROID_JAR" -d "$T" android/patches/test/IvaPatchTest.java 2>&1 | tee "$RUNNER_TEMP/j2.log"; then
            fail "$RUNNER_TEMP/j2.log" 'error:|ошибка:' 'Компиляция теста IvaPatch'
          fi
          if ! java -Dfile.encoding=UTF-8 -cp "$T:$C:$ANDROID_JAR" ru.prokatnvsk.app.IvaPatchTest 2>&1 | tee "$RUNNER_TEMP/j3.log"; then
            fail "$RUNNER_TEMP/j3.log" '^✘|Exception' 'Тест IvaPatch'
          fi
          mkdir -p "$RUNNER_TEMP/dex"
          "$BT/d8" --release --min-api 21 --lib "$ANDROID_JAR" --output "$RUNNER_TEMP/dex" $(find "$C" -name '*.class')
          ls -la "$RUNNER_TEMP/dex"

      - name: Разбор, патч, версия
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/w"
          java -jar "$RUNNER_TEMP/apktool.jar" d -r -f -o "$W" "$SRC_APK"
          echo "::notice title=Разбор::APK разобран apktool"
          if ! python3 android/patches/apply.py "$W" "$NEW_CODE" "$NEW_NAME"; then
            M="$W/smali/ru/prokatnvsk/app/MainActivity.smali"
            echo "::notice title=Подсказка::$(grep -cE '^\.method' "$M" 2>/dev/null) методов; $(grep -E '^\.method.*(calcDelivery|updateSummary|paintDelToggle|showAdmHub|showTab)' "$M" | cut -c1-90 | tr '\n' '|')"
            exit 1
          fi
          python3 android/patches/axml_version.py "$W/AndroidManifest.xml" "$OLD_NAME" "$NEW_NAME" "$NEW_CODE"
          echo "::notice title=Версия::манифест обновлён; диагностические разрешения геолокации не добавлялись"
          # 10.65: служба фоновой проверки уведомлений (этап 2, JobScheduler) + RECEIVE_BOOT_COMPLETED — после перезагрузки сама
          python3 android/patches/axml_service.py "$W/AndroidManifest.xml"
          echo "::notice title=Манифест::служба уведомлений IvaNotifyPatch\$Bg (BIND_JOB_SERVICE) и RECEIVE_BOOT_COMPLETED"
          # 10.74: мгновенные уведомления админам (FCM): приёмник IvaPushPatch\$Rx, c2dm RECEIVE, queries com.google.android.gms
          python3 android/patches/axml_push.py "$W/AndroidManifest.xml"
          echo "::notice title=Манифест::приёмник push IvaPushPatch\$Rx (c2dm SEND/RECEIVE) и queries сервисов Google"
          # 10.80: разрешение на установку обновления — без него системный установщик молча отменял установку
          python3 android/patches/axml_install.py "$W/AndroidManifest.xml"
          echo "::notice title=Манифест::разрешение REQUEST_INSTALL_PACKAGES — кнопка «Обновить до версии N» ставит сразу"
          # 10.96 (решение владельца 16.10.2026): все залитые оранжевым кнопки и элементы — «рамкой», как «Добавить» в «Пункт выдачи»
          python3 android/patches/axml_outline.py "$W"
          # 10.100 (решение владельца 16.10.2026): свой звук у всех уведомлений — провайдер IvaSoundPatch$Files отдаёт его системе
          python3 android/patches/axml_sound.py "$W/AndroidManifest.xml"
          echo "::notice title=Манифест::провайдер звука уведомлений IvaSoundPatch\$Files (ru.prokatnvsk.app.ivasound, только чтение)"
          N=$(ls -d "$W"/smali_classes* 2>/dev/null | wc -l)
          echo "дополнительных dex: $N"
          echo "::notice title=Разбор::подготовка к пересборке (дополнительных dex: $N)"
          if ! java -jar "$RUNNER_TEMP/apktool.jar" b -o "$RUNNER_TEMP/unsigned.apk" "$W" >"$RUNNER_TEMP/apktool-build.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/apktool-build.log" | while IFS= read -r line; do echo "::error title=Apktool::$line"; done
            exit 1
          fi
          echo "::notice title=Разбор::APK пересобран apktool"
          # IvaPatch и IvaClientPatch — следующим dex-файлом (classes3.dex при двух исходных).
          NEXT=$(( $(unzip -Z1 "$RUNNER_TEMP/unsigned.apk" | grep -cE '^classes[0-9]*\.dex$') + 1 ))
          mkdir -p "$RUNNER_TEMP/add"
          cp "$RUNNER_TEMP/dex/classes.dex" "$RUNNER_TEMP/add/classes$NEXT.dex"
          (cd "$RUNNER_TEMP/add" && zip -q -X "$RUNNER_TEMP/unsigned.apk" "classes$NEXT.dex")
          # 10.100: звук уведомлений — assets/iva_notify.mp3 (без сжатия)
          mkdir -p "$RUNNER_TEMP/snd/assets"
          cp android/sounds/iva_notify.mp3 "$RUNNER_TEMP/snd/assets/iva_notify.mp3"
          (cd "$RUNNER_TEMP/snd" && zip -q -X -0 "$RUNNER_TEMP/unsigned.apk" assets/iva_notify.mp3)
          echo "::notice title=Звук::assets/iva_notify.mp3 добавлен в APK ($(stat -c %s android/sounds/iva_notify.mp3) байт)"
          unzip -Z1 "$RUNNER_TEMP/unsigned.apk" | grep dex
          echo "::notice title=Разбор::IvaPatch, IvaClientPatch, IvaSearchPatch, IvaChatPatch, IvaOrderPatch, IvaNotifyPatch, IvaReviewPatch и IvaPushPatch добавлены в classes$NEXT.dex; на главной строка Ваш город и шторка фильтров, чат по инструментам (обновляется сам), заявка со сроком у каждого инструмента, настройки уведомлений с логотипом"

      - name: Выравнивание и подпись
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          bad() { echo "::error title=Сборка::$1"; exit 1; }
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] || bad "нет секретов ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS"
          export KS="$RUNNER_TEMP/ks.p12"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$KS"
          ALIAS=$(keytool -J-Duser.language=en -list -keystore "$KS" -storepass:env KS_PASS | grep -i 'PrivateKeyEntry' | head -1 | cut -d, -f1)
          [ -n "$ALIAS" ] || bad "в ключе нет закрытого ключа"
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias "$ALIAS" \
            --out "out/ProkatInstrumenta-$NEW_NAME.apk" "$RUNNER_TEMP/aligned.apk" >/dev/null 2>&1 || bad "подпись не прошла"
          rm -f out/*.idsig

      - name: Проверка результата
        run: |
          set -euo pipefail
          bad() { echo "::error title=Сборка::$1"; exit 1; }
          A="out/ProkatInstrumenta-$NEW_NAME.apk"
          "$BT/apksigner" verify "$A" || bad "apksigner verify не прошёл"
          CERT=$("$BT/apksigner" verify --print-certs "$A" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          [ "${CERT^^}" = "$EXPECTED" ] || bad "сертификат ${CERT:0:8}… не равен эталону ключа №6"
          B=$("$BT/aapt2" dump badging "$A" | head -1)
          echo "$B"
          echo "$B" | grep -q "name='ru.prokatnvsk.app'" || bad "не тот пакет"
          echo "$B" | grep -q "versionCode='$NEW_CODE'" || bad "versionCode не $NEW_CODE"
          echo "$B" | grep -q "versionName='$NEW_NAME'" || bad "versionName не $NEW_NAME"
          unzip -p "$A" 'classes*.dex' | grep -c -a 'Lru/prokatnvsk/app/IvaPatch;' >/dev/null || bad "в APK нет IvaPatch"
          "$BT/aapt2" dump badging "$A" | grep -q "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" || bad "в манифесте нет разрешения на установку обновления"
          [ "$(unzip -Z1 "$A" | grep -cx 'assets/iva_notify.mp3')" = 1 ] || bad "в APK нет звука уведомлений assets/iva_notify.mp3"
          [ "$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$A" | grep -c 'ru.prokatnvsk.app.ivasound')" -ge 1 ] || bad "в манифесте нет провайдера звука"
          SUM=$(sha256sum "$A" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$A")
          echo "$SUM  ProkatInstrumenta-$NEW_NAME.apk" > out/SHA256.txt
          echo "::notice title=Сборка::✔ ProkatInstrumenta-$NEW_NAME.apk ($NEW_CODE), $SIZE байт, SHA-256 ${SUM:0:16}…, подпись ключом №6 = эталон"

      - uses: actions/upload-artifact@v4
        with:
          name: ProkatInstrumenta-${{ env.NEW_NAME }}
          path: out/
          retention-days: 30

      - name: Положить APK в ветку агента
        if: startsWith(github.ref, 'refs/heads/arena/')
        run: |
          set -euo pipefail
          F="ProkatInstrumenta-$NEW_NAME.apk"
          # Проверенная версия с тем же именем никогда не перезаписывается.
          if git cat-file -e "HEAD:$F" 2>/dev/null; then
            echo "::notice title=Сборка::$F уже есть в ветке — не перезаписываю (для изменений поднимите NEW_NAME/NEW_CODE)"
            exit 0
          fi
          python3 tools/publish-test-apk.py --site . --apk "out/$F" --code "$NEW_CODE" --name "$NEW_NAME" \
            --notes "$TEST_NOTES" --reinstall "$TEST_REINSTALL"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f "$F" app-test.json app-keep-apks.txt 2>add.err \
            || { echo "::error title=Сборка::git add: $(head -c 300 add.err | tr '\n' ' ')"; exit 1; }
          if git diff --cached --quiet; then
            echo "::notice title=Сборка::на ветке уже всё как надо"
            exit 0
          fi
          git commit -q -m "Сборка $NEW_NAME ($NEW_CODE): APK из Actions, подпись ключом №6 = эталон; $(sha256sum "$F" | cut -c1-16)…; app-test.json"
          B="${GITHUB_REF#refs/heads/}"
          ok=""
          for i in 1 2 3; do
            if git push -q origin "HEAD:$B" 2>push.err; then ok=1; break; fi
            git fetch -q --depth=50 origin "$B" && git rebase -q "origin/$B" 2>>push.err || true
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error title=Сборка::push: $(head -c 300 push.err | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Сборка::APK положен в ветку $B: $F ($(git rev-parse --short HEAD))"

      - name: Выложить тестовую сборку на боевой сайт (без слияния PR)
        if: startsWith(github.ref, 'refs/heads/arena/') || github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bad() { echo "::error title=Сборка::$1"; exit 1; }
          F="ProkatInstrumenta-$NEW_NAME.apk"
          D="$RUNNER_TEMP/live"
          git clone -q --depth 1 --branch main "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$D" \
            || bad "не удалось склонировать боевой сайт (main)"
          # Скрипт пишет только имя APK в app-test.json, сохраняет предыдущий тестовый APK
          # в app-keep-apks.txt и отказывается перезаписывать существующий файл.
          # Повторный запуск той же сборки идемпотентен: уже проверенный файл и feed оставляем как есть.
          if git -C "$D" cat-file -e "HEAD:$F" 2>/dev/null; then
            if python3 -c 'import json,sys; f=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(not (f.get("versionCode") == int(sys.argv[2]) and f.get("versionName") == sys.argv[3] and f.get("apk") == sys.argv[4]))' "$D/app-test.json" "$NEW_CODE" "$NEW_NAME" "$F"; then
              echo "::notice title=Сборка::тестовая сборка $F уже опубликована на main — не перезаписываю"
              exit 0
            fi
            bad "$F уже есть на main, но app-test.json не соответствует $NEW_NAME/$NEW_CODE"
          fi
          python3 "$GITHUB_WORKSPACE/tools/publish-test-apk.py" --site "$D" --apk "$GITHUB_WORKSPACE/out/$F" \
            --code "$NEW_CODE" --name "$NEW_NAME" --notes "$TEST_NOTES" --reinstall "$TEST_REINSTALL" \
            || bad "публикация тестовой сборки на сайт"
          cd "$D"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f "$F" app-test.json app-keep-apks.txt 2>add.err \
            || { echo "::error title=Сборка::git add: $(head -c 300 add.err | tr '\n' ' ')"; exit 1; }
          if git diff --cached --quiet; then
            echo "::notice title=Сборка::тестовая сборка на сайте уже всё как надо"
            exit 0
          fi
          git commit -q -m "Тестовая сборка $NEW_NAME ($NEW_CODE) [test-apk]: $F и app-test.json на сайте — только для владельца"
          ok=""
          for i in 1 2 3; do
            if git push -q origin HEAD:main 2>push.err; then ok=1; break; fi
            # Пока push не прошёл, подтягиваем свежий main и заново строим только
            # временный коммит. Это безопасно: D — отдельный клон, APK уже проверен.
            git fetch -q origin main 2>>push.err || true
            git reset --hard -q origin/main || true
            python3 "$GITHUB_WORKSPACE/tools/publish-test-apk.py" --site "$D" --apk "$GITHUB_WORKSPACE/out/$F" \
              --code "$NEW_CODE" --name "$NEW_NAME" --notes "$TEST_NOTES" --reinstall "$TEST_REINSTALL" \
              || bad "повторная публикация тестовой сборки на сайт"
            git add -f "$F" app-test.json app-keep-apks.txt 2>>add.err || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Тестовая сборка $NEW_NAME ($NEW_CODE) [test-apk]: $F и app-test.json на сайте — только для владельца" || true
            fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error title=Сборка::push в main: $(head -c 300 push.err | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Сборка::тестовая сборка на сайте: $F — жёлтая карточка владельца"
