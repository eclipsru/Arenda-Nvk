<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Передача заказа на аренду — Ива</title>
<meta name="description" content="Сервис передачи клиентских заказов проверенным пунктам проката инструмента.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css?v=20260924-app-banner-v2">
<link rel="stylesheet" href="assets/partners.css?v=20260923-info-spacing">
<style>
.claim-card {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: var(--r-l);
  padding: 24px;
  max-width: 620px;
  margin: 30px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
.order-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(46,204,113,0.15);
  color: var(--grn);
  border: 1px solid rgba(46,204,113,0.3);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--bdr);
  font-size: 14.5px;
}
.info-row:last-of-type { border-bottom: none; }
.info-label { color: var(--g2); }
.info-val { font-weight: 600; text-align: right; }
.claim-btn {
  width: 100%;
  padding: 15px;
  font-size: 16px;
  font-weight: 700;
  border-radius: var(--r-m);
  background: var(--or);
  color: #fff;
  border: none;
  cursor: pointer;
  margin-top: 20px;
  transition: all .15s;
}
.claim-btn:hover { opacity: .9; }
.claim-btn:disabled { opacity: .5; cursor: not-allowed; }
.timer-box {
  background: rgba(255,183,77,0.1);
  border: 1px dashed rgba(255,183,77,0.4);
  padding: 10px 14px;
  border-radius: var(--r-m);
  font-size: 13.5px;
  color: var(--yel);
  margin-top: 15px;
  text-align: center;
}
.contact-revealed {
  background: rgba(46,204,113,0.12);
  border: 1px solid rgba(46,204,113,0.4);
  border-radius: var(--r-m);
  padding: 16px;
  margin-top: 20px;
}
.contact-phone {
  font-size: 20px;
  font-weight: 800;
  color: var(--grn);
  display: block;
  margin: 6px 0;
  letter-spacing: .5px;
}
</style>
</head>
<body>
<div id="hdr"></div>

<main class="page">
  <div class="wrap">
    <div id="claimRoot" class="claim-card">
      <div class="empty"><b>Загрузка данных заказа…</b></div>
    </div>
  </div>
</main>

<div id="ftr"></div>
<div id="bnav"></div>

<script src="assets/data.js"></script>
<script src="assets/geo.js?v=20260923-photon"></script>
<script src="assets/sb.js?v=20260923-photon"></script>
<script src="assets/app.js?v=20260924-app-banner-v2"></script>
<script>
(async function(){
  mountChrome('claim', '');
  const root = $('claimRoot');
  const params = new URLSearchParams(location.search);
  const orderId = params.get('id');

  if (!orderId) {
    root.innerHTML = '<div class="empty"><b>Заказ не указан</b><p>Перейдите по ссылке из сообщения в WhatsApp.</p></div>';
    return;
  }

  try {
    // 1. Проверяем заказ
    const orders = await api('/rest/v1/orders?id=eq.' + encodeURIComponent(orderId) + '&select=*');
    if (!orders || !orders.length) {
      root.innerHTML = '<div class="empty"><b>Заказ №' + esc(orderId) + ' не найден</b><p>Возможно, он был отменен или срок давности истек.</p></div>';
      return;
    }
    const o = orders[0];

    // 2. Проверяем claim
    const claims = await api('/rest/v1/order_claims?order_id=eq.' + encodeURIComponent(orderId) + '&status=eq.taken&select=*');
    const isTaken = claims && claims.length > 0;

    let h = '<div class="order-badge">🔥 Горячий клиентский заказ №' + esc(o.id) + '</div>';
    h += '<h2 style="font-size:20px;margin-bottom:14px">Заявка на прокат оборудования</h2>';
    h += '<div class="info-row"><span class="info-label">Инструмент:</span><span class="info-val">' + esc(o.tools || 'Оборудование') + '</span></div>';
    h += '<div class="info-row"><span class="info-label">Срок аренды:</span><span class="info-val">' + (o.days || 1) + ' сут.</span></div>';
    h += '<div class="info-row"><span class="info-label">Адрес / Локация:</span><span class="info-val">' + esc(o.address || o.get_method || 'Уточняется') + '</span></div>';
    h += '<div class="info-row"><span class="info-label">Дата заявки:</span><span class="info-val">' + new Date(o.created_at).toLocaleString('ru-RU') + '</span></div>';

    if (isTaken) {
      const c = claims[0];
      h += '<div style="margin-top:20px;padding:16px;background:rgba(239,83,80,0.12);border:1px solid rgba(239,83,80,0.3);border-radius:var(--r-m);">' +
        '<b style="color:var(--red);display:block;margin-bottom:4px">⚠️ Заказ уже передан другому прокату</b>' +
        '<p class="small muted">Этот клиентский заказ уже забрала организация <b>' + esc(c.claimed_by_name || 'Партнер сети') + '</b>.<br>' +
        'Подключитесь к сети «Ива», чтобы успевать забирать следующие заказы первыми!</p>' +
        '<div style="margin-top:14px"><a href="landlord-register.html" class="btn sm" style="display:inline-block">Стать постоянным партнером</a></div>' +
        '</div>';
      root.innerHTML = h;
      return;
    }

    h += '<div class="timer-box">⚡ <b>0% комиссии на этот заказ!</b> Заберите прямой контакт клиента и закройте сделку самостоятельно. Заказ доступен первому подтвердившему.</div>';
    
    h += '<form id="claimForm" style="margin-top:20px">' +
      '<div class="f-grp" style="margin-bottom:12px">' +
        '<label style="display:block;font-size:13px;color:var(--g2);margin-bottom:5px">Название вашего проката / базы:</label>' +
        '<input type="text" id="renterName" class="f-inp" placeholder="Например: Прокат на Советской / ИП Иванов" required style="width:100%">' +
      '</div>' +
      '<div class="f-grp" style="margin-bottom:12px">' +
        '<label style="display:block;font-size:13px;color:var(--g2);margin-bottom:5px">Контактный телефон (для связи диспетчера):</label>' +
        '<input type="tel" id="renterPhone" class="f-inp" placeholder="+7 9XX XXX-XX-XX" required style="width:100%">' +
      '</div>' +
      '<button type="submit" class="claim-btn">👉 Забрать контакт клиента бесплатно</button>' +
      '</form>';

    root.innerHTML = h;

    $('claimForm').addEventListener('submit', async function(ev){
      ev.preventDefault();
      const rName = $('renterName').value.trim();
      const rPhone = $('renterPhone').value.trim();
      if (!rName || !rPhone) return;

      const btn = ev.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Подтверждение…';

      try {
        await api('/rest/v1/order_claims', {
          method: 'POST',
          body: JSON.stringify({
            order_id: o.id,
            claimed_by_name: rName,
            claimed_by_phone: rPhone,
            claimed_at: new Date().toISOString(),
            status: 'taken'
          })
        });

        root.innerHTML = '<div class="order-badge">✅ Заказ успешно закреплен за вами!</div>' +
          '<h2 style="font-size:20px;margin-bottom:10px">Контакты клиента</h2>' +
          '<div class="contact-revealed">' +
            '<div class="small muted">Имя арендатора:</div>' +
            '<div style="font-size:17px;font-weight:700">' + esc(o.name || 'Клиент') + '</div>' +
            '<div class="small muted" style="margin-top:10px">Прямой телефон арендатора:</div>' +
            '<a href="tel:' + esc(o.phone) + '" class="contact-phone">' + esc(o.phone) + '</a>' +
            '<div style="display:flex;gap:10px;margin-top:10px">' +
              '<a href="tel:' + esc(o.phone) + '" class="btn sm">Позвонить клиенту</a>' +
              '<a href="https://wa.me/' + esc((o.phone||'').replace(/\D/g,'')) + '" target="_blank" class="btn sm sec">Написать в WhatsApp</a>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:20px;font-size:14px;color:var(--g2);line-height:1.5">' +
            '<b>Что делать дальше:</b> свяжитесь с клиентом прямо сейчас, согласуйте время выдачи или доставки и оформите договор.<br><br>' +
            'Хотите получать все заявки вашего города на постоянной основе?' +
          '</div>' +
          '<div style="margin-top:14px"><a href="landlord-register.html" class="btn sm" style="display:inline-block">Подключить весь каталог бесплатно</a></div>';
      } catch(err) {
        alert('Ошибка закрепления заказа: ' + err.message);
        btn.disabled = false;
        btn.textContent = '👉 Забрать контакт клиента бесплатно';
      }
    });

  } catch(e) {
    root.innerHTML = '<div class="empty"><b>Ошибка</b><p>' + esc(e.message) + '</p></div>';
  }
})();
</script>
</body>
</html>
