<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Объявление — Ива, аренда инструмента</title>
<meta name="theme-color" content="#101217">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css?v=20260924-app-banner-v2">
<link rel="stylesheet" href="assets/profile.css?v=20260923-rental-profile">
<link rel="stylesheet" href="assets/geo.css?v=20260923-photon">
<style>
.toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  user-select:none;transition:.15s}
.toggle-row:hover{border-color:var(--line-2)}
.toggle-row .tg-info{flex:1;min-width:0;padding-right:12px}
.toggle-row .tg-title{font-weight:600;font-size:14px}
.toggle-row .tg-sub{font-size:12.5px;color:var(--g2);margin-top:2px}
.sw{position:relative;width:44px;height:24px;background:var(--line-2);border-radius:12px;
  flex:0 0 44px;cursor:pointer;transition:background .2s ease;display:inline-block}
.sw.on{background:var(--or)}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on i{transform:translateX(20px)}
.no-delivery-banner{background:rgba(255,138,128,.12);border:1px solid rgba(255,138,128,.3);
  color:var(--red);padding:11px 14px;border-radius:10px;font-size:13.5px;display:flex;align-items:center;gap:10px}
</style>
</head>
<body>

<div id="hdr"></div>

<main class="page">
  <div class="wrap" id="root"></div>
</main>

<div id="ftr"></div>
<div id="bnav"></div>

<script src="assets/data.js"></script>
<script src="assets/geo.js?v=20260923-photon"></script>
<script src="assets/sb.js?v=20260924-order-fee"></script>
<script src="assets/app.js?v=20260924-apk-recovery"></script>
<script>
(async function(){
  mountChrome('', '');

  var id = new URLSearchParams(location.search).get('id');
  await hydrateShowcase();          /* сначала живые данные */
  var ad = adById(id);

  /* ---------- Объявление не найдено ---------- */
  if (!ad){
    $('root').innerHTML =
      '<div class="empty" style="padding:80px 20px">' +
        '<svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>' +
        '<b>Объявление не найдено</b>' +
        '<p>Возможно, его сняли с публикации или ссылка устарела.</p>' +
        '<a class="btn" href="catalog.html">Перейти в каталог</a>' +
      '</div>';
    return;
  }

  document.title = ad.name + ' — аренда в ' + ad.city + ' | Ива';

  var owner = Object.assign({},ownerById(ad.owner));
  var publicRental = null;
  try {
    var profileRows=await api('/rest/v1/landlord_profiles?select=details,locations&owner_email=eq.'+encodeURIComponent(ad.owner));
    publicRental=profileRows&&profileRows[0]||null;
    if(publicRental){owner.name=publicRental.details.display_name||owner.name;owner.phone=publicRental.details.phone||owner.phone;}
  }catch(e){} // Дополнительный профиль не должен блокировать объявление.
  var contactBlock='';
  if(publicRental){
    var rd=publicRental.details;
    contactBlock='<div class="public-pickups"><p><b>Рабочий телефон:</b> <a href="tel:'+owner.phone.replace(/[^\d+]/g,'')+'">'+esc(owner.phone)+'</a></p>'+
      (rd.contact_name?'<p>Контакт: '+esc(rd.contact_name)+(rd.contact_role?' · '+esc(rd.contact_role):'')+'</p>':'')+
      (rd.public_email?'<p>Email: '+esc(rd.public_email)+'</p>':'')+
      ((publicRental.locations||[]).length?'<details><summary>Все точки выдачи арендодателя ('+publicRental.locations.length+')</summary><p class="muted">Наличие этого инструмента в конкретной точке уточняйте у арендодателя.</p>'+publicRental.locations.map(function(p){return '<p><b>'+esc(p.name)+'</b><br>'+esc(p.city+', '+p.address)+(p.hours?'<br>'+esc(p.hours):'')+(p.phone?'<br>Телефон: '+esc(p.phone):'')+(p.directions?'<br>'+esc(p.directions):'')+'<br><a target="_blank" rel="noopener noreferrer" href="https://yandex.ru/maps/?text='+encodeURIComponent(p.city+', '+p.address)+'">На карте ↗</a></p>';}).join('')+'</details>':'')+'</div>';
  }
  var dep = depositOf(ad);
  var photos = [];
  for (var i = 0; i < ad.photos; i++) photos.push(photoURL(ad, i));

  /* ---------- Характеристики ---------- */
  var specRows = '';
  specRows += '<div class="spec"><dt>Категория</dt><dd>' + esc(catTitle(ad.cat)) +
              (ad.sub ? ' · ' + esc(subTitle(ad.sub)) : '') + '</dd></div>';
  specRows += '<div class="spec"><dt>Состояние</dt><dd>' + esc(condTitle(ad.cond)) + '</dd></div>';
  Object.keys(ad.specs).forEach(function(k){
    specRows += '<div class="spec"><dt>' + esc(k) + '</dt><dd>' + esc(ad.specs[k]) + '</dd></div>';
  });
  specRows += '<div class="spec"><dt>Доставка</dt><dd>' +
    (ad.delivery ? ('Есть, ' + (ad.delivery_price || 40) + ' ₽/км') : 'Только самовывоз') + '</dd></div>';
  specRows += '<div class="spec"><dt>Минимальный срок</dt><dd>1 сутки</dd></div>';

  /* ---------- Похожие ---------- */
  var similar = ADS.filter(function(a){
    return a.status === 'active' && a.id !== ad.id && a.cat === ad.cat;
  }).slice(0, 4);
  if (similar.length < 4){
    ADS.forEach(function(a){
      if (similar.length < 4 && a.status === 'active' && a.id !== ad.id &&
          similar.indexOf(a) === -1) similar.push(a);
    });
  }

  /* ---------- Разметка ---------- */
  $('root').innerHTML = '' +
  '<nav class="small" style="padding:16px 0 4px;color:var(--g2)">' +
    '<a href="index.html" style="color:var(--gr)">Главная</a> · ' +
    '<a href="catalog.html?cat=' + ad.cat + '" style="color:var(--gr)">' + esc(catTitle(ad.cat)) + '</a>' +
    (ad.sub ? ' · <a href="catalog.html?cat=' + ad.cat + '&sub=' + ad.sub +
              '" style="color:var(--gr)">' + esc(subTitle(ad.sub)) + '</a>' : '') +
  '</nav>' +

  '<div class="tool-grid">' +
    /* --- Левая колонка --- */
    '<div>' +
      '<h1 class="t-title">' + esc(ad.name) + '</h1>' +
      '<div class="t-sub">' +
        '<span>' + esc(ad.city) + '</span>' +
        '<span>' + daysAgo(ad.days) + '</span>' +
        '<span class="badge act">Активно</span>' +
      '</div>' +

      /* Галерея */
      '<div class="gal-main">' +
        '<img id="gImg" src="' + photos[0] + '" alt="' + esc(ad.name) + '">' +
        (photos.length > 1 ?
          '<button class="gal-nav prev" id="gPrev" aria-label="Предыдущее фото">' + IC.left + '</button>' +
          '<button class="gal-nav next" id="gNext" aria-label="Следующее фото">' + IC.right + '</button>' +
          '<div class="gal-cnt"><span id="gCur">1</span> / ' + photos.length + '</div>' : '') +
      '</div>' +
      (photos.length > 1 ?
        '<div class="gal-thumbs" id="gThumbs">' +
          photos.map(function(src, i){
            return '<img src="' + src + '" data-i="' + i + '"' +
                   (i === 0 ? ' class="on"' : '') + ' alt="Фото ' + (i+1) + '">';
          }).join('') +
        '</div>' : '') +

      /* Описание */
      '<div class="box" style="margin-top:18px">' +
        '<h3>Описание</h3>' +
        '<p style="color:var(--gr);line-height:1.65">' + esc(ad.descr) + '</p>' +
      '</div>' +

      /* Характеристики */
      '<div class="box">' +
        '<h3>Характеристики</h3>' +
        '<dl class="specs">' + specRows + '</dl>' +
      '</div>' +

      /* Условия */
      '<div class="box">' +
        '<h3>Условия аренды</h3>' +
        '<p style="color:var(--gr);line-height:1.7;font-size:14px">' +
          'Документы: паспорт РФ, договор оформляется за пару минут.<br>' +
          'Залог возвращается полностью при исправном возврате инструмента.<br>' +
          'Оплата за сутки вперёд — наличными или переводом.<br>' +
          'Расходники (диски, буры, леска) — за счёт арендатора.' +
        '</p>' +
      '</div>' +

      /* Отзывы и рейтинг */
      '<div class="box reviews-box" id="reviewsBlock">' +
        '<div class="reviews-head">' +
          '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
            '<h3 style="margin:0">Отзывы об инструменте</h3>' +
            '<div id="reviewsSummary"></div>' +
          '</div>' +
        '</div>' +
        '<div id="reviewFormArea"></div>' +
        '<div id="reviewsList"><div style="color:var(--g2);padding:10px 0">Загрузка отзывов…</div></div>' +
      '</div>' +
    '</div>' +

    /* --- Правая колонка --- */
    '<aside class="side">' +
      '<div class="box">' +
        '<div class="price-big">' + rub(ad.price) + ' <span>/ сутки</span></div>' +
        '<div class="dep-line">' +
          '<span>Залог <b>' + rub(dep) + '</b> — возвращается при возврате</span>' +
        '</div>' +

        '<div style="display:flex;flex-direction:column;gap:9px;margin-top:16px">' +
          '<button class="btn wide" id="orderBtn">Оформить заявку</button>' +
          '<button class="btn sec wide" id="writeBtn">Написать</button>' +
          '<button class="btn sec wide phone-btn" id="phoneBtn">Показать телефон</button>' +
          '<button class="btn ghost wide" id="favBtn" data-fav="' + ad.id + '">' +
            (favHas(ad.id) ? 'В избранном ♥' : 'В избранное') +
          '</button>' +
        '</div>' +
      '</div>' +

      /* Арендодатель */
      '<div class="box">' +
        '<div class="owner">' +
          '<div class="ava">' + esc(initials(owner.name)) + '</div>' +
          '<div>' +
            '<div class="nm">' + esc(owner.name) +
              (owner.verified ? ' <span class="badge new" style="margin-left:4px">Проверен</span>' : '') +
            '</div>' +
            '<div class="rt" id="landlordRatingBlock"><span class="star">★</span>' + owner.rating.toFixed(1) +
              ' · ' + owner.deals + ' ' + plural(owner.deals,'сделка','сделки','сделок') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="small muted" style="margin-top:12px">' +
          'На площадке с ' + esc(owner.since) + '<br>' +
          'Выдача: ' + esc(((ad.terms||'').match(/Адрес выдачи:\s*(.+)/)||[])[1]||ad.city) +
        '</div>' + contactBlock +
      '</div>' +

      /* Безопасность */
      '<div class="box">' +
        '<h3 style="font-size:14px">Безопасная аренда</h3>' +
        '<p class="small muted" style="line-height:1.6">' +
          'Проверяйте инструмент при получении. Залог фиксируется в договоре ' +
          'и возвращается полностью, если техника исправна.' +
        '</p>' +
      '</div>' +
    '</aside>' +
  '</div>' +

  /* Похожие */
  (similar.length ?
    '<section class="sect">' +
      '<div class="sect-h"><h2>Похожие объявления</h2>' +
        '<a href="catalog.html?cat=' + ad.cat + '">Все в категории →</a></div>' +
      '<div class="grid">' + similar.map(adCard).join('') + '</div>' +
    '</section>' : '');

  /* ---------- Галерея ---------- */
  var cur = 0;
  function show(i){
    cur = (i + photos.length) % photos.length;
    $('gImg').src = photos[cur];
    var c = $('gCur'); if (c) c.textContent = cur + 1;
    $$('#gThumbs img').forEach(function(t, k){ t.classList.toggle('on', k === cur); });
  }
  if (photos.length > 1){
    $('gPrev').addEventListener('click', function(){ show(cur - 1); });
    $('gNext').addEventListener('click', function(){ show(cur + 1); });
    $('gThumbs').addEventListener('click', function(e){
      var t = e.target.closest('[data-i]');
      if (t) show(Number(t.getAttribute('data-i')));
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft') show(cur - 1);
      if (e.key === 'ArrowRight') show(cur + 1);
    });
    /* Свайп на мобильном */
    var x0 = null;
    var gm = $1('.gal-main');
    gm.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
    gm.addEventListener('touchend', function(e){
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 45) show(cur + (dx < 0 ? 1 : -1));
      x0 = null;
    }, {passive:true});
  }

  /* ---------- Кнопка «Оформить заявку» ---------- */
  $('orderBtn').addEventListener('click', async function(){
    if (!isAuthed()) await restoreSess();
    if ((ad.owner || '').toLowerCase() === A.me){
      toast('Это ваше объявление');
      return;
    }

    var pickupAddr = ((ad.terms||'').match(/Адрес выдачи:\s*(.+)/)||[])[1] || ad.pickup_city || ad.city || 'Уточняйте у арендодателя';
    var hasDelivery = !!ad.delivery;
    var delivRate = Number(ad.delivery_price) || 40;
    var defaultName = A.uname || (A.userMeta && (A.userMeta.full_name || A.userMeta.name)) || '';
    var defaultPhone = (A.userMeta && A.userMeta.phone) || (A.admin && A.admin.phone) || '';

    var days = 1;
    var isDelivery = false; // toggle switch for delivery
    var isRoundTrip = false; // toggle switch for round trip
    var savedAddr = '';
    var savedComment = '';
    var destCoords = null;
    var deliveryKm = 0;

    var originCoords = { lat: 47.4526182, lon: 40.1008652 }; // Базовая точка: Новочеркасск, ул. Маресьева, 36
    if (window.IvaGeo && pickupAddr){
      IvaGeo.search(pickupAddr, 'address').then(function(res){
        if (res && res[0] && res[0].coordinates){
          originCoords = { lat: res[0].coordinates[1], lon: res[0].coordinates[0] };
          if (destCoords) updateDistance();
        }
      }).catch(function(){});
    }

    function havDist(lat1, lon1, lat2, lon2){
      var R = 6371;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.max(1, Math.ceil(R * c));
    }

    function updateDistance(){
      if (destCoords){
        deliveryKm = havDist(originCoords.lat, originCoords.lon, destCoords.lat, destCoords.lon);
      } else {
        deliveryKm = 0;
      }
      renderOrderSheet();
    }

    function saveCurrentInputs(){
      var nm = $('ordName'), ph = $('ordPhone'), adInput = $('ordDeliveryAddr'), cm = $('ordComment');
      if (nm) defaultName = nm.value;
      if (ph) defaultPhone = ph.value;
      if (adInput) savedAddr = adInput.value;
      if (cm) savedComment = cm.value;
    }

    function renderOrderSheet(){
      var rentSum = (Number(ad.price) || 0) * days;
      var km = deliveryKm > 0 ? deliveryKm : 1;
      var oneWayCost = km * delivRate;
      var deliveryCost = isDelivery ? (isRoundTrip ? oneWayCost * 2 : oneWayCost) : 0;
      var totalSum = rentSum + dep + deliveryCost;

      var distText = '';
      if (isDelivery){
        if (deliveryKm > 0){
          distText = 'Расстояние: <b>' + deliveryKm + ' км</b> · ' + delivRate + ' ₽/км' +
            (isRoundTrip ? ' · <b>Туда и обратно (×2)</b> = <b>' + rub(deliveryCost) + '</b>' : ' = <b>' + rub(deliveryCost) + '</b>');
        } else if (savedAddr.trim()){
          distText = 'Расчёт: от <b>' + rub(deliveryCost) + '</b> (' + (isRoundTrip ? 'туда и обратно, 2 × ' : '') + '1 км по ' + delivRate + ' ₽/км, точный километраж подтвердит арендодатель).';
        } else {
          distText = 'Укажите адрес доставки для расчёта расстояния по тарифу ' + delivRate + ' ₽/км.';
        }
      }

      var deliverySectionHtml = '';
      if (!hasDelivery){
        deliverySectionHtml =
          '<div class="fld">' +
            '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Способ получения</label>' +
            '<div class="no-delivery-banner">' +
              '<b style="font-size:14px;white-space:nowrap">Доставки нет!</b>' +
              '<span style="color:var(--tx)">Только самовывоз: <b>' + esc(pickupAddr) + '</b></span>' +
            '</div>' +
          '</div>';
      } else {
        deliverySectionHtml =
          '<div class="fld">' +
            '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Способ получения</label>' +
            '<div class="toggle-row" id="rowDelivery">' +
              '<div class="tg-info">' +
                '<div class="tg-title">Доставка</div>' +
                '<div class="tg-sub">Стоимость по объявлению: ' + delivRate + ' ₽ за 1 км</div>' +
              '</div>' +
              '<div class="sw' + (isDelivery ? ' on' : '') + '" id="swDelivery"><i></i></div>' +
            '</div>' +
            (!isDelivery ?
              '<div style="font-size:13px;color:var(--gr);margin-top:6px;padding:2px 2px">' +
                'Выдача: Самовывоз, <b style="color:var(--tx)">' + esc(pickupAddr) + '</b>' +
              '</div>' :
              '<div id="deliveryDetailsBox" style="margin-top:10px;display:flex;flex-direction:column;gap:10px">' +
                '<div>' +
                  '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Адрес доставки *</label>' +
                  '<input class="inp" id="ordDeliveryAddr" placeholder="Город, улица, дом" value="' + esc(savedAddr) + '" autocomplete="street-address">' +
                  '<div id="delivDistCalc" style="font-size:12.5px;color:var(--gr);margin-top:6px;line-height:1.4">' + distText + '</div>' +
                '</div>' +
                '<div class="toggle-row" id="rowRoundTrip" style="background:var(--card);border-color:var(--line)">' +
                  '<div class="tg-info">' +
                    '<div class="tg-title">Туда и обратно</div>' +
                    '<div class="tg-sub">Доставка и возврат инструмента курьером (удваивает стоимость доставки)</div>' +
                  '</div>' +
                  '<div class="sw' + (isRoundTrip ? ' on' : '') + '" id="swRoundTrip"><i></i></div>' +
                '</div>' +
              '</div>'
            ) +
          '</div>';
      }

      var h =
        '<div class="order-sheet-wrap" style="display:flex;flex-direction:column;gap:13px">' +
          '<div style="display:flex;gap:12px;background:var(--field);padding:10px 12px;border-radius:10px;align-items:center">' +
            '<img src="' + photos[0] + '" style="width:54px;height:42px;object-fit:cover;border-radius:6px;background:#12151B" alt="">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(ad.name) + '</div>' +
              '<div style="font-size:12.5px;color:var(--gr)">' + rub(ad.price) + ' / сутки · залог ' + rub(dep) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="fld"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Ваше имя *</label>' +
            '<input class="inp" id="ordName" placeholder="Иван" value="' + esc(defaultName) + '" required maxlength="100"></div>' +

          '<div class="fld"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Телефон для связи *</label>' +
            '<input class="inp" id="ordPhone" type="tel" placeholder="+7 900 000-00-00" value="' + esc(defaultPhone) + '" required maxlength="50"></div>' +

          '<div class="fld">' +
            '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Срок аренды (дней)</label>' +
            '<div style="display:flex;align-items:center;gap:12px">' +
              '<button type="button" class="btn sec sm" id="ordMinus" style="width:38px;padding:6px 0;font-size:18px;font-weight:700">−</button>' +
              '<span id="ordDays" style="font-size:16px;font-weight:700;min-width:28px;text-align:center">' + days + '</span>' +
              '<button type="button" class="btn sec sm" id="ordPlus" style="width:38px;padding:6px 0;font-size:18px;font-weight:700">+</button>' +
              '<span class="small muted" id="ordDaysNote">' + days + ' ' + plural(days, 'сутки', 'суток', 'суток') + '</span>' +
            '</div>' +
          '</div>' +

          deliverySectionHtml +

          '<div class="fld"><label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Комментарий (необязательно)</label>' +
            '<textarea class="inp" id="ordComment" rows="2" placeholder="Удобное время встречи или пожелания">' + esc(savedComment) + '</textarea></div>' +

          /* Чек заказа */
          '<div class="card" style="background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px">' +
            '<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">' +
              '<span class="muted">Аренда (' + days + ' ' + plural(days,'сут.','сут.','сут.') + '):</span>' +
              '<b>' + rub(rentSum) + '</b>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">' +
              '<span class="muted">Возвратный залог:</span>' +
              '<b>' + rub(dep) + '</b>' +
            '</div>' +
            (isDelivery ?
              '<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">' +
                '<span class="muted">Доставка ' + (isRoundTrip ? '(туда и обратно' + (deliveryKm ? ', 2 × ' + deliveryKm + ' км' : '') + ')' : (deliveryKm ? '(' + deliveryKm + ' км)' : '')) + ':</span>' +
                '<b style="color:var(--or)">' + (deliveryCost > 0 ? rub(deliveryCost) : (delivRate + ' ₽/км')) + '</b>' +
              '</div>' :
              '<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">' +
                '<span class="muted">Получение:</span>' +
                '<b>Самовывоз (0 ₽)</b>' +
              '</div>'
            ) +
            '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:6px">' +
              '<span>Итого при получении:</span>' +
              '<span style="color:var(--or)">' + rub(totalSum) + '</span>' +
            '</div>' +
            '<p class="small muted" style="margin:6px 0 0;font-size:12px;line-height:1.4">' +
              'Залог фиксируется в договоре и возвращается полностью после возврата исправной техники.' +
            '</p>' +
          '</div>' +
          '<div id="ordErr" style="color:var(--red);font-size:13px;display:none"></div>' +
        '</div>';

      var f =
        '<button class="btn sec" id="ordCancel" style="flex:1">Отмена</button>' +
        '<button class="btn" id="ordSend" style="flex:2">Отправить заявку</button>';

      openSheet('Оформление заявки', h, f);

      var addrInp = $('ordDeliveryAddr');
      if (isDelivery && addrInp && window.IvaGeo){
        IvaGeo.attach(addrInp, { mode:'address' });
        addrInp.addEventListener('geo:select', function(e){
          var detail = e.detail;
          if (detail && detail.coordinates){
            destCoords = { lat: detail.coordinates[1], lon: detail.coordinates[0] };
            deliveryKm = havDist(originCoords.lat, originCoords.lon, destCoords.lat, destCoords.lon);
            renderOrderSheet();
          }
        });
        addrInp.addEventListener('change', function(){
          savedAddr = this.value;
          if (window.IvaGeo && this.value.trim().length >= 4 && !destCoords){
            IvaGeo.search(this.value.trim(), 'address').then(function(res){
              if (res && res[0] && res[0].coordinates){
                destCoords = { lat: res[0].coordinates[1], lon: res[0].coordinates[0] };
                deliveryKm = havDist(originCoords.lat, originCoords.lon, destCoords.lat, destCoords.lon);
                renderOrderSheet();
              }
            }).catch(function(){});
          }
        });
      }

      $('ordCancel').onclick = closeSheet;

      $('ordMinus').onclick = function(){
        if (days > 1){
          saveCurrentInputs();
          days--;
          renderOrderSheet();
        }
      };
      $('ordPlus').onclick = function(){
        if (days < 60){
          saveCurrentInputs();
          days++;
          renderOrderSheet();
        }
      };

      if ($('rowDelivery')){
        $('rowDelivery').onclick = function(){
          saveCurrentInputs();
          isDelivery = !isDelivery;
          renderOrderSheet();
        };
      }

      if ($('rowRoundTrip')){
        $('rowRoundTrip').onclick = function(){
          saveCurrentInputs();
          isRoundTrip = !isRoundTrip;
          renderOrderSheet();
        };
      }

      $('ordSend').onclick = doSubmitOrder;
    }

    async function doSubmitOrder(){
      var errEl = $('ordErr');
      errEl.style.display = 'none';

      saveCurrentInputs();
      var nm = defaultName.trim();
      var ph = defaultPhone.trim();
      var dAddr = savedAddr.trim();
      var cmt = savedComment.trim();

      if (!nm){
        errEl.textContent = 'Укажите ваше имя';
        errEl.style.display = 'block';
        return;
      }
      if (!ph || ph.replace(/[^\d]/g,'').length < 6){
        errEl.textContent = 'Укажите контактный номер телефона';
        errEl.style.display = 'block';
        return;
      }
      if (isDelivery && !dAddr){
        errEl.textContent = 'Укажите адрес доставки';
        errEl.style.display = 'block';
        return;
      }

      var btn = $('ordSend');
      btn.disabled = true;
      btn.textContent = 'Отправляем…';

      var km = deliveryKm > 0 ? deliveryKm : 1;
      var oneWay = km * delivRate;
      var delivCost = isDelivery ? (isRoundTrip ? oneWay * 2 : oneWay) : 0;

      var getMethodText = isDelivery
        ? ('Доставка' + (isRoundTrip ? ' (туда-обратно)' : '') + ': ' + dAddr + ' — ' + rub(delivCost) + (deliveryKm ? (' (' + (isRoundTrip ? '2 × ' : '') + deliveryKm + ' км по ' + delivRate + ' ₽/км)') : ''))
        : ('Самовывоз, ' + pickupAddr);

      var commentPayload = 'Срок аренды: ' + days + ' ' + plural(days, 'сутки', 'суток', 'суток') +
        ' · Стоимость аренды: ' + rub((Number(ad.price)||0) * days) + ' · Залог: ' + rub(dep);
      if (isDelivery){
        commentPayload += '\nДоставка: ' + (isRoundTrip ? 'туда и обратно (×2)' : 'в одну сторону') + ' — ' + rub(delivCost) + (deliveryKm ? (' (' + (isRoundTrip ? '2 × ' : '') + deliveryKm + ' км)') : '');
      }
      if (cmt) commentPayload += '\n\n' + cmt;

      try {
        await api('/rest/v1/rpc/submit_order', 'POST', {
          p_name: nm,
          p_phone: ph,
          p_tools: ad.name,
          p_get_method: getMethodText,
          p_address: (isDelivery ? dAddr : ''),
          p_comment: commentPayload,
          p_user_email: (A.me || ''),
          p_days: days
        });

        closeSheet();

        openSheet('Заявка принята!',
          '<div style="text-align:center;padding:12px 6px">' +
            '<div style="font-size:42px;margin-bottom:8px">🎉</div>' +
            '<h3 style="font-size:18px;margin-bottom:8px">Заявка успешно отправлена</h3>' +
            '<p style="color:var(--gr);font-size:14px;line-height:1.6;margin-bottom:12px">' +
              'Арендодатель получил уведомление и свяжется с вами по телефону <b>' + esc(ph) + '</b> ' +
              'для подтверждения бронирования и времени передачи инструмента.' +
            '</p>' +
          '</div>',
          '<button class="btn sec" id="ordDoneOk" style="flex:1">Понятно</button>' +
          (isAuthed() ? '<a class="btn" href="account.html#orders" style="flex:1">Мои заявки</a>' : '')
        );

        var okBtn = $('ordDoneOk');
        if (okBtn) okBtn.onclick = closeSheet;

        toast('Заявка отправлена арендодателю');
      } catch(err){
        btn.disabled = false;
        btn.textContent = 'Отправить заявку';
        errEl.textContent = 'Не удалось отправить заявку: ' + err.message;
        errEl.style.display = 'block';
      }
    }

    renderOrderSheet();
  });

  /* ---------- Кнопка «Написать» ---------- */
  $('writeBtn').addEventListener('click', async function(){
    if (!isAuthed()) await restoreSess();

    if (!isAuthed()){
      openSheet('Нужно войти',
        '<p style="color:var(--gr);line-height:1.6">Переписка доступна зарегистрированным ' +
        'пользователям — так арендодатель видит, кому отвечает. ' +
        'Можно и просто позвонить: ' + esc(owner.phone) + '.</p>',
        '<a class="btn sec" href="tel:' + owner.phone.replace(/[^\d+]/g,'') + '" style="flex:1">Позвонить</a>' +
        '<a class="btn" href="account.html" style="flex:1">Войти</a>');
      return;
    }
    if ((ad.owner || '').toLowerCase() === A.me){
      toast('Это ваше объявление');
      return;
    }
    location.href = 'chat.html?who=' + encodeURIComponent(ad.owner) +
                    '&tool=' + encodeURIComponent(ad.id);
  });

  /* ---------- Показать телефон ---------- */
  var shown = false;
  $('phoneBtn').addEventListener('click', function(){
    if (shown){ location.href = 'tel:' + owner.phone.replace(/[^\d+]/g,''); return; }
    shown = true;
    this.textContent = owner.phone;
    this.classList.remove('sec');
    toast('Скажите, что нашли объявление на площадке «Ива»');
  });

  /* ---------- Кнопка избранного в боковой колонке ---------- */
  window.onFavChanged = function(){
    var b = $('favBtn');
    if (b) b.textContent = favHas(ad.id) ? 'В избранном ♥' : 'В избранное';
  };

  /* ---------- Отзывы и рейтинг ---------- */
  function formatReviewDate(iso){
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
    } catch(e){
      return String(iso).slice(0, 10);
    }
  }

  async function initLandlordRating(ownerEmail){
    try {
      var lr = await getLandlordRating(ownerEmail);
      var el = $('landlordRatingBlock');
      if (!el) return;
      if (lr && lr.reviews_count > 0){
        el.innerHTML = '<span class="star">★</span>' + Number(lr.rating).toFixed(1) +
          ' · ' + lr.reviews_count + ' ' + plural(lr.reviews_count, 'отзыв', 'отзыва', 'отзывов');
      } else {
        el.innerHTML = '<span class="star" style="color:var(--g2)">★</span>новый арендодатель';
      }
    } catch(e){}
  }

  async function initReviews(ad){
    var listEl = $('reviewsList');
    var formArea = $('reviewFormArea');
    var summaryEl = $('reviewsSummary');
    if (!listEl) return;

    var reviews = [];
    var can = { allowed: false, reason: 'auth_required' };

    async function reloadData(){
      var [rRes, cRes] = await Promise.allSettled([
        loadToolReviews(ad.id),
        isAuthed() ? canUserReview(ad.id) : Promise.resolve({ allowed: false, reason: 'auth_required' })
      ]);
      reviews = rRes.status === 'fulfilled' ? (rRes.value || []) : [];
      can = cRes.status === 'fulfilled' ? (cRes.value || { allowed: false }) : { allowed: false };
    }

    await reloadData();

    function renderSummary(){
      var pub = reviews.filter(function(r){ return r.status === 'published'; });
      if (!pub.length){
        summaryEl.innerHTML = '<span class="badge" style="background:var(--field);color:var(--g2);border:1px solid var(--line)">Нет отзывов</span>';
      } else {
        var sum = pub.reduce(function(acc, r){ return acc + (Number(r.rating) || 0); }, 0);
        var avg = (sum / pub.length).toFixed(1);
        summaryEl.innerHTML = '<span class="rating-badge rating-badge-large"><span class="star">★</span> ' + avg + '</span>' +
          '<span class="muted" style="font-size:14px">(' + pub.length + ' ' + plural(pub.length, 'отзыв', 'отзыва', 'отзывов') + ')</span>';
      }
    }

    function renderForm(initialRating, initialText, isEdit){
      var curRating = initialRating || 5;
      var starsHTML = [1,2,3,4,5].map(function(s){
        return '<button type="button" class="star-btn' + (s <= curRating ? ' on' : '') + '" data-star="' + s + '" title="' + s + ' звёзд">★</button>';
      }).join('');

      formArea.innerHTML = '<div class="review-form">' +
        '<h4>' + (isEdit ? 'Редактировать отзыв' : 'Оставить отзыв об инструменте') + '</h4>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
          '<span style="font-size:13.5px;color:var(--gr)">Ваша оценка:</span>' +
          '<div class="stars-picker" id="starsPicker">' + starsHTML + '</div>' +
        '</div>' +
        '<textarea class="inp" id="reviewTextInput" maxlength="1000" placeholder="Поделитесь впечатлениями: состояние инструмента, удобство работы, комплектность…">' + esc(initialText || '') + '</textarea>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
          '<button class="btn sm" id="submitReviewBtn">' + (isEdit ? 'Сохранить изменения' : 'Опубликовать отзыв') + '</button>' +
          (isEdit ? '<button class="btn sec sm" id="cancelReviewEditBtn" type="button">Отмена</button>' : '') +
          '<span class="small muted" style="margin-left:auto"><span id="reviewCharCount">' + (initialText || '').length + '</span>/1000</span>' +
        '</div>' +
        '<div id="reviewFormErr" style="color:var(--red);font-size:13px;margin-top:8px"></div>' +
      '</div>';

      var picker = $('starsPicker');
      picker.addEventListener('click', function(e){
        var btn = e.target.closest('[data-star]');
        if (!btn) return;
        curRating = Number(btn.dataset.star);
        picker.querySelectorAll('[data-star]').forEach(function(b){
          b.classList.toggle('on', Number(b.dataset.star) <= curRating);
        });
      });

      var tx = $('reviewTextInput');
      tx.addEventListener('input', function(){
        $('reviewCharCount').textContent = this.value.length;
      });

      if (isEdit){
        $('cancelReviewEditBtn').addEventListener('click', function(){
          renderFormArea();
        });
      }

      $('submitReviewBtn').addEventListener('click', async function(){
        var btn = this;
        var text = $('reviewTextInput').value.trim();
        var errEl = $('reviewFormErr');
        errEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Сохраняем…';

        try {
          await submitReview(ad.id, curRating, text, A.uname);
          toast(isEdit ? 'Отзыв обновлён!' : 'Спасибо за отзыв!');
          await reloadData();
          renderSummary();
          renderFormArea();
          renderList();
          initLandlordRating(ad.owner);
        } catch(err){
          btn.disabled = false;
          btn.textContent = isEdit ? 'Сохранить изменения' : 'Опубликовать отзыв';
          errEl.textContent = 'Не удалось сохранить отзыв: ' + err.message;
        }
      });
    }

    function renderFormArea(){
      if (!isAuthed()){
        formArea.innerHTML = '<div class="review-callout">Оставить отзыв могут арендаторы после оформления заявки на инструмент. ' +
          '<a href="cabinet.html" style="color:var(--or);font-weight:600">Войдите в аккаунт</a>, если вы уже брали этот инструмент.</div>';
        return;
      }

      if (can.reason === 'own_tool'){
        formArea.innerHTML = '';
        return;
      }

      if (!can.allowed){
        formArea.innerHTML = '<div class="review-callout">Отзыв могут оставить арендаторы после оформления заявки на этот инструмент.</div>';
        return;
      }

      // User has rented the tool and can review!
      if (can.has_review && can.review){
        var myR = can.review;
        formArea.innerHTML = '<div class="review-card" style="border-color:var(--or);margin:16px 0;background:var(--or-soft)">' +
          '<div class="review-card-head">' +
            '<div>' +
              '<span class="review-author">' + esc(myR.author_name || 'Вы') + '<span class="review-my-tag">Ваш отзыв</span></span>' +
              '<div class="review-stars">' + '★'.repeat(myR.rating) + '☆'.repeat(5 - myR.rating) + '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<span class="review-date">' + formatReviewDate(myR.updated_at || myR.created_at) + (myR.updated_at !== myR.created_at ? ' (изменён)' : '') + '</span>' +
              '<button type="button" class="review-edit-btn" id="openEditReviewBtn" title="Редактировать отзыв">' +
                '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                'Редактировать' +
              '</button>' +
            '</div>' +
          '</div>' +
          (myR.text ? '<div class="review-text">' + esc(myR.text) + '</div>' : '') +
        '</div>';

        $('openEditReviewBtn').addEventListener('click', function(){
          renderForm(myR.rating, myR.text, true);
        });
        return;
      }

      // User hasn't left a review yet: show form
      renderForm(5, '', false);
    }

    function renderList(){
      var displayReviews = reviews.filter(function(r){
        // Do not show user's own review twice if already shown in formArea
        if (can.has_review && can.review && r.id === can.review.id) return false;
        return r.status === 'published' || isChief();
      });

      if (!displayReviews.length && (!can.has_review || !can.review)){
        listEl.innerHTML = '<div class="empty" style="padding:24px 10px"><p style="color:var(--g2)">Пока никто не оставил отзыв на этот инструмент. Будьте первыми!</p></div>';
        return;
      }

      listEl.innerHTML = '<div class="review-list">' + displayReviews.map(function(r){
        var isChiefUser = isChief();
        var isHidden = r.status === 'hidden';
        var modBtn = isChiefUser
          ? ('<button class="btn sec xs" data-mod-review="' + r.id + '" data-set-status="' + (isHidden ? 'published' : 'hidden') + '">' +
             (isHidden ? 'Восстановить' : 'Скрыть спам') + '</button>')
          : '';

        return '<div class="review-card' + (isHidden ? ' muted' : '') + '" data-rid="' + r.id + '">' +
          '<div class="review-card-head">' +
            '<div>' +
              '<span class="review-author">' + esc(r.author_name || 'Арендатор') + (isHidden ? ' <span class="badge" style="background:var(--red);color:#fff">Скрыт</span>' : '') + '</span>' +
              '<div class="review-stars">' + '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) + '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<span class="review-date">' + formatReviewDate(r.updated_at || r.created_at) + (r.updated_at && r.created_at && r.updated_at !== r.created_at ? ' (изменён)' : '') + '</span>' +
              modBtn +
            '</div>' +
          '</div>' +
          (r.text ? '<div class="review-text">' + esc(r.text) + '</div>' : '') +
        '</div>';
      }).join('') + '</div>';

      listEl.querySelectorAll('[data-mod-review]').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var rId = this.dataset.modReview;
          var newStatus = this.dataset.setStatus;
          this.disabled = true;
          try {
            await toggleReviewStatus(rId, newStatus);
            toast(newStatus === 'hidden' ? 'Отзыв скрыт' : 'Отзыв опубликован');
            await reloadData();
            renderSummary();
            renderList();
          } catch(e){
            this.disabled = false;
            toast('Ошибка модерации: ' + e.message);
          }
        });
      });
    }

    renderSummary();
    renderFormArea();
    renderList();
  }

  initLandlordRating(ad.owner);
  initReviews(ad);
})();
</script>
</body>
</html>
