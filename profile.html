<style>
/* Страница настроек профиля клиента собрана из готовых компонентов theme.css
   (.box, .ava, .inp, .btn, .empty). Здесь только раскладка строк и полей. */
.pf-rows{margin-top:16px}
.pf-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.pf-row:last-child{border-bottom:none}
.pf-row .k{color:var(--g2);min-width:170px;flex-shrink:0}
.pf-row .v{font-weight:500;word-break:break-word}
.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pf-field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;min-width:0}
.pf-field .inp{width:100%;font-weight:400;font-size:15px;box-sizing:border-box}
.pf-error{color:var(--red);font-size:14px;margin:8px 0 0;white-space:pre-wrap}
@media (max-width:620px){
  .pf-grid{grid-template-columns:minmax(0,1fr)}
  .pf-row{flex-direction:column;gap:3px}
  .pf-row .k{min-width:0;font-size:12.5px}
}
</style>
