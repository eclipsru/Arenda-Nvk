<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Разместить объявление — Ива</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101217">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css?v=20261024-a">
<style>
/* ---------- Шаги ---------- */
.steps{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap}
.step-i{flex:1;min-width:64px;display:flex;flex-direction:column;gap:7px}
.step-i .bar{height:4px;border-radius:2px;background:var(--line)}
.step-i.done .bar,.step-i.on .bar{background:var(--or)}
.step-i .lb{font-size:12px;color:var(--g2)}
.step-i.on .lb{color:var(--or);font-weight:600}
.step-i.done .lb{color:var(--gr)}

.form-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;padding-bottom:40px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.fld .hint{font-size:12.5px;color:var(--g2);margin-top:6px;line-height:1.45}
.fld .err{font-size:12.5px;color:var(--red);margin-top:6px;display:none}
.fld.bad .inp{border-color:var(--red)}
.fld.bad .err{display:block}
textarea.inp{resize:vertical;min-height:110px;font-family:inherit;line-height:1.55}

/* Плитки выбора */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pick button{background:var(--field);border:1px solid var(--line);border-radius:var(--r-s);
  padding:13px 12px;text-align:left;font-size:14px;transition:.14s;display:flex;
  flex-direction:column;gap:7px;min-height:80px}
.pick button:hover{border-color:var(--line-2)}
.pick button.on{border-color:var(--or);background:var(--or-soft);color:var(--or);font-weight:600}
.pick button .ic{width:26px;height:26px;color:var(--or)}
.pick button .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8}

.pick.row{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.pick.row button{min-height:0;padding:10px 12px;flex-direction:row;align-items:center}

/* Фото */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:26px 18px;text-align:center;
  transition:.15s;cursor:pointer;background:var(--field)}
.drop:hover,.drop.over{border-color:var(--or);background:var(--or-soft)}
.drop svg{width:38px;height:38px;stroke:var(--g2);fill:none;stroke-width:1.6;margin-bottom:10px}
.drop b{display:block;font-size:14.5px;margin-bottom:5px}
.drop span{font-size:12.5px;color:var(--g2)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.ph-i{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;
  border:1px solid var(--line);background:var(--card)}
.ph-i img{width:100%;height:100%;object-fit:cover}
.ph-i .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;
  background:rgba(11,13,17,.82);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:17px;line-height:1}
.ph-i .x:hover{background:var(--red);color:#111}
.ph-i .main{position:absolute;left:5px;bottom:5px;background:var(--or);color:#fff;
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.ph-i.up{display:flex;align-items:center;justify-content:center;color:var(--g2);font-size:12px}

/* Предпросмотр */
.prev{position:sticky;top:calc(var(--head-h) + 14px)}
.prev h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--g2);margin-bottom:10px}

.nav-btns{display:flex;gap:10px;margin-top:22px}
.nav-btns .btn{min-width:130px}
.sum-row{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.sum-row:last-child{border-bottom:none}
.sum-row span{color:var(--g2)}
.sum-row b{text-align:right;max-width:60%}

@media (max-width:900px){
  .form-grid{grid-template-columns:1fr}
  .prev{position:static;order:-1}
  .step-i .lb{display:none}
  .steps{gap:5px}
}
</style>
<link rel="stylesheet" href="assets/geo.css?v=20260923-photon">
</head>
<body>

<div id="hdr"></div>

<main class="page">
  <div class="wrap" id="root">
    <div class="empty" style="padding:70px 20px"><b>Загрузка…</b></div>
  </div>
</main>

<div id="ftr"></div>
<div id="bnav"></div>

<script src="assets/data.js"></script>
<script src="assets/geo.js?v=20260923-photon"></script>
<script src="assets/sb.js?v=20261018-stage4"></script>
<script src="assets/kind-guess.js?v=20261016-kind"></script>
<script src="assets/models.js?v=20261020-power"></script>
<script src="assets/model-form.js?v=20261020-power"></script>
<script src="assets/app-release.js?v=20261009-rel"></script>
<script src="assets/app.js?v=20261022-a"></script>
<script>
(function(){
  mountChrome('new', '');

  const DRAFT = 'iva_draft_ad';
  const EDIT_ID = new URLSearchParams(location.search).get('edit');
  let EDIT_SOURCE = null, editDirty = false;
  let uploadsInFlight = 0;
  window.addEventListener('beforeunload',function(e){ if(editDirty){e.preventDefault();e.returnValue='';} });
  let CATS_DB = [], SUBS_DB = [];
  let KINDS_DB = [];                       /* 10.81: виды (iva_kinds) со словами автоподбора; пусто — SQL не применён */
  let AUTO = { cat:'', sub:'', kind:'' };  /* что подставил автоподбор в прошлый раз — ручной выбор не трогаем */
  let autoTimer = 0;
  let MD = null;                           /* 10.82: справочник моделей (assets/models.js); null — нет (SQL не применён) */
  const PROP = {};                         /* 10.84: «Предложить модель» — состояние по виду|бренду|модели */
  let PH = null;                           /* 10.84: подсказка цены шага 4 */
  let step = 1;
  const TOTAL = 5;

  /* Состояние формы */
  let F = {
    cat:'', sub:'', kind:'', imgs:[], name:'', descr:'', cond:'good',
    model_id:null, specs:{}, specsAuto:{}, mbrand:'', mtext:'', kit:[], descrAuto:'',   /* 10.84: текст «Модели», комплектация, наше описание */
    price:'', deposit:'', terms:'', delivery:false, delivery_price:40, address:'', city:'', pickup_lat:null, pickup_lng:null
  };

  /* ---------- Черновик ---------- */
  function saveDraft(){
    if (EDIT_ID){ editDirty = true; return; }
    try { localStorage.setItem(DRAFT, JSON.stringify({f:F, step:step})); } catch(e){}
  }
  function loadDraft(){
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT) || 'null');
      if (d && d.f){ F = Object.assign(F, d.f); step = d.step || 1; return true; }
    } catch(e){}
    return false;
  }
  function dropDraft(){ if (EDIT_ID){editDirty=false;return;} try { localStorage.removeItem(DRAFT); } catch(e){} }

  /* ---------- Экран «размещение недоступно» ----------
     Решение владельца 20.10.2026: клиент не может сдавать инструмент. Он может только написать владельцу;
     арендодателем его делает владелец после разговора. Поэтому здесь нет ни анкеты, ни «Стать арендодателем». */
  function screenAuth(kind){
    const guest = kind === 'guest', paused = kind === 'paused', staff = kind === 'staff';
    const title = guest ? 'Размещение — только для арендодателей'
      : paused ? 'Размещение приостановлено'
      : staff ? 'Сотрудники добавляют инструмент в приложении'
      : 'Размещать инструмент могут только арендодатели';
    if (staff){
      /* этап D: у сотрудника с правом «Добавляет инструмент» на сайте пока нет выбора пункта и одобрения владельцем */
      $('root').innerHTML = '<div class="empty" style="padding:70px 20px"><b>' + esc(title) + '</b>' +
        '<p>Добавление инструмента сотрудником (с выбором пункта и одобрением владельца проката) пока работает в приложении «Ива» для Android. ' +
        'Заявки своих пунктов можно вести и здесь — в кабинете, вкладка «Работа».</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<a class="btn" href="app.html">Скачать приложение</a><a class="btn sec" href="account.html#staff">Открыть «Работа»</a></div></div>';
      return;
    }
    const text = paused
      ? 'Ваш доступ арендодателя сейчас приостановлен. Напишите владельцу площадки, чтобы узнать причину.'
      : 'Хотите сдавать свой инструмент? Напишите владельцу площадки: обсудим условия, и после его одобрения вы станете арендодателем.' +
        (guest ? ' Если вы уже арендодатель — войдите.' : '');
    $('root').innerHTML =
      '<div class="empty" style="padding:70px 20px">' +
        '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>' +
          '<circle cx="12" cy="7" r="4"/></svg>' +
        '<b>' + esc(title) + '</b>' +
        '<p>' + esc(text) + '</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<a class="btn" href="' + lendChatHref() + '">Написать владельцу</a>' +
          (guest ? '<a class="btn sec" href="account.html?next=new.html">Войти</a>'
                 : '<a class="btn sec" href="index.html">На главную</a>') +
        '</div>' +
      '</div>';
  }

  /* ---------- Разметка шагов ---------- */
  function stepsHTML(){
    const labels = ['Категория','Фото','Описание','Цена','Получение'];
    return '<div class="steps">' + labels.map(function(l, i){
      const n = i + 1;
      return '<div class="step-i ' + (n < step ? 'done' : (n === step ? 'on' : '')) + '">' +
               '<div class="bar"></div><div class="lb">' + n + '. ' + l + '</div>' +
             '</div>';
    }).join('') + '</div>';
  }

  /* 10.81: виды подкатегории и автоподбор по названию (assets/kind-guess.js — тот же алгоритм, что в приложении) */
  function kindsFor(cat, sub){
    return KINDS_DB.filter(function(k){ return cat && sub && k.cat === cat && k.sub === sub; });
  }
  function kindKeep(){
    if (F.kind && !kindsFor(F.cat, F.sub).some(function(k){ return k.key === F.kind; })) F.kind = '';
  }
  function canAuto(){
    return typeof ivaGuessKind === 'function' && KINDS_DB.some(function(k){ return k.words && k.words.length; });
  }
  function autoKind(){
    if (!canAuto()) return;
    let g = ivaGuessKind(F.name, KINDS_DB);
    if (!g.cat || !CATS_DB.some(function(c){ return c.key === g.cat; })) return;
    if (g.sub && !SUBS_DB.some(function(x){ return x.cat === g.cat && x.key === g.sub; })) g = { cat:g.cat, sub:'', kind:'' };
    const p = ivaKindPlan({ cat:F.cat, sub:F.sub, kind:F.kind }, AUTO, g);
    if (!p) return;
    F.cat = p.cat; F.sub = p.sub; F.kind = p.kind;
    AUTO = { cat:p.cat, sub:p.sub, kind:p.kind };
    saveDraft();
    if ($('catArea')){ paintCat(); bad('fCat', false); }
    livePreview();
  }

  /* 10.82: модель из справочника — только новое объявление и только когда справочник загрузился */
  function mdOn(){ return !!MD && !EDIT_ID; }
  function modelById(id){ return MD && id ? MD.byId[id] || null : null; }
  function modelText(m){ return m ? m.brand + ' ' + m.model : ''; }
  /* модель снимается, если вид другой или название уже не про неё; характеристики остаются */
  function modelKeep(){
    const m = modelById(F.model_id);
    if (F.model_id && (!m || m.kind !== F.kind || !ivaModelStillFits(F.name, m))) F.model_id = null;
  }
  function chooseModel(m){
    clearTimeout(autoTimer);   /* 10.86: отложенный автоподбор от набора не должен сработать после выбора модели (сбрасывал вид и модель) */
    const k = KINDS_DB.find(function(x){ return x.key === m.kind; });
    F.name = m.title;
    if (k && CATS_DB.some(function(c){ return c.key === k.cat; })){
      const subOk = SUBS_DB.some(function(x){ return x.cat === k.cat && x.key === k.sub; });
      F.cat = k.cat; F.sub = subOk ? k.sub : ''; F.kind = subOk ? k.key : '';
      AUTO = { cat:F.cat, sub:F.sub, kind:F.kind };   /* как автоподбор: новое название может сменить, ручной выбор — нет */
    }
    F.model_id = F.kind === m.kind ? m.id : null;
    F.mtext = '';
    const r = ivaSpecsFill(F.specs, F.specsAuto, m.specs);
    F.specs = r.values; F.specsAuto = r.auto;
    saveDraft(); render();
  }
  /* 10.86 (решение владельца 15.10): «Питание» — только у выбранной модели (одним вариантом), «Напряжение
     аккумулятора» — только при «Аккумуляторе»; сохраняются только показанные поля */
  function specFields(){
    if (!MD || !F.kind) return [];
    const m = modelById(F.model_id);
    return ivaFormFields(ivaFieldsFor(MD, F.kind), m && m.kind === F.kind ? m.specs : null, F.specs);
  }
  function specSig(){ return specFields().map(function(f){ return f.key + ':' + (f.options || []).join(';'); }).join('|'); }
  function modelHTML(){
    if (!mdOn() || !F.kind) return '';
    modelKeep();
    const brands = ivaModelBrands(MD.index, F.kind), fields = specFields();
    if (F.mbrand && brands.indexOf(F.mbrand) < 0) F.mbrand = '';
    const ex = brands.length ? ivaModelSearch('', MD.index, { kind:F.kind, limit:1 })[0] : null;
    const kitItems = (MD.kit && MD.kit[F.kind]) || [];
    /* 10.84: «Модель» — при любом виде (и без брендов): нет в списке — «Предложить модель» */
    return '<div class="fld" id="fModel" style="margin:14px 0 0"><label>Модель ' +
          '<span class="muted" style="font-weight:400">— необязательно, характеристики заполнятся сами</span></label>' +
          (brands.length ? '<div class="mbrands">' + brands.map(function(b){
            return '<button type="button" data-mbrand="' + esc(b) + '"' + (F.mbrand === b ? ' class="on"' : '') + '>' + esc(b) + '</button>';
          }).join('') + '</div>' : '') +
          '<input class="inp" id="iModel" style="margin-top:9px" autocomplete="off" maxlength="90" placeholder="' +
            esc(ex ? 'Например: ' + modelText(ex) : 'Модель') + '" value="' + esc(modelText(modelById(F.model_id)) || F.mtext || '') + '">' +
          '<div class="msug" id="mSugModel"></div>' +
          '<div id="mProp">' + propHTML() + '</div>' +
        '</div>' +
      (fields.length ?
        '<div class="fld" id="fSpecs" style="margin:14px 0 0"><label>Характеристики ' +
          '<span class="muted" style="font-weight:400">— необязательно, можно поправить</span></label>' +
          ivaSpecsHTML(fields, F.specs, function(t){ return '<span class="mspec-l">' + esc(t) + '</span>'; }) +
        '</div>' : '') +
      (kitItems.length ?
        '<div class="fld" id="fKit" style="margin:14px 0 0"><label>Комплектация ' +
          '<span class="muted" style="font-weight:400">— отметьте, что отдаёте вместе с инструментом</span></label>' +
          '<div class="mbrands">' + ivaKitHTML(kitItems, F.kit, '') + '</div>' +
        '</div>' : '');
  }
  /* 10.84: «Предложить модель» — текст поля «Модель» не выбран из подсказок и такой модели у вида нет */
  function propParts(){
    const im = $('iModel'), q = im ? im.value : F.mtext;
    if (!mdOn() || !F.kind || modelById(F.model_id) || ivaModelExact(MD.index, F.kind, q)) return null;
    return ivaProposalParts(q, F.mbrand, MD.brands);
  }
  function propKey(p){ return F.kind + '|' + p.brand.toLowerCase() + '|' + p.model.toLowerCase(); }
  function propHTML(){ const p = propParts(); return p ? ivaPropHTML(p, PROP[propKey(p)] || '') : ''; }
  function paintProp(){ const b = $('mProp'); if (b) b.innerHTML = propHTML(); }
  function sendProp(){
    const p = propParts();
    if (!p) return;
    const key = propKey(p);
    if (PROP[key] === 'sending' || PROP[key] === 'ok') return;
    const k = KINDS_DB.find(function(x){ return x.key === F.kind; });
    const row = { kind:F.kind, brand:p.brand, model:p.model, title:ivaProposalTitle(F.name, p, k ? k.title : ''),
      specs:ivaSpecsClean(F.specs, specFields()) || {} };
    PROP[key] = 'sending'; paintProp();
    ivaProposalSend(api, row).then(function(err){ PROP[key] = err || 'ok'; paintProp(); });
  }
  /* 10.84: «Сгенерировать описание» — в пустое описание или вместо нашего прошлого; написанное руками не трогаем */
  function genDescr(){
    const fl = F.kind ? specFields() : [];
    const rows = fl.length ? ivaSpecRows(ivaSpecsClean(F.specs, fl) || {}, fl) : [];
    const kit = F.kind && MD.kit ? ivaKitClean(F.kit, MD.kit[F.kind]) : null;
    const txt = ivaDescribe(F.name, rows, kit).slice(0, 1200);
    let note = '';
    if (!txt) note = 'Сначала напишите название.';
    else if (!(F.descr || '').trim() || F.descr === F.descrAuto){
      F.descr = txt; F.descrAuto = txt;
      const ds = $('iDescr'); if (ds) ds.value = txt;
      countDescr(); saveDraft(); bad('fDescr', false);
    } else note = 'Описание уже написано — сотрите его, чтобы сгенерировать заново.';
    const n = $('genNote'); if (n){ n.textContent = note; n.style.display = note ? '' : 'none'; }
  }
  /* 10.84: подсказка цены и залога по активным объявлениям той же модели или вида — только текст и «Подставить» в пустое */
  function paintPriceHint(){
    if (!$('priceHint') || !F.kind || EDIT_ID || typeof ivaPriceRows !== 'function') return;
    const kind = F.kind;
    ivaPriceRows(api, kind).then(function(rows){
      const el = $('priceHint');
      if (!el || F.kind !== kind) return;
      PH = ivaPriceHint(rows, mdOn() ? F.model_id : null, kind);
      if (!PH){ el.innerHTML = ''; el.style.display = 'none'; return; }
      const canP = !String(F.price).trim();
      el.innerHTML = esc(ivaPriceHintText(PH)) + (canP ? ' · <button type="button" id="priceAuto" style="color:var(--or);font-weight:600">Подставить ' +
        esc(rub(PH.price[2])) + (PH.deposit && String(F.deposit).trim() === '' ? ' и залог ' + esc(rub(PH.deposit[2])) : '') + '</button>' : '');
      el.style.display = '';
    });
  }
  function paintCat(){
    const area = $('catArea');
    if (!area) return;
    area.innerHTML = catHTML();
    bindModel();
  }
  function bindModel(){
    const wh = $('iWhat'), ws = $('mSugWhat');
    if (wh && ws && mdOn() && !wh.dataset.msug){
      wh.dataset.msug = '1';
      ivaSugAttach(wh, ws, function(q){ return ivaModelSearch(q, MD.index, { limit:6 }); },
        function(m){ return m.title; }, chooseModel);
    }
    const im = $('iModel'), ms = $('mSugModel');
    if (im && ms){
      ivaSugAttach(im, ms, function(q){
        const m = modelById(F.model_id);
        if (m && q.trim() === modelText(m)) return [];
        return ivaModelSearch(q, MD.index, { kind:F.kind, brand:F.mbrand, limit:20 });
      }, modelText, chooseModel);
      im.addEventListener('input', function(){
        const m = modelById(F.model_id);
        if (m && this.value.trim() !== modelText(m)){ F.model_id = null; saveDraft(); }
        F.mtext = m && this.value.trim() === modelText(m) ? '' : this.value;
        paintProp();
      });
    }
  }

  function body1(){
    return '<div class="box">' +
      ((canAuto() || mdOn()) && !EDIT_ID ?
        '<div class="fld" id="fWhat">' +
          '<label>Что сдаёте <span class="muted" style="font-weight:400">— категория подберётся сама</span></label>' +
          '<input class="inp" id="iWhat" maxlength="90" autocomplete="off" placeholder="Например: Перфоратор Makita HR2470" value="' + esc(F.name) + '">' +
          '<div class="msug" id="mSugWhat"></div>' +
          '<div class="hint">Это же название будет у объявления — его можно поправить на шаге «Описание».</div>' +
        '</div>' : '') +
      '<div id="catArea">' + catHTML() + '</div>' +
    '</div>';
  }

  function catHTML(){
    const subs = SUBS_DB.filter(function(s){ return s.cat === F.cat; });
    kindKeep();
    const kinds = kindsFor(F.cat, F.sub);
    return '' +
      '<div class="fld" id="fCat">' +
        '<label>Категория инструмента</label>' +
        '<div class="pick">' +
          CATS_DB.map(function(c){
            return '<button type="button" data-cat="' + esc(c.key) + '"' +
                   (F.cat === c.key ? ' class="on"' : '') + '>' +
                   '<span class="ic">' + (ICONS[c.key] || ICONS.power) + '</span>' +
                   '<span>' + esc(c.title) + '</span></button>';
          }).join('') +
        '</div>' +
        '<div class="err">Выберите категорию</div>' +

  /* ---------- Предпросмотр карточки ---------- */

  function kindTitle(k){
    const x = KINDS_DB.find(function(y){ return y.key === k; });
    return x ? x.title : '';
  }

    const c = CATS_DB.find(function(x){ return x.key === k; });
    return c ? c.title : '';
  }

  /* ---------- Полный рендер ---------- */
  function render(){
    const bodies = [body1, body2, body3, body4, body5];
    $('root').innerHTML =
      '<div class="sect" style="padding-bottom:0"><div class="sect-h">' +
        '<h2>' + (EDIT_ID ? 'Редактировать объявление' : 'Разместить объявление') + '</h2>' +
        '<a href="account.html">Мои объявления →</a>' +
      '</div></div>' +
      (EDIT_ID ? '<p class="muted small" style="margin:14px 0">Изменения сохранятся в этом же объявлении. Статус публикации не изменится.</p>' : '') +
      stepsHTML() +
      '<div class="form-grid">' +
        '<div>' + bodies[step - 1]() +
          '<div class="nav-btns">' +
            (step > 1 ? '<button class="btn sec" id="bBack">Назад</button>' : '') +
            (step < TOTAL
              ? '<button class="btn" id="bNext">Далее</button>'
              : '<button class="btn" id="bSave">' + (EDIT_ID ? 'Сохранить изменения' : 'Опубликовать') + '</button>') +
            (EDIT_ID || step === 1 ? '<a class="btn ghost" href="' + (EDIT_ID ? 'account.html' : 'index.html') + '" style="margin-left:auto">Отмена</a>' : '') +
          '</div>' +
        '</div>' +
        previewHTML() +
      '</div>';

    bindStep();
    if (step === 2) paintPhotos();
    if (step === 3) countDescr();
    if (step === 4) paintPriceHint();
  }

  /* ---------- Обработчики текущего шага ---------- */
  function bindStep(){
    const root = $('root');

    root.onclick = function(e){
      const c = e.target.closest('[data-cat]');
      if (c){ F.cat = c.getAttribute('data-cat'); F.sub = ''; F.kind = ''; saveDraft(); render(); return; }

      const s = e.target.closest('[data-sub]');
      if (s){ F.sub = s.getAttribute('data-sub'); kindKeep(); saveDraft(); render(); return; }

      const kd = e.target.closest('[data-kind]');
      if (kd){ F.kind = kd.getAttribute('data-kind'); saveDraft(); render(); return; }

      const mb = e.target.closest('[data-mbrand]');
      if (mb){
        const b = mb.getAttribute('data-mbrand');
        F.mbrand = F.mbrand === b ? '' : b; saveDraft(); paintCat();
        const im = $('iModel'); if (im) im.focus();
        return;
      }

      const cd = e.target.closest('[data-cond]');
      if (cd){ F.cond = cd.getAttribute('data-cond'); saveDraft(); render(); return; }

      const dl = e.target.closest('[data-dl]');
      if (dl){ F.delivery = dl.getAttribute('data-dl') === '1'; saveDraft(); render(); return; }

      /* 10.84: комплектация, «Предложить модель», описание, подсказка цены */
      const kt = e.target.closest('[data-kit]');
      if (kt){
        const v = kt.getAttribute('data-kit'), i = F.kit.indexOf(v);
        if (i >= 0) F.kit.splice(i, 1); else F.kit.push(v);
        saveDraft(); paintCat(); return;
      }
      if (e.target.closest('[data-mprop]')){ sendProp(); return; }
      if (e.target.id === 'genDescr'){ genDescr(); return; }
      if (e.target.id === 'priceAuto' && PH){
        if (!String(F.price).trim()) F.price = PH.price[2];
        if (PH.deposit && String(F.deposit).trim() === '') F.deposit = PH.deposit[2];
        saveDraft(); render(); return;
      }

      if (e.target.id === 'depAuto'){
        F.deposit = (Number(F.price) || 0) * 5;
        saveDraft(); render(); return;
      }
    };

    const bk = $('bBack'); if (bk) bk.addEventListener('click', function(){ step--; render(); });
    const nx = $('bNext'); if (nx) nx.addEventListener('click', function(){ if (validate()) { step++; saveDraft(); render(); } });
    const sv = $('bSave'); if (sv) sv.addEventListener('click', publish);

    /* Шаг 1: название → категория, подкатегория и вид (10.81) */
    const wh = $('iWhat');
    if (wh) wh.addEventListener('input', function(){
      F.name = this.value; saveDraft();
      clearTimeout(autoTimer);
      autoTimer = setTimeout(function(){
        try { autoKind(); } catch(e){}
        /* 10.82: название уже не про выбранную модель — модель снимается (поле «Модель» пустеет) */
        const was = F.model_id; modelKeep();
        if (was && !F.model_id){ saveDraft(); paintCat(); }
      }, 300);
    });
    /* 10.82: характеристики — правки руками (их подстановка модели не перезапишет) */
    root.oninput = function(e){
      const sp = e.target.closest && e.target.closest('[data-spec]');
      if (sp){
        const was = specSig();
        F.specs[sp.getAttribute('data-spec')] = sp.value; saveDraft();
        if (specSig() !== was) paintCat();   /* 10.86: питание сменили — напряжение аккумулятора появляется / пропадает */
      }
    };
    root.onchange = root.oninput;
    bindModel();

    /* Поля шага 3 */
    const nm = $('iName');
    if (nm) nm.addEventListener('input', function(){ F.name = this.value; livePreview(); saveDraft(); });
    const ds = $('iDescr');
    if (ds) ds.addEventListener('input', function(){ F.descr = this.value; countDescr(); saveDraft(); });

    /* Поля шага 4 */
    const pr = $('iPrice');
    if (pr) pr.addEventListener('input', function(){ F.price = this.value; livePreview(); saveDraft(); });
    const dp = $('iDep');
    if (dp) dp.addEventListener('input', function(){ F.deposit = this.value; livePreview(); saveDraft(); });
    const tm = $('iTerms');
    if (tm) tm.addEventListener('input', function(){ F.terms = this.value; saveDraft(); });

    /* Поля шага 5 */
    const dpr = $('iDp');
    if (dpr) dpr.addEventListener('input', function(){ F.delivery_price = this.value; livePreview(); saveDraft(); });
    const ad = $('iAddr');
    if (ad) ad.addEventListener('input', function(){
      F.address=this.value; F.pickup_lat=null; F.pickup_lng=null;
      const inferred=IvaGeo.addressCity(this.value);
      if(inferred){F.city=inferred;if($('iCity'))$('iCity').value=inferred;}saveDraft();
    });
    const ci=$('iCity');
    if(ci)ci.addEventListener('input',function(){F.city=this.value;saveDraft();});

    /* Шаг 2 — фото */
    if (step === 2) bindPhotos();
  }

  function livePreview(){
    const old = $1('.prev');
    if (!old) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = previewHTML();
    old.replaceWith(tmp.firstChild);
  }

  function countDescr(){
    const c = $('dCnt');
    if (c) c.textContent = (F.descr || '').length;
  }

  /* ---------- Фото ---------- */
  function paintPhotos(){
    const box = $('photos');
    if (!box) return;
    box.innerHTML = F.imgs.map(function(u, i){
      return '<div class="ph-i">' +
               '<img src="' + esc(u) + '" alt="">' +
               (i === 0 ? '<span class="main">Главное</span>' : '') +
               '<button class="x" data-rm="' + i + '" title="Удалить">×</button>' +
             '</div>';
    }).join('');
  }

  function bindPhotos(){
    const drop = $('drop'), file = $('file'), box = $('photos');
    if (!drop) return;

    drop.addEventListener('click', function(){ file.click(); });
    file.addEventListener('change', function(){ handleFiles(this.files); this.value = ''; });

    ['dragenter','dragover'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave','drop'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function(e){
      if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
    });

    box.addEventListener('click', function(e){
      const r = e.target.closest('[data-rm]');
      if (!r) return;
      F.imgs.splice(Number(r.getAttribute('data-rm')), 1);
      saveDraft(); paintPhotos(); livePreview();
    });
  }

  async function handleFiles(list){
    const files = Array.prototype.slice.call(list);
    const free = 5 - F.imgs.length;
    if (free <= 0){ toast('Уже добавлено 5 фотографий'); return; }
    const take = files.slice(0, free);
    if (files.length > free) toast('Добавлены первые ' + free + ' — всего можно 5');

    uploadsInFlight += take.length;
    for (let i = 0; i < take.length; i++){
      const box = $('photos');
      const stub = document.createElement('div');
      stub.className = 'ph-i up';
      stub.textContent = 'Загрузка…';
      if (box) box.appendChild(stub);
      try {
        const url = await uploadPhoto(take[i]);
        F.imgs.push(url);
        saveDraft();
      } catch(err){
        toast('Фото не загрузилось: ' + err.message);
      }
      uploadsInFlight--;
      if (stub.parentNode) stub.remove();
      paintPhotos(); livePreview();
    }
  }

  /* ---------- Валидация ---------- */
  function bad(id, on){
    const el = $(id);
    if (el) el.classList.toggle('bad', !!on);
  }

  function validate(){
    if (uploadsInFlight){toast('Дождитесь загрузки фотографий');return false;}
    if (step === 1){
      if (!F.cat){ bad('fCat', true); toast('Выберите категорию'); return false; }
      bad('fCat', false);
    }
    if (step === 3){
      let ok = true;
      if ((F.name || '').trim().length < 5){ bad('fName', true); ok = false; } else bad('fName', false);
      if ((F.descr || '').trim().length < 20){ bad('fDescr', true); ok = false; } else bad('fDescr', false);
      if (!ok){ toast('Заполните название и описание'); return false; }
    }
    if (step === 4){
      let ok = true;
      if (!(Number(F.price) > 0)){ bad('fPrice', true); ok = false; } else bad('fPrice', false);
      if (Number(F.deposit) < 0){ bad('fDep', true); ok = false; } else bad('fDep', false);
      if (!ok){ toast('Проверьте цену и залог'); return false; }
    }
    return true;
  }

  /* ---------- Публикация ---------- */
  async function publish(){
    if (!validate()) return;
    F.city=IvaGeo.city(F.city)||IvaGeo.addressCity(F.address);
    if(F.address && !F.city){toast('Укажите город выдачи отдельно от улицы и дома');if($('iCity'))$('iCity').focus();return;}
    const addressCity=IvaGeo.addressCity(F.address);
    if(addressCity && F.city && !cityMatches(addressCity,F.city)){toast('Город и адрес выдачи не совпадают. Проверьте оба поля.');return;}

    const b = $('bSave');
    b.disabled = true; b.textContent = EDIT_ID ? 'Сохраняем…' : 'Публикуем…';

    const terms = [
      F.terms,
      F.address ? 'Адрес выдачи: ' + F.address : '',
      'Состояние: ' + condTitle(F.cond)
    ].filter(Boolean).join('\n');

    /* Новые объявления сохраняют координаты отдельно. Если Photon временно
       недоступен, адрес всё равно сохранится и будет геокодирован позже;
       публикация не блокируется внешним справочником. */
    let pickupLat = F.pickup_lat, pickupLng = F.pickup_lng;
    if (F.address && window.IvaGeo){
      try {
        const rows = await IvaGeo.search(F.address, 'address');
        const point = rows && rows[0] && rows[0].coordinates;
        if (point && isFinite(Number(point[0])) && isFinite(Number(point[1]))){
          pickupLng = Number(point[0]); pickupLat = Number(point[1]);
        }
      } catch(e){}
    }

    const payload = {
      name: F.name.trim(),
      cat: F.cat,
      sub: F.sub,
      descr: F.descr.trim(),
      price: Number(F.price),
      deposit: F.deposit === '' ? Number(F.price) * 5 : Number(F.deposit),
      imgs: F.imgs,
      delivery: F.delivery,
      delivery_price: Number(F.delivery_price) || 0,
      terms: terms,
      pickup_city: F.city,
      pickup_address: F.address.trim(),
      pickup_lat: pickupLat,
      pickup_lng: pickupLng
    };
    /* 10.81: вид — только когда справочник видов есть в базе (значит, есть и tools.kind) */
    if (KINDS_DB.length){
      kindKeep();
      if (F.kind || EDIT_ID) payload.kind = F.kind || null;
    }
    /* 10.82: модель и характеристики — новое объявление, справочник загружен, вид выбран */
    if (mdOn() && payload.kind){
      modelKeep();
      if (F.model_id) payload.model_id = F.model_id;
      const sp = ivaSpecsClean(F.specs, specFields());   /* 10.86: только показанные поля */
      if (sp) payload.specs = sp;
      const kit = MD.kit ? ivaKitClean(F.kit, MD.kit[payload.kind]) : null;   /* 10.84 */
      if (kit) payload.kit = kit;
    }

    if (EDIT_ID){
      try {
        const updated = await updateTool(EDIT_ID, payload);
        if (!updated) throw new Error('Объявление не найдено или доступ к нему изменился');
        dropDraft();
        $('root').innerHTML = '<div class="empty" style="padding:70px 20px"><b>Изменения сохранены</b>' +
          '<p>«' + esc(updated.name || F.name) + '». Статус: ' + esc(statusTitle(updated.status)) + '.</p>' +
          '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<a class="btn" href="tool.html?id=' + encodeURIComponent(EDIT_ID) + '">Посмотреть</a>' +
          '<a class="btn sec" href="account.html">Мои объявления</a></div></div>';
        window.scrollTo(0,0);
      } catch(err){ b.disabled=false;b.textContent='Сохранить изменения';toast('Не удалось сохранить: ' + err.message); }
      return;
    }

    /* Автопроверка. Главный админ публикует без неё. */
    let verdict = { status:'active', failed:[] };
    if (!isChief()){
      b.textContent = 'Проверяем…';
      try { verdict = await autoModerate(payload); }
      catch(e){ verdict = { status:'moderation', failed:[{label:'Проверка', note:'не завершилась'}] }; }
    }
    payload.status = verdict.status;

    try {
      let t;
      try { t = await createTool(payload); }
      catch(e1){
        /* 10.84: нет столбца kit — без комплектации; 10.82: база не приняла модель или характеристики — объявление важнее */
        if (!payload.model_id && !payload.specs && !payload.kit) throw e1;
        let e2 = e1;
        if (payload.kit){
          delete payload.kit;
          try { t = await createTool(payload); e2 = null; } catch(x){ e2 = x; }
        }
        if (e2){
          if (!payload.model_id && !payload.specs) throw e2;
          delete payload.model_id; delete payload.specs;
          t = await createTool(payload);
        }
      }
      dropDraft();
      const onMod = verdict.status === 'moderation';
      const reasons = verdict.failed.map(function(f){
        return '<li style="margin:4px 0">' + esc(f.label) + (f.note ? ' — ' + esc(f.note) : '') + '</li>';
      }).join('');

      $('root').innerHTML =
        '<div class="empty" style="padding:70px 20px">' +
          (onMod
            ? '<svg viewBox="0 0 24 24" style="stroke:var(--yel)"><circle cx="12" cy="12" r="10"/>' +
              '<path d="M12 7v6l3 2"/></svg>'
            : '<svg viewBox="0 0 24 24" style="stroke:var(--grn)"><circle cx="12" cy="12" r="10"/>' +
              '<path d="m8 12 3 3 5-6"/></svg>') +
          '<b>' + (onMod ? 'Отправлено на проверку' : 'Объявление опубликовано') + '</b>' +
          (onMod
            ? '<p>«' + esc(F.name) + '» проверит администратор — обычно это занимает несколько часов. ' +
              'Автопроверка отметила:</p>' +
              '<ul style="text-align:left;max-width:360px;margin:0 auto 16px;color:var(--yel);' +
              'font-size:13.5px;padding-left:18px">' + reasons + '</ul>'
            : '<p>«' + esc(F.name) + '» уже в каталоге и доступно арендаторам.</p>') +
          '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
            (t && t.id ? '<a class="btn" href="tool.html?id=' + encodeURIComponent(t.id) + '">Посмотреть</a>' : '') +
            '<a class="btn sec" href="account.html">Мои объявления</a>' +
            '<a class="btn ghost" href="new.html">Разместить ещё</a>' +
          '</div>' +
        '</div>';
      window.scrollTo(0, 0);
    } catch(e){
      b.disabled = false; b.textContent = 'Опубликовать';
      toast('Не удалось опубликовать: ' + e.message);
    }
  }

  /* ---------- Старт ---------- */
  (async function init(){
    await restoreSess();

    if (!isAuthed()){ screenAuth('guest'); return; }
    if (!isAdmin()){
      let staff = false;
      if (!A.admin){
        try { const r = await api('/rest/v1/rpc/iva_staff_me', 'POST', {}); const st = Array.isArray(r) ? r[0] : r;
              staff = !!(st && st.status === 'active'); } catch(e){}
      }
      screenAuth(A.admin ? 'paused' : staff ? 'staff' : 'client');
      return;
    }

    try {
      const d = await loadCats();
      CATS_DB = d.cats; SUBS_DB = d.subs;
    } catch(e){
      CATS_DB = CATS; SUBS_DB = SUBS;   /* запасной вариант — справочник из data.js */
    }
    try { KINDS_DB = await loadKinds(); } catch(e){ KINDS_DB = []; }
    /* 10.82: справочник моделей — в фоне (форма не ждёт); пришёл — шаг 1 показывает подсказки, «Модель» и характеристики */
    if (!EDIT_ID && typeof ivaModelsLoad === 'function'){
      ivaModelsLoad(api, KINDS_DB).then(function(md){
        if (!md) return;
        MD = md;
        if (step !== 1) return;
        if (!$('iWhat')) render(); else paintCat();
      }).catch(function(){});
    }

    if (EDIT_ID){
      try {
        EDIT_SOURCE = await loadTool(EDIT_ID);
        if (!EDIT_SOURCE) throw new Error('Объявление не найдено или недоступно');
        if (!isChief() && String(EDIT_SOURCE.owner_email || '').toLowerCase() !== A.me.toLowerCase())
          throw new Error('Редактировать можно только свои объявления');
        const parsed = toolToAd(EDIT_SOURCE);
        const lines = String(EDIT_SOURCE.terms || '').split(/\r?\n/);
        const addressLine = lines.find(line=>/^Адрес выдачи:\s*/i.test(line.trim()));
        F = {
          cat:EDIT_SOURCE.cat || '',sub:EDIT_SOURCE.sub || '',
          imgs:EDIT_SOURCE.imgs && EDIT_SOURCE.imgs.length ? EDIT_SOURCE.imgs.slice() : (EDIT_SOURCE.img ? [EDIT_SOURCE.img] : []),
          name:EDIT_SOURCE.name || '',descr:EDIT_SOURCE.descr || '',cond:parsed.cond,
          price:EDIT_SOURCE.price == null ? '' : EDIT_SOURCE.price,
          deposit:EDIT_SOURCE.deposit == null ? '' : EDIT_SOURCE.deposit,
          terms:lines.filter(line=>!/^\s*(?:Адрес выдачи|Состояние):/i.test(line)).join('\n').trim(),
          city:parsed.city || '',
          address:EDIT_SOURCE.pickup_address || (addressLine ? addressLine.trim().replace(/^Адрес выдачи:\s*/i,'') : ''),
          pickup_lat:EDIT_SOURCE.pickup_lat == null ? null : EDIT_SOURCE.pickup_lat,
          pickup_lng:EDIT_SOURCE.pickup_lng == null ? null : EDIT_SOURCE.pickup_lng,
          delivery:!!EDIT_SOURCE.delivery,delivery_price:EDIT_SOURCE.delivery_price == null ? 40 : EDIT_SOURCE.delivery_price
        };
        // Старую категорию не теряем, даже если её убрали из активного справочника.
        if (F.cat && !CATS_DB.some(c=>c.key===F.cat)) CATS_DB.push({key:F.cat,title:catTitle(F.cat)});
        if (F.sub && !SUBS_DB.some(c=>c.key===F.sub&&c.cat===F.cat)) SUBS_DB.push({key:F.sub,cat:F.cat,title:subTitle(F.sub)});
        /* вид объявления — отдельным запросом: общий список полей объявления вид не читает */
        if (KINDS_DB.length){
          try {
            const kr = await api('/rest/v1/tools?select=kind&id=eq.' + encodeURIComponent(EDIT_ID));
            F.kind = (kr && kr[0] && kr[0].kind) || '';
          } catch(e){ F.kind = ''; }
        }
        document.title='Редактирование объявления — Ива';
        step=3;render();return;
      } catch(err){
        $('root').innerHTML='<div class="empty"><b>Не удалось открыть редактирование</b><p>'+esc(err.message)+'</p><a class="btn sec" href="account.html">Мои объявления</a></div>';
        return;
      }
    }
    const had = loadDraft();

    try {
      const pRows = await api('/rest/v1/landlord_profiles?select=details,locations&owner_email=eq.' + encodeURIComponent((A.admin && A.admin.email) || A.me));
      const profile = (pRows && pRows[0]) || null;
      const pDetails = (profile && profile.details) || {};
      const pLocs = (profile && Array.isArray(profile.locations)) ? profile.locations : [];
      const primaryLoc = pLocs[0] || null;

      let pfCity = (primaryLoc && primaryLoc.city) || A.profileCity || (A.admin && cityFromProfileAddress(A.admin.address)) || '';
      let pfAddress = (primaryLoc && primaryLoc.address) || (A.admin && A.admin.address) || '';
      if (!pfCity && pfAddress) pfCity = cityFromProfileAddress(pfAddress) || '';

      let pfDelivery = false;
      let pfDeliveryPrice = 40;
      const rawDp = pDetails.delivery_price != null ? String(pDetails.delivery_price).trim() : '';
      const rawDa = pDetails.delivery_area != null ? String(pDetails.delivery_area).trim() : '';
      const noDeliv = /^(?:нет|только\s*самовывоз|нет\s*доставки)/i.test(rawDa) || /^(?:нет|0)/i.test(rawDp);

      if (rawDp && !noDeliv) {
        const numMatch = rawDp.match(/\d+/);
        if (numMatch) {
          pfDeliveryPrice = parseInt(numMatch[0], 10);
          pfDelivery = true;
        } else {
          pfDelivery = true;
        }
      } else if (rawDa && !noDeliv) {
        pfDelivery = true;
      }

      const termsParts = [];
      if (pDetails.min_rental) termsParts.push('Мин. срок: ' + pDetails.min_rental.trim());
      if (pDetails.deposit_terms) termsParts.push('Залог: ' + pDetails.deposit_terms.trim());
      if (pDetails.delivery_terms) termsParts.push('Доставка: ' + pDetails.delivery_terms.trim());
      const pfTerms = termsParts.join('\n').slice(0, 500);

      if (!had) {
        if (pfCity) F.city = pfCity;
        if (pfAddress) F.address = pfAddress;
        if (pfDelivery) {
          F.delivery = true;
          F.delivery_price = pfDeliveryPrice;
        }
        if (pfTerms && !F.terms) {
          F.terms = pfTerms;
        }
      } else {
        if (!F.city && pfCity) F.city = pfCity;
        if (!F.address && pfAddress) F.address = pfAddress;
        if (!F.terms && pfTerms) F.terms = pfTerms;
      }
    } catch(err){
      if (!had) {
        if (A.profileCity) F.city = A.profileCity;
        if (A.admin && A.admin.address) {
          F.address = A.admin.address;
          if (!F.city) F.city = cityFromProfileAddress(A.admin.address) || '';
        }
      }
    }

    render();
    if (had && (F.name || F.cat || F.imgs.length)) toast('Восстановлен черновик');
  })();
})();
</script>
