<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный кабинет — Ива</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101217">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css?v=20260924-app-banner-v2">
<link rel="stylesheet" href="assets/profile.css?v=20260923-rental-profile">
<style>
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;
  overflow-x:auto;padding-bottom:1px}
.tabs button{padding:11px 16px;font-size:14.5px;color:var(--gr);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--or);border-bottom-color:var(--or);font-weight:600}
.tabs button .n{margin-left:6px;font-size:12px;color:var(--g2)}
.tabs button.on .n{color:var(--or)}
.tabs button .n.warn{background:var(--red);color:#fff;padding:1px 6px;border-radius:8px;font-weight:700}

/* Строка объявления */
.row-ad{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;margin-bottom:11px;align-items:flex-start}
.row-ad .rph{width:104px;height:80px;border-radius:var(--r-s);overflow:hidden;
  flex-shrink:0;background:#12151B}
.row-ad .rph img{width:100%;height:100%;object-fit:cover}
.row-ad .rmid{flex:1;min-width:0}
.row-ad .rnm{font-weight:600;font-size:15px;margin-bottom:4px;line-height:1.3}
.row-ad .rpr{font-size:15px;font-weight:700}
.row-ad .rpr span{font-size:12.5px;color:var(--g2);font-weight:600}
.row-ad .rmeta{font-size:12.5px;color:var(--g2);margin-top:5px}
.row-ad .racts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.row-ad .racts button,.row-ad .racts a{font-size:13px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--field);color:var(--gr);transition:.14s}
.row-ad .racts button:hover,.row-ad .racts a:hover{border-color:var(--line-2);color:var(--tx)}
.row-ad .racts .del:hover{border-color:var(--red);color:var(--red)}
.row-ad .racts .pub:hover{border-color:var(--or);color:var(--or)}

/* Профиль */
.prof-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.prof-row:last-child{border-bottom:none}
.prof-row dt{color:var(--g2);min-width:170px;flex-shrink:0}
.prof-row dd{font-weight:500;word-break:break-word}

/* Вход */
.auth-box{max-width:390px;margin:50px auto;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:26px}
.auth-box h2{font-size:21px;margin-bottom:6px}
.auth-box p{color:var(--g2);font-size:14px;margin-bottom:20px}
.auth-box .fld{margin-bottom:14px}
.auth-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.auth-err{background:rgba(255,138,128,.12);border:1px solid rgba(255,138,128,.3);
  color:var(--red);padding:10px 13px;border-radius:var(--r-s);font-size:13.5px;
  margin-bottom:14px;display:none}
.auth-err.show{display:block}

/* KPI показатели комиссии */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lb{font-size:12.5px;color:var(--g2);margin-bottom:7px}
.kpi .vl{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi .sub{font-size:12px;color:var(--g2);margin-top:5px}
.kpi.warn{border-color:rgba(255,138,128,.4)}
.kpi.warn .vl{color:var(--red)}
.kpi.good .vl{color:var(--grn)}

/* Таблицы */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 14px;color:var(--g2);font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--field)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .neg{color:var(--red);font-weight:600}
.tbl .pos{color:var(--grn);font-weight:600}

/* Карточки заявок */
.order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.order-card .title{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.3}
.order-card .hint{font-size:13.5px;color:var(--gr);margin-top:5px;line-height:1.4}
.order-card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Бейджи статусов */
.b-new{background:rgba(255,143,31,.16);color:var(--or)}
.b-rented{background:rgba(33,150,243,.16);color:#64B5F6}
.b-closed{background:rgba(76,175,80,.16);color:var(--grn)}
.b-mod{background:rgba(255,183,77,.16);color:var(--yel)}

.mini-btn{font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--field);color:var(--gr);transition:.14s;cursor:pointer}
.mini-btn:hover{border-color:var(--line-2);color:var(--tx)}

@media (max-width:620px){
  .row-ad{flex-wrap:wrap}
  .row-ad .rph{width:76px;height:60px}
  .prof-row{flex-direction:column;gap:3px}
  .prof-row dt{min-width:0;font-size:12.5px}
  .kpi .vl{font-size:20px}
  .tbl th:nth-child(n+4),.tbl td:nth-child(n+4){display:none}
}
</style>
<link rel="stylesheet" href="assets/geo.css?v=20260923-photon">
</head>
<body>

<div id="hdr"></div>

<main class="page">
  <div class="wrap" id="root">
    <div class="empty" style="padding:70px 20px"><b>Загрузка…</b></div>
  </div>
</main>

<div id="ftr"></div>
<div id="bnav"></div>

<script src="assets/data.js"></script>
<script src="assets/geo.js?v=20260923-photon"></script>
<script src="assets/sb.js?v=20260924-order-fee"></script>
<script src="assets/app.js?v=20260924-apk-1012"></script>
<script src="assets/profile.js?v=20260923-photon"></script>
<script>
(function(){
  mountChrome('cab', '');

  let TAB = (location.hash || '').replace('#','') || 'ads';
  let MY = [];
  let ORDERS = [];
  let FEES = [];
  let REVIEWS = [];
  let SUB_TAB = 'all';       // фильтр по статусу объявлений
  let SUB_TAB_ORD = 'all';   // фильтр по статусу заявок

  function niceDate(d){
    if (!d) return '—';
    const dt = new Date(String(d).replace(' ', 'T'));
    if (isNaN(dt.getTime())) return String(d);
    return dt.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function copyToClipboard(text, msg){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast(msg || 'Скопировано');
      }).catch(function(){
        prompt('Скопируйте номер:', text);
      });
    } else {
      prompt('Скопируйте номер:', text);
    }
  }

  /* ---------- Экран входа ---------- */
  function screenLogin(){
    $('root').innerHTML =
      '<div class="auth-box">' +
        '<h2>Вход</h2>' +
        '<p>Личный кабинет площадки «Ива»</p>' +
        '<div class="auth-err" id="aErr"></div>' +
        '<div class="fld"><label>Почта</label>' +
          '<input class="inp" id="lEmail" type="email" autocomplete="username" placeholder="you@mail.ru"></div>' +
        '<div class="fld"><label>Пароль</label>' +
          '<input class="inp" id="lPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
        '<button class="btn wide" id="lGo">Войти</button>' +
        '<p style="margin:16px 0 0;font-size:13px;text-align:center">' +
          'Нет аккаунта? <a href="cabinet.html" style="color:var(--or)">Зарегистрироваться</a></p>' +
      '</div>';

    const go = $('lGo'), em = $('lEmail'), pw = $('lPass'), er = $('aErr');

    async function doLogin(){
      er.classList.remove('show');
      const e = em.value.trim(), p = pw.value;
      if (!e || !p){ er.textContent = 'Введите почту и пароль'; er.classList.add('show'); return; }
      go.disabled = true; go.textContent = 'Входим…';
      try {
        await signIn(e, p);
        boot();
      } catch(err){
        er.textContent = err.message;
        er.classList.add('show');
        go.disabled = false; go.textContent = 'Войти';
      }
    }
    go.addEventListener('click', doLogin);
    [em, pw].forEach(function(i){
      i.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doLogin(); });
    });
  }

  /* ---------- Расчёт статистики по комиссии ---------- */
  function computeFeeStats(){
    const a = A.admin || {};
    const feePct = a.fee_pct != null ? a.fee_pct : 3;
    const debtLimit = Number(a.debt_limit) || 0;

    const closed = ORDERS.filter(function(p){ return p.status === 'closed'; });
    const feeAll = closed.reduce(function(acc, p){ return acc + (Number(p.fee) || 0); }, 0);
    const rentAll = closed.reduce(function(acc, p){ return acc + (Number(p.rent_sum) || 0); }, 0);

    const paidAll = FEES.filter(function(f){ return f.status === 'confirmed'; })
                        .reduce(function(acc, f){ return acc + (Number(f.amount) || 0); }, 0);
    const pendingPaid = FEES.filter(function(f){ return f.status === 'pending'; })
                            .reduce(function(acc, f){ return acc + (Number(f.amount) || 0); }, 0);

    const debt = Math.max(0, feeAll - paidAll);
    const isBlocked = debtLimit > 0 && debt > debtLimit;

    // Сводка по периодам
    const now = Date.now();
    const t0 = new Date(); t0.setHours(0,0,0,0); const d0 = t0.getTime();
    const w0 = now - 6 * 86400000;
    const m0 = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();

    function pTime(str){ return new Date(String(str).replace(' ', 'T')).getTime(); }

    const per = { d:[0,0,0], w:[0,0,0], mo:[0,0,0], a:[rentAll, feeAll, rentAll - feeAll] };
    closed.forEach(function(p){
      const t = pTime(p.created_at);
      const r = Number(p.rent_sum) || 0;
      const f = Number(p.fee) || 0;
      if (t >= d0){ per.d[0] += r; per.d[1] += f; per.d[2] += (r - f); }
      if (t >= w0){ per.w[0] += r; per.w[1] += f; per.w[2] += (r - f); }
      if (t >= m0){ per.mo[0] += r; per.mo[1] += f; per.mo[2] += (r - f); }
    });

    return {
      feePct: feePct,
      debtLimit: debtLimit,
      feeAll: feeAll,
      rentAll: rentAll,
      paidAll: paidAll,
      pendingPaid: pendingPaid,
      debt: debt,
      isBlocked: isBlocked,
      closedCount: closed.length,
      per: per
    };
  }

  /* ---------- Каркас кабинета ---------- */
  function shell(inner){
    const cnt = {
      all:        MY.length,
      active:     MY.filter(function(t){ return (t.status||'active') === 'active'; }).length,
      moderation: MY.filter(function(t){ return t.status === 'moderation'; }).length,
      archived:   MY.filter(function(t){ return t.status === 'archived'; }).length
    };

    const activeOrdersCnt = ORDERS.filter(function(o){
      const st = o.status || 'new';
      return !o.archived && (st === 'new' || st === 'rented');
    }).length;

    const fStat = isAdmin() ? computeFeeStats() : { debt: 0 };

    const tabsHtml =
      (isAdmin() ?
        '<button data-tab="ads" class="' + (TAB==='ads'?'on':'') + '">' +
          'Мои объявления<span class="n">' + cnt.all + '</span></button>' +
        '<button data-tab="orders" class="' + (TAB==='orders'?'on':'') + '">' +
          'Заявки' + (activeOrdersCnt ? '<span class="n">' + activeOrdersCnt + '</span>' : '') + '</button>' +
        '<button data-tab="fee" class="' + (TAB==='fee'?'on':'') + '">' +
          'Комиссия и оплата' + (fStat.debt > 0 ? '<span class="n warn">!</span>' : '') + '</button>' +
        '<button data-tab="reviews" class="' + (TAB==='reviews'?'on':'') + '">' +
          'Отзывы' + (REVIEWS.length ? '<span class="n">' + REVIEWS.length + '</span>' : '') + '</button>'
      :
        '<button data-tab="orders" class="' + (TAB==='orders'?'on':'') + '">' +
          'Мои заявки' + (ORDERS.length ? '<span class="n">' + ORDERS.length + '</span>' : '') + '</button>'
      ) +
      '<button data-tab="fav" class="' + (TAB==='fav'?'on':'') + '">' +
        'Избранное<span class="n fav-n">' + favList().length + '</span></button>' +
      '<button data-tab="msg" class="' + (TAB==='msg'?'on':'') + '">Сообщения</button>' +
      '<button data-tab="prof" class="' + (TAB==='prof'?'on':'') + '">Профиль</button>';

    return '<div class="sect" style="padding-bottom:0"><div class="sect-h">' +
        '<h2>' + esc(A.uname || 'Кабинет') + '</h2>' +
        '<span class="cnt">' + esc(A.me) + (isAdmin() ? ' · арендодатель' : '') + '</span>' +
      '</div></div>' +
      '<div class="tabs">' + tabsHtml + '</div>' + inner;
  }

  /* ---------- Мои объявления ---------- */
  function viewAds(){
    const f = SUB_TAB === 'all' ? MY : MY.filter(function(t){
      return (t.status || 'active') === SUB_TAB;
    });

    const cnt = function(s){
      return s === 'all' ? MY.length
        : MY.filter(function(t){ return (t.status||'active') === s; }).length;
    };

    let h = '<div class="chips" style="margin-bottom:16px">' +
      [['all','Все'],['active','Активные'],['moderation','На модерации'],['archived','Снятые']]
        .map(function(p){
          return '<button class="chip" data-st="' + p[0] + '"' +
                 (SUB_TAB === p[0] ? ' style="border-color:var(--or);color:var(--or)"' : '') +
                 '>' + p[1] + ' · ' + cnt(p[0]) + '</button>';
        }).join('') +
      '</div>';

    if (!f.length){
      h += '<div class="empty">' +
        '<svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>' +
        '<b>' + (MY.length ? 'В этой вкладке пусто' : 'Объявлений пока нет') + '</b>' +
        '<p>' + (MY.length
          ? 'Переключитесь на другую вкладку.'
          : 'Разместите первый инструмент — он появится в каталоге сразу после публикации.') + '</p>' +
        '<a class="btn" href="new.html">Разместить объявление</a></div>';
      return h;
    }

    h += f.map(function(t){
      const st  = t.status || 'active';
      const img = (t.imgs && t.imgs[0]) || t.img || '';
      const dep = Number(t.deposit) || Number(t.price) * 5;
      return '<div class="row-ad" data-id="' + esc(t.id) + '">' +
        '<div class="rph">' +
          (img ? '<img src="' + esc(img) + '" alt="">' :
                 '<div style="width:100%;height:100%;display:flex;align-items:center;' +
                 'justify-content:center;color:var(--g2);font-size:11px">нет фото</div>') +
        '</div>' +
        '<div class="rmid">' +
          '<div class="rnm">' + esc(t.name) + '</div>' +
          '<div class="rpr">' + rub(t.price) + ' <span>/ сутки</span></div>' +
          '<div class="rmeta">Залог ' + rub(dep) + ' · ' + esc(catTitle(t.cat) || t.cat) +
            (t.delivery ? ' · доставка' : '') + '</div>' +
          '<div class="racts">' +
            '<span class="badge ' + statusCls(st) + '" style="padding:7px 12px">' +
              statusTitle(st) + '</span>' +
            '<a href="tool.html?id=' + encodeURIComponent(t.id) + '">Смотреть</a>' +
            (st === 'active'
              ? '<button data-act="hide">Снять с публикации</button>'
              : '<button class="pub" data-act="show">Опубликовать</button>') +
            '<a href="new.html?edit=' + encodeURIComponent(t.id) + '">Редактировать</a>' +
            '<button class="del" data-act="del">Удалить</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    return h;
  }

  /* ---------- Заявки ---------- */
  function viewOrders(){
    if (isAdmin()){
      return viewAdminOrders();
    }
    return viewTenantOrders();
  }

  function viewAdminOrders(){
    const ordFilter = SUB_TAB_ORD || 'all';

    const filtered = ordFilter === 'all' ? ORDERS : ORDERS.filter(function(p){
      if (ordFilter === 'archived') return !!p.archived;
      if (p.archived) return false;
      return (p.status || 'new') === ordFilter;
    });

    const cnt = function(st){
      if (st === 'all') return ORDERS.length;
      if (st === 'archived') return ORDERS.filter(function(p){ return !!p.archived; }).length;
      return ORDERS.filter(function(p){ return !p.archived && (p.status || 'new') === st; }).length;
    };

    let h = '<div class="chips" style="margin-bottom:16px">' +
      [['all','Все'],['new','Новые'],['rented','В аренде'],['closed','Завершены'],['archived','Архив']]
        .map(function(p){
          return '<button class="chip" data-ost="' + p[0] + '"' +
                 (ordFilter === p[0] ? ' style="border-color:var(--or);color:var(--or)"' : '') +
                 '>' + p[1] + ' · ' + cnt(p[0]) + '</button>';
        }).join('') +
      '</div>';

    if (!filtered.length){
      return h + '<div class="empty">' +
        '<svg viewBox="0 0 24 24"><path d="M7 4h-2l-1 2H2v13a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6h-2l-1-2h-2l1 2H6zM5 8h14v11H5zm4 2h6v2H9z"/></svg>' +
        '<b>' + (ORDERS.length ? 'В этой вкладке пусто' : 'Заявок пока нет') + '</b>' +
        '<p>' + (ORDERS.length ? 'Переключитесь на другой статус.' : 'Когда клиенты оформят заявку на ваш инструмент, она появится здесь.') + '</p>' +
      '</div>';
    }

    h += filtered.map(function(p){
      const o = p.orders || {};
      const st = p.status || 'new';
      const isArc = !!p.archived;

      let btns = '';
      if (!isArc){
        if (st === 'new'){
          btns += '<button class="btn sm" data-ord-do="rented" data-id="' + p.id + '">Выдал инструмент</button>';
          btns += '<button class="btn sm sec" data-ord-do="arch" data-id="' + p.id + '">В архив</button>';
        } else if (st === 'rented'){
          btns += '<button class="btn sm" data-ord-do="closed" data-id="' + p.id + '" style="background:var(--grn);border-color:var(--grn)">Инструмент вернули</button>';
          btns += '<button class="btn sm sec" data-ord-do="arch" data-id="' + p.id + '">В архив</button>';
        } else {
          btns += '<span class="badge b-closed" style="padding:6px 12px">Завершена · комиссия учтена</span>';
          btns += '<button class="btn sm sec" data-ord-do="arch" data-id="' + p.id + '">В архив</button>';
        }
      } else {
        btns += '<button class="btn sm sec" data-ord-do="unarch" data-id="' + p.id + '">Вернуть из архива</button>';
      }

      return '<div class="order-card" data-order-id="' + p.id + '">' +
        '<div class="top">' +
          '<span class="badge b-' + st + '">' + (st === 'new' ? 'Новая заявка' : (st === 'rented' ? 'В аренде' : 'Завершена')) + '</span>' +
          '<span class="small muted">' + niceDate(p.created_at) + (p.order_id ? (' · №' + p.order_id) : '') + '</span>' +
        '</div>' +
        '<div class="title">' + esc(p.tools_text || 'Инструмент') + '</div>' +
        (o.name ? '<div class="hint">Клиент: <b style="color:var(--tx)">' + esc(o.name) + '</b>' +
          (o.phone ? (' · <a href="tel:' + esc(o.phone.replace(/[^\d+]/g,'')) + '" style="color:var(--or);font-weight:600">' + esc(o.phone) + '</a>') : '') +
          '</div>' : '') +
        (o.get_method ? '<div class="hint">Способ получения: ' + esc(o.get_method) + '</div>' : '') +
        (o.days ? '<div class="hint">Срок аренды: <b>' + o.days + ' ' + plural(o.days, 'сутки', 'суток', 'суток') + '</b></div>' : '') +
        (o.comment ? '<div class="hint" style="margin-top:6px;background:var(--field);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.4">' + esc(o.comment) + '</div>' : '') +
        '<div style="display:flex;gap:14px;margin-top:8px;font-size:13px;flex-wrap:wrap">' +
          (p.rent_sum ? '<span>Аренда: <b>' + rub(p.rent_sum) + '</b></span>' : '') +

  /* ---------- Модалка оплаты комиссии ---------- */
  function openPayModal(){
    const s = computeFeeStats();
    const defaultSum = s.debt > 0 ? s.debt : 100;

    const body =
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<p class="small muted" style="line-height:1.5">' +
          'Переведите сумму комиссии через Систему быстрых платежей (СБП) по номеру телефона ' +
          'на имя <b>Илья Игоревич Г.</b> (Т-Банк / Сбербанк), затем отправьте подтверждение ниже.' +
        '</p>' +
        '<div style="background:var(--field);padding:12px;border-radius:10px">' +
          '<div class="small muted">Телефон получателя:</div>' +
          '<div style="font-size:17px;font-weight:700;margin:3px 0 6px">+7 (908) 173-14-10</div>' +
          '<div class="small muted">Назначение перевода: <b>Комиссия Ива (' + esc(A.me) + ')</b></div>' +
        '</div>' +
        '<div class="fld">' +
          '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Сумма перевода, ₽ *</label>' +
          '<input class="inp" id="payModalAmount" type="number" min="1" step="1" value="' + defaultSum + '" required>' +
        '</div>' +
        '<div class="fld">' +
          '<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Примечание (необязательно)</label>' +
          '<input class="inp" id="payModalNote" placeholder="Например: СБП Т-Банк, последние 4 цифры или ФИО">' +
        '</div>' +
        '<div id="payModalErr" style="color:var(--red);font-size:13px;display:none"></div>' +
      '</div>';

    const foot =
      '<button class="btn sec" id="payModalCancel" style="flex:1">Отмена</button>' +
      '<button class="btn" id="payModalSubmit" style="flex:2">Я оплатил — отправить</button>';

    openSheet('Оплата комиссии', body, foot);

    $('payModalCancel').onclick = closeSheet;

    $('payModalSubmit').onclick = async function(){
      const amtInput = $('payModalAmount');
      const noteInput = $('payModalNote');
      const errEl = $('payModalErr');
      errEl.style.display = 'none';

      const amt = Number(amtInput.value) || 0;
      if (amt <= 0){
        errEl.textContent = 'Укажите положительную сумму перевода';
        errEl.style.display = 'block';
        return;
      }

      const btn = $('payModalSubmit');
      btn.disabled = true;
      btn.textContent = 'Отправляем…';

      try {
        await addFee({
          admin_email: A.me,
          amount: amt,
          status: 'pending',
          note: noteInput.value.trim() || ('Оплата комиссии от ' + A.me)
        });

        closeSheet();
        toast('Платёж зафиксирован и отправлен на подтверждение');
        FEES = await loadMyFeePayments();
        render();
      } catch(err){
        btn.disabled = false;
        btn.textContent = 'Я оплатил — отправить';
        errEl.textContent = 'Не удалось зафиксировать платёж: ' + err.message;
        errEl.style.display = 'block';
      }
    };
  }

      '</form>' +
      '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">' +
        (isAdmin() ? '<a class="btn sec sm" href="#rentalProfile" id="jumpRental">Данные проката ↓</a>' : '<button class="btn sec sm" id="editPersonal">Редактировать данные</button>') +
        '<button class="btn ghost sm" id="bOut">Выйти</button>' +
      '</div>' +
      '<div style="margin-top:24px;padding:16px;background:var(--card);border:1px solid var(--or);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">' +
        '<div>' +
          '<b style="font-size:15px;display:flex;align-items:center;gap:6px">📱 Нативное приложение для Android <span style="font-size:11px;background:var(--or-soft);color:var(--or);padding:2px 6px;border-radius:4px;font-weight:700">v10.12</span></b>' +
          '<div style="font-size:12.5px;color:var(--gr);margin-top:4px">Исправлен вход в кабинет. Если обновление отклонено, удалите текущую версию и установите заново; затем войдите в аккаунт.</div>' +
        '</div>' +
        '<a class="btn hot sm" href="ProkatInstrumenta-10.12-clone.apk" download style="white-space:nowrap">Скачать APK 10.12</a>' +
      '</div>' +
    '</div>' + (isAdmin() ? '<div id="rentalProfile"></div>' : '<div id="personalEditor"></div>');
  }

  /* ---------- Рендер ---------- */
  function render(){
    let inner;
    if (TAB === 'fee')           inner = viewFee();
    else if (TAB === 'orders')   inner = viewOrders();
    else if (TAB === 'reviews')  inner = viewReviews();
    else if (TAB === 'fav')      inner = viewFav();
    else if (TAB === 'msg')      inner = viewMsg();
    else if (TAB === 'prof')     inner = viewProf();
    else                         inner = isAdmin() ? viewAds() : viewFav();

    $('root').innerHTML = shell(inner);
    paintFavCount();

    if ($('btnPayFeeTop')) $('btnPayFeeTop').onclick = openPayModal;
    if ($('btnPayFeeCard')) $('btnPayFeeCard').onclick = openPayModal;
    if ($('btnCopyPhone')) $('btnCopyPhone').onclick = function(){
      copyToClipboard('89081731410', 'Номер телефона получателя скопирован');
    };

    if($('rentalProfile'))RentalProfile.mount($('rentalProfile'));
    const jump=$('jumpRental');if(jump)jump.onclick=function(e){e.preventDefault();$('rentalProfile').scrollIntoView({behavior:'smooth'});};
    const editPersonal=$('editPersonal');if(editPersonal)editPersonal.onclick=function(){
      const host=$('personalEditor');host.innerHTML='<form class="box" id="personalForm" style="max-width:640px;margin-top:18px"><label class="rp-field">Имя<input class="inp" name="name" required maxlength="150" value="'+esc(A.userMeta.full_name||A.uname||'')+'"></label><label class="rp-field" style="margin-top:14px">Телефон<input class="inp" type="tel" name="phone" maxlength="100" value="'+esc(A.userMeta.phone||'')+'"></label><p class="rp-error" role="alert"></p><button class="btn sm" style="margin-top:14px">Сохранить</button></form>';
      host.querySelector('form').onsubmit=async function(e){e.preventDefault();const form=e.currentTarget,btn=form.querySelector('button');btn.disabled=true;try{const name=form.elements.name.value.trim();if(!name)throw new Error('Укажите имя');const user=await api('/auth/v1/user','PUT',{data:Object.assign({},A.userMeta,{name:name,full_name:name,phone:form.elements.phone.value.trim()})});applyAuthUser(user);saveSess();toast('Данные сохранены');render();}catch(err){form.querySelector('[role=alert]').textContent=err.message;btn.disabled=false;}};
    };
    const cityForm=$('profileCityForm');
    if(cityForm)cityForm.addEventListener('submit',async function(e){
      e.preventDefault();const btn=cityForm.querySelector('button');btn.disabled=true;$('profileCityError').textContent='';
      try {await saveProfileCity($('profileCity').value);toast('Город профиля сохранён');btn.disabled=false;}
      catch(err){$('profileCityError').textContent=err.message;btn.disabled=false;}
    });

    const out = $('bOut');
    if (out) out.addEventListener('click', function(){
      signOut();
      toast('Вы вышли');
      screenLogin();
    });
  }

  /* Делегированные клики */
  document.addEventListener('click', function(e){
    const tb = e.target.closest('[data-tab]');
    if (tb){
      TAB = tb.getAttribute('data-tab');
      history.replaceState(null, '', '#' + TAB);
      render();
      return;
    }

    const st = e.target.closest('[data-st]');
    if (st){ SUB_TAB = st.getAttribute('data-st'); render(); return; }

    const ost = e.target.closest('[data-ost]');
    if (ost){ SUB_TAB_ORD = ost.getAttribute('data-ost'); render(); return; }

    const ordDo = e.target.closest('[data-ord-do]');
    if (ordDo){
      const id = ordDo.getAttribute('data-id');
      const act = ordDo.getAttribute('data-ord-do');
      if (id && act) doOrderAction(id, act, ordDo);
      return;
    }

    const modRev = e.target.closest('[data-mod-review]');
    if (modRev){
      const rId = modRev.getAttribute('data-mod-review');
      const st = modRev.getAttribute('data-set-status');
      modRev.disabled = true;
      toggleReviewStatus(rId, st).then(function(){
        toast(st === 'hidden' ? 'Отзыв скрыт' : 'Отзыв опубликован');
        loadLandlordReviews(A.me).then(function(revs){
          REVIEWS = revs || [];
          render();
        });
      }).catch(function(err){
        modRev.disabled = false;
        toast('Ошибка: ' + err.message);
      });
      return;
    }

    const act = e.target.closest('[data-act]');
    if (act){
      const row = act.closest('[data-id]');
      if (row) doAction(row.getAttribute('data-id'), act.getAttribute('data-act'), act);
    }
  });

  /* ---------- Действия над объявлением ---------- */
  async function doAction(id, act, btn){
    const t = MY.find(function(x){ return String(x.id) === String(id); });
    if (!t) return;

    if (act === 'del'){
      openSheet('Удалить объявление?',
        '<p style="color:var(--gr);line-height:1.6">«' + esc(t.name) + '» будет удалено безвозвратно. ' +
        'Если инструмент временно недоступен — лучше снять с публикации.</p>',
        '<button class="btn sec" id="dNo" style="flex:1">Отмена</button>' +
        '<button class="btn" id="dYes" style="flex:1;background:#C62828;border-color:#C62828">Удалить</button>');

      $('dNo').addEventListener('click', closeSheet);
      $('dYes').addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Удаляем…';
        try {
          await deleteTool(id);
          MY = MY.filter(function(x){ return String(x.id) !== String(id); });
          closeSheet(); render(); toast('Объявление удалено');
        } catch(err){
          closeSheet(); toast('Не удалось удалить: ' + err.message);
        }
      });
      return;
    }

    const map = { hide:'archived', show:'active' };
    const next = map[act];
    if (!next) return;

    const old = btn.textContent;
    btn.disabled = true; btn.textContent = '…';
    try {
      const up = await updateTool(id, { status: next });
      t.status = up ? up.status : next;
      t.active = t.status === 'active';
      render();
      toast(next === 'active' ? 'Опубликовано'
          : next === 'archived' ? 'Снято с публикации'
          : 'Отправлено на модерацию');
    } catch(err){
      btn.disabled = false; btn.textContent = old;
      toast('Не удалось: ' + err.message);
    }
  }

  /* ---------- Действия над заявками ---------- */
  async function doOrderAction(id, act, btn){
    const part = ORDERS.find(function(p){ return String(p.id) === String(id); });
    if (!part) return;

    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = '…';

    try {
      if (act === 'arch'){
        await updateOrderPart(id, { archived: true });
        part.archived = true;
        toast('Заявка перемещена в архив');
      } else if (act === 'unarch'){
        await updateOrderPart(id, { archived: false });
        part.archived = false;
        toast('Заявка восстановлена из архива');
      } else if (act === 'rented'){
        await updateOrderPart(id, { status: 'rented' });
        part.status = 'rented';
        toast('Инструмент переведён в статус «В аренде»');
      } else if (act === 'closed'){
        await updateOrderPart(id, { status: 'closed' });
        part.status = 'closed';
        toast('Заказ завершён! Комиссия учтена');
        // Обновляем список для точного расчёта начисленной комиссии
        ORDERS = await loadMyOrderParts();
      }
      render();
    } catch(err){
      btn.disabled = false;
      btn.textContent = oldText;
      toast('Ошибка: ' + err.message);
    }
  }

  window.onFavChanged = function(){ if (TAB === 'fav') render(); };

  window.addEventListener('hashchange', function(){
    const h = (location.hash || '').replace('#','');
    if (h && h !== TAB){ if(!RentalProfile.allowLeave()){history.replaceState(null,'',location.pathname+'#'+TAB);return;} TAB = h; render(); }
  });

  /* ---------- Старт ---------- */
  async function boot(){
    const showcase = hydrateShowcase(); // Избранное берём из живой витрины, а не демо-данных.
    if (isAdmin()){
      try {
        const [myTools, myParts, myFees, myReviews] = await Promise.allSettled([
          loadMyTools(),
          loadMyOrderParts(),
          loadMyFeePayments(),
          loadLandlordReviews(A.me)
        ]);
        MY = myTools.status === 'fulfilled' ? (myTools.value || []) : [];
        ORDERS = myParts.status === 'fulfilled' ? (myParts.value || []) : [];
        FEES = myFees.status === 'fulfilled' ? (myFees.value || []) : [];
        REVIEWS = myReviews.status === 'fulfilled' ? (myReviews.value || []) : [];
      } catch(e){
        MY = []; ORDERS = []; FEES = []; REVIEWS = [];
        toast('Не удалось загрузить данные: ' + e.message);
      }
    } else if (isAuthed()){
      try {
        ORDERS = await loadMySentOrders();
      } catch(e){ ORDERS = []; }
    }
    await showcase;
    if (!isAdmin() && TAB === 'ads') TAB = 'orders';
    render();
  }

  (async function init(){
    await restoreSess();
    if (!isAuthed()){ screenLogin(); return; }
    boot();
  })();
})();
</script>
</body>
</html>
