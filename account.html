        '<div class="prof-row"><dt>Статус</dt><dd>' +
          (isAdmin() ? 'Арендодатель' + (a.role === 'chief' ? ' (главный)' : '') : 'Арендатор') + '</dd></div>' +
        (a.fee_pct != null ? '<div class="prof-row"><dt>Комиссия площадки</dt><dd>' +
          esc(a.fee_pct) + ' %</dd></div>' : '') +
        '<div class="prof-row"><dt>Объявлений</dt><dd>' + MY.length + '</dd></div>' +
      '</dl>' +
      '<form id="profileCityForm" style="margin-top:20px">' +
        '<label for="profileCity" style="display:block;font-weight:600;margin-bottom:8px">Город в профиле</label>' +
        '<input class="inp" id="profileCity" name="city" autocomplete="address-level2" list="profileCityOptions" required minlength="2" maxlength="100" value="' + esc(A.profileCity || '') + '" placeholder="Укажите ваш город">' +
        '<datalist id="profileCityOptions">' + availableCities().map(c=>'<option value="'+esc(c)+'"></option>').join('') + '</datalist>' +
        '<p class="small muted" style="margin:8px 0 12px">Используется для поиска по умолчанию. Другой город можно выбрать в шапке — это не изменит профиль и адрес выдачи инструмента.</p>' +
        '<button class="btn sec sm" type="submit">Сохранить город</button>' +
        '<p id="profileCityError" role="alert" style="color:var(--red);margin-top:8px"></p>' +
      '</form>' +
      '<div class="prof-links">' +
        '<button type="button" class="prof-link" data-prof-sub="org"><b>Прокат</b><span>Название, контакты, адрес, аватарка проката</span></button>' +
        '<a class="prof-link" href="profile.html"><b>Личные настройки</b><span>Имя, телефон, вход и безопасность</span></a>' +
        '<button type="button" class="prof-link" data-prof-sub="app"><b>Приложение</b><span>Скачать Android-приложение</span></button>' +
      '</div>' +
      '<button class="btn ghost sm" id="bOut" style="margin-top:16px">Выйти</button>' +
    '</div>';
  }

  /* ---------- Рендер ---------- */
  function render(){
    /* Настройки профиля клиента — отдельная страница profile.html:
       старые ссылки account.html#prof у клиента тоже ведут туда.
       Вкладка «Профиль» в кабинете остаётся для арендодателя. */
    { const pm = /^prof-(me|org|app)$/.exec(TAB); if (pm){ PROF_SUB = pm[1]; TAB = 'prof'; } }
    if (TAB === 'prof' && !isAdmin()){ location.replace('profile.html'); return; }
    if (isAdmin()){
      /* вкладка другого режима (ссылка из уведомления, #orders и т. п.) — режим переключается сам, без перехода */
      const LEND = ['home', 'orders', 'ads', 'fee', 'reviews'], RENT = ['sent', 'fav'];
      if (LEND.indexOf(TAB) >= 0 && lordMode() !== 'lend') lordMode('lend');
      else if (RENT.indexOf(TAB) >= 0 && lordMode() !== 'rent') lordMode('rent');
      if (!TAB) TAB = lordMode() === 'rent' ? 'sent' : 'home';
    } else if (!TAB || TAB === 'home') TAB = STAFF ? 'staff' : 'orders';
    let inner;
    if (TAB === 'fee')           inner = viewFee();
    else if (TAB === 'orders')   inner = viewOrders();
    else if (TAB === 'reviews')  inner = viewReviews();
    else if (TAB === 'sent')     inner = viewTenantOrders(SENT);
    else if (TAB === 'staff')    inner = viewStaff();
    else if (TAB === 'fav')      inner = viewFav();
    else if (TAB === 'msg')      inner = viewMsg();
    else if (TAB === 'prof')     inner = viewProf();
    else if (TAB === 'home' && isAdmin()) inner = viewHome();
    else if (TAB === 'ads' && isAdmin())  inner = viewAds();
    else                         inner = isAdmin() ? viewHome() : viewFav();

    $('root').innerHTML = shell(inner);
    paintFavCount();
    /* выбранная вкладка видна и на узком экране (строка вкладок прокручивается) */
    (function(){ const tb = document.querySelector('.tabs'), on = tb && tb.querySelector('button.on');
      if (on && tb.scrollWidth > tb.clientWidth) tb.scrollLeft = on.offsetLeft - tb.offsetLeft - (tb.clientWidth - on.offsetWidth) / 2; })();

    if (TAB === 'staff' && STAFF && STAFF.status === 'active') stAuto();
    if (TAB === 'orders' && isAdmin()){
      oAuto();
      if ($('ordQ')){
        let oT = null;
        $('ordQ').oninput = function(){
          const v = this.value; clearTimeout(oT);
          oT = setTimeout(function(){ OQ = v; const l = $('ordList'); if (l) l.innerHTML = oListHTML(); }, 150);
        };
      }
    }
    if ($('stTq')){
      let stT2 = null;
      $('stTq').oninput = function(){
        const v = this.value; clearTimeout(stT2);
        stT2 = setTimeout(function(){ ST_TQ = v; const l = $('stTList'); if (l) l.innerHTML = stToolListHTML(); }, 150);
      };
    }
    if ($('stQ')){
      let stT = null;
      $('stQ').oninput = function(){
        const v = this.value; clearTimeout(stT);
        stT = setTimeout(function(){ ST_Q = v; const l = $('stList'); if (l) l.innerHTML = stListHTML(); }, 150);
      };
    }
    if ($('btnPayFeeTop')) $('btnPayFeeTop').onclick = openPayModal;
    if ($('btnCopyPhone')) $('btnCopyPhone').onclick = function(){
      copyToClipboard('89081731410', 'Номер телефона получателя скопирован');
    };

    if($('apkCards'))mountAppCards($('apkCards'));
    if (typeof ivaTabsFade === 'function') ivaTabsFade(document.querySelector('#root .tabs'));
    /* Аватарки (21.10.2026): своё фото (admins.avatar) и аватарка проката (admins.org_avatar) — те же поля, что в приложении */
    if (typeof IvaAva !== 'undefined'){
      const me1 = function(){ IvaAva.pick('Фото профиля', IvaAva.saveMine); };
      const org1 = function(){ IvaAva.pick('Аватарка проката', IvaAva.saveOrg); };
      if ($('profAva')){ $('profAva').onclick = me1; if ($('profAvaBtn')) $('profAvaBtn').onclick = me1; }
      if ($('orgAva')){ $('orgAva').onclick = org1; if ($('orgAvaBtn')) $('orgAvaBtn').onclick = org1; }
      IvaAva.paint($('root'));
    }
    if($('rentalProfile'))RentalProfile.mount($('rentalProfile'));
    const cityForm=$('profileCityForm');
    if(cityForm)cityForm.addEventListener('submit',async function(e){
      e.preventDefault();const btn=cityForm.querySelector('button');btn.disabled=true;$('profileCityError').textContent='';
      try {await saveProfileCity($('profileCity').value);toast('Город профиля сохранён');btn.disabled=false;}
      catch(err){$('profileCityError').textContent=err.message;btn.disabled=false;}
    });

    const out = $('bOut');
    if (out) out.addEventListener('click', function(){
      signOut(); try { localStorage.removeItem("iva_staff_hint"); localStorage.removeItem("iva_lord_hint"); } catch(x){}
      toast('Вы вышли');
      screenLogin();
    });
  }

  /* Делегированные клики */
  document.addEventListener('click', function(e){
    const tb = e.target.closest('[data-tab]');
    if (tb){
      TAB = tb.getAttribute('data-tab');
      if (TAB === 'prof') PROF_SUB = 'me';
      history.replaceState(null, '', '#' + TAB);
      render();
      return;
    }

    const st = e.target.closest('[data-st]');
    if (st){ SUB_TAB = st.getAttribute('data-st'); render(); return; }

    /* «Профиль»: разделы; несохранённый профиль проката не теряется молча */
    const ps = e.target.closest('[data-prof-sub]');
    if (ps){
      if (typeof RentalProfile !== 'undefined' && RentalProfile.allowLeave && !RentalProfile.allowLeave()) return;
      PROF_SUB = ps.getAttribute('data-prof-sub');
      history.replaceState(null, '', '#prof' + (PROF_SUB === 'me' ? '' : '-' + PROF_SUB));
      render(); window.scrollTo(0, 0);
      return;
    }

    /* «Сводка»: строка или плитка ведёт в нужную вкладку с нужным фильтром */
    const rvf = e.target.closest('[data-rv-f]');
    if (rvf){ RV_F = rvf.getAttribute('data-rv-f'); render(); return; }
    const go = e.target.closest('[data-go-tab]');
    if (go){
      TAB = go.getAttribute('data-go-tab');
      if (go.getAttribute('data-go-sub')) SUB_TAB_ORD = go.getAttribute('data-go-sub');
      if (go.getAttribute('data-go-st')) SUB_TAB = go.getAttribute('data-go-st');
      history.replaceState(null, '', '#' + TAB);
      render(); window.scrollTo(0, 0);
      return;
    }

    const sAns = e.target.closest('[data-staff-ans]');
    if (sAns && STAFF){
      const yes = sAns.getAttribute('data-staff-ans') === '1';
      if (!yes && !confirm('Отказаться от приглашения в прокат «' + (STAFF.company || '') + '»?')) return;
      sAns.disabled = true;
      api('/rest/v1/rpc/iva_staff_answer', 'POST', { p_id: STAFF.id, p_accept: yes }).then(async function(){
        toast(yes ? 'Готово: вы сотрудник проката' : 'Вы отказались от приглашения');
        await loadStaff(); if (!STAFF) TAB = 'orders'; render();
      }).catch(function(err){ sAns.disabled = false; toast('Не удалось: ' + err.message); });
      return;
    }
    /* «Вернули» по сроку заявки — владелец и сотрудник с правом «Выдача» (как в приложении) */
    const lRet = e.target.closest('[data-lc-ret]');
    if (lRet){
      const id = lRet.getAttribute('data-lc-ret'), d = parseInt(lRet.getAttribute('data-days'), 10);
      if (!/^\d{1,18}$/.test(id || '') || !(d >= 1 && d <= 365)) return;
      const names = lRet.getAttribute('data-names') || '', last = lRet.getAttribute('data-last') === '1';
      askSheet('Отметить «Вернули»?', '<div class="st-ask">' + (names ? '<b>' + esc(names) + '</b>' : '') +
          '<p>Срок ' + esc(lcDaysTxt(d)) + '. ' + (last ? 'Заявка закроется, сумма посчитается по начатым суткам.' : 'Остальные инструменты заявки остаются в аренде.') + '</p></div>',
        'Вернули').then(function(yes){
        if (!yes) return;
        lRet.disabled = true; lRet.textContent = '…';
        api('/rest/v1/rpc/iva_staff_return', 'POST', { p_part: Number(id), p_days: d }).then(async function(r){
          toast(String(r).indexOf('closed') >= 0 ? 'Готово: заявка закрыта' : 'Готово: отмечено «Вернули»');
          await lcReload();
        }).catch(async function(err){ toast('Не удалось: ' + err.message); await lcReload(); });
      });
      return;
    }
    /* просьба клиента изменить заявку: «Принять» / «Отклонить» */
    const lDec = e.target.closest('[data-lc-decide]');
    if (lDec){
      const cid = lDec.getAttribute('data-lc-decide'), ok = lDec.getAttribute('data-ok') === '1';
      if (!/^\d{1,18}$/.test(cid || '')) return;
      if (!confirm(ok ? 'Принять изменение? Заявка станет такой, как просит клиент.' : 'Отклонить изменение? Останется прежний вариант заявки.')) return;
      lDec.disabled = true; lDec.textContent = '…';
      api('/rest/v1/rpc/iva_order_edit_decide', 'POST', { p_change: Number(cid), p_ok: ok }).then(async function(){
        toast(ok ? 'Изменение принято' : 'Изменение отклонено');
        await lcReload();
      }).catch(async function(err){ toast('Не удалось: ' + err.message); await lcReload(); });
      return;
    }
    const sDo = e.target.closest('[data-staff-do]');
    if (sDo){
      const act = sDo.getAttribute('data-staff-do'), id = sDo.getAttribute('data-id');
      if (!/^\d{1,18}$/.test(id || '')) return;
      const sp = SPARTS.find(function(x){ return String(x.part_id) === String(id); }) || {};
      const sd = Number(sp.days) || 1;
      askSheet(act === 'rented' ? 'Отметить «Выдал»?' : 'Отметить «Вернули»?',
        '<div class="st-ask"><b>' + esc(sp.tools_text || 'Инструмент') + '</b>' +
          (sp.client_name ? '<div class="small muted">Клиент: ' + esc(sp.client_name) + (sp.point_name ? ' · ' + esc(sp.point_name) : '') + '</div>' : '') +
          '<p>' + (act === 'rented' ? 'Срок аренды — ' + esc(lcDaysTxt(sd)) + ' — пойдёт с этой минуты.' : 'Заявка закроется целиком (все инструменты в ней).') + '</p></div>',
        act === 'rented' ? 'Выдал' : 'Вернули').then(function(yes){
        if (!yes) return;
        sDo.disabled = true; sDo.textContent = '…';
        api('/rest/v1/rpc/iva_staff_set_status', 'POST', { p_part: Number(id), p_status: act }).then(async function(){
          toast(act === 'rented' ? 'Готово: заявка выдана' : 'Готово: заявка закрыта');
          await loadStaff(); ST_UPD = Date.now(); stRepaint();
        }).catch(async function(err){ toast('Не удалось: ' + err.message); await loadStaff(); stRepaint(); });
      });
      return;
    }
    if (e.target.closest('[data-staff-reload]')){
      loadStaff().then(function(){ ST_UPD = Date.now(); render(); toast('Обновлено'); });
      return;
    }
    /* «Работа»: заявки / инструмент, фильтр инструмента, запрос на удаление */
    const stCh = e.target.closest('[data-st-chat]');
    if (stCh){ stOpenChat(stCh.getAttribute('data-st-chat')); return; }
    const stV = e.target.closest('[data-st-view]');
    if (stV){ ST_VIEW = stV.getAttribute('data-st-view'); render(); return; }
    const stTf = e.target.closest('[data-st-tf]');
    if (stTf){ ST_TF = stTf.getAttribute('data-st-tf'); if (stTf.hasAttribute('data-st-clear')) ST_TQ = ''; render(); return; }
    const stDel = e.target.closest('[data-st-tdel]');
    if (stDel){
      const tid = stDel.getAttribute('data-st-tdel');
      const t = (STOOLS || []).find(function(x){ return String(x.id) === tid; }) || {};
      askSheet('Удалить инструмент?', '<div class="st-ask"><b>' + esc(t.name || 'Инструмент') + '</b>' +
          (t.point_name ? '<div class="small muted">' + esc(t.point_name) + '</div>' : '') +
          '<p>Запрос уйдёт владельцу проката. Пока он не одобрит, инструмент остаётся в каталоге.</p></div>', 'Отправить запрос').then(function(yes){
        if (!yes) return;
        stDel.disabled = true; stDel.textContent = '…';
        api('/rest/v1/rpc/iva_staff_tool_delete', 'POST', { p_id: tid }).then(async function(){
          toast('Запрос на удаление отправлен владельцу');
          await loadStaff(); ST_UPD = Date.now(); stRepaint();
        }).catch(async function(err){ toast('Не удалось: ' + err.message); await loadStaff(); stRepaint(); });
      });
      return;
    }
    /* «Смена»: пункт, плитки-фильтры */
    const stPt = e.target.closest('[data-st-pt]');
    if (stPt){ ST_PT = stPt.getAttribute('data-st-pt'); render(); return; }
    const stF = e.target.closest('[data-st-f]');
    if (stF){
      const f = stF.getAttribute('data-st-f');
      ST_F = ST_F === f ? 'all' : f;
      if (stF.hasAttribute('data-st-clear')){ ST_F = 'all'; ST_Q = ''; }
      render(); return;
    }

    const ost = e.target.closest('[data-ost]');
    if (ost){ SUB_TAB_ORD = ost.getAttribute('data-ost'); render(); return; }
    /* «Заявки» владельца: плитки-фильтры, пункт, «Обновить» */
    const oF = e.target.closest('[data-ord-f]');
    if (oF){
      const f = oF.getAttribute('data-ord-f');
      SUB_TAB_ORD = SUB_TAB_ORD === f ? 'all' : f;
      if (oF.hasAttribute('data-ord-clear')){ SUB_TAB_ORD = 'all'; OQ = ''; }
      render(); return;
    }
    const oPt = e.target.closest('[data-ord-pt]');
    if (oPt){ O_PT = oPt.getAttribute('data-ord-pt'); render(); return; }
    if (e.target.closest('[data-ord-reload]')){
      oReload().then(function(f){ oRepaint(); toast(f.length ? 'Новых заявок: ' + f.length : 'Обновлено'); })
        .catch(function(err){ toast('Не удалось обновить: ' + err.message); });
      return;
    }

    const ordDo = e.target.closest('[data-ord-do]');
    if (ordDo){
      const id = ordDo.getAttribute('data-id');
      const act = ordDo.getAttribute('data-ord-do');
      if (id && act) doOrderAction(id, act, ordDo);
      return;
    }

    const modRev = e.target.closest('[data-mod-review]');
    if (modRev){
      const rId = modRev.getAttribute('data-mod-review');
      const st = modRev.getAttribute('data-set-status');
      modRev.disabled = true;
      toggleReviewStatus(rId, st).then(function(){
        toast(st === 'hidden' ? 'Отзыв скрыт' : 'Отзыв опубликован');
        loadLandlordReviews(A.me).then(function(revs){
          REVIEWS = revs || [];
          render();
        });
      }).catch(function(err){
        modRev.disabled = false;
        toast('Ошибка: ' + err.message);
      });
      return;
    }

    /* меню «⋯» карточки объявления */
    const adm = e.target.closest('[data-ad-menu]');
    if (adm){
      const row = adm.closest('[data-id]'), id = row && row.getAttribute('data-id');
      const t = MY.find(function(x){ return String(x.id) === String(id); });
      if (!t) return;
      const st = t.status || 'active';
      openSheet(t.name || 'Объявление',
        '<div class="ad-menu" data-ad-id="' + esc(t.id) + '">' +
          '<a class="ad-mi" href="tool.html?id=' + encodeURIComponent(t.id) + '">Смотреть на сайте</a>' +
          '<a class="ad-mi" href="new.html?edit=' + encodeURIComponent(t.id) + '">Редактировать</a>' +
          (st === 'active' ? '<button type="button" class="ad-mi" data-ad-do="hide">Снять с публикации<span>Объявление пропадёт из каталога, его можно вернуть</span></button>'
                           : '<button type="button" class="ad-mi" data-ad-do="show">Опубликовать</button>') +
          '<button type="button" class="ad-mi del" data-ad-do="del">Удалить</button>' +
        '</div>');
      return;
    }
    const adDo = e.target.closest('[data-ad-do]');
    if (adDo){
      const box = adDo.closest('[data-ad-id]'), id = box && box.getAttribute('data-ad-id');
      const a2 = adDo.getAttribute('data-ad-do');
      const rowBtn = document.querySelector('.row-ad[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"] .ad-more');
      closeSheet(true);
      if (id) doAction(id, a2, rowBtn || adDo);
      return;
    }

    const act = e.target.closest('[data-act]');
    if (act){
      const row = act.closest('[data-id]');
      if (row) doAction(row.getAttribute('data-id'), act.getAttribute('data-act'), act);
    }
  });

  /* ---------- Действия над объявлением ---------- */
  async function doAction(id, act, btn){
    const t = MY.find(function(x){ return String(x.id) === String(id); });
    if (!t) return;

    if (act === 'del'){
      openSheet('Удалить объявление?',
        '<p style="color:var(--gr);line-height:1.6">«' + esc(t.name) + '» будет удалено безвозвратно. ' +
        'Если инструмент временно недоступен — лучше снять с публикации.</p>',
        '<button class="btn sec" id="dNo" style="flex:1">Отмена</button>' +
        '<button class="btn" id="dYes" style="flex:1;background:#C62828;border-color:#C62828">Удалить</button>');

      $('dNo').addEventListener('click', closeSheet);
      $('dYes').addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Удаляем…';
        try {
          await deleteTool(id);
          MY = MY.filter(function(x){ return String(x.id) !== String(id); });
          closeSheet(); render(); toast('Объявление удалено');
        } catch(err){
          closeSheet(); toast('Не удалось удалить: ' + err.message);
        }
      });
      return;
    }

    const map = { hide:'archived', show:'active' };
    const next = map[act];
    if (!next) return;

    const old = btn.textContent;
    btn.disabled = true; btn.textContent = '…';
    try {
      const up = await updateTool(id, { status: next });
      t.status = up ? up.status : next;
      t.active = t.status === 'active';
      render();
      toast(next === 'active' ? 'Опубликовано'
          : next === 'archived' ? 'Снято с публикации'
          : 'Отправлено на модерацию');
    } catch(err){
      btn.disabled = false; btn.textContent = old;
      toast('Не удалось: ' + err.message);
    }
  }

  /* ---------- Действия над заявками ---------- */
  async function doOrderAction(id, act, btn){
    const part = ORDERS.find(function(p){ return String(p.id) === String(id); });
    if (!part) return;

    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = '…';

    try {
      if (act === 'arch'){
        if (!confirm('Переместить заявку в архив?')){ btn.disabled = false; btn.textContent = oldText; return; }
        await updateOrderPart(id, { archived: true });
        part.archived = true;
        toast('Заявка перемещена в архив');
      } else if (act === 'unarch'){
        await updateOrderPart(id, { archived: false });
        part.archived = false;
        toast('Заявка восстановлена из архива');
      } else if (act === 'rented'){
        if (!confirm('Отметить «Выдал»? Срок аренды пойдёт с этой минуты.')){ btn.disabled = false; btn.textContent = oldText; return; }
        await updateOrderPart(id, { status: 'rented' });
        part.status = 'rented';
        toast('Инструмент переведён в статус «В аренде»');
      } else if (act === 'closed'){
        if (!confirm('Отметить «Вернули»? Заявка закроется целиком, комиссия будет начислена.')){ btn.disabled = false; btn.textContent = oldText; return; }
        await updateOrderPart(id, { status: 'closed' });
        part.status = 'closed';
        toast('Заказ завершён! Комиссия учтена');
        // Обновляем список для точного расчёта начисленной комиссии
        ORDERS = await loadMyOrderParts();
      }
      if (LCARDS) await loadLordCards();
      render();
    } catch(err){
      btn.disabled = false;
      btn.textContent = oldText;
      toast('Ошибка: ' + err.message);
    }
  }

  window.onFavChanged = function(){ if (TAB === 'fav') render(); };

  window.addEventListener('hashchange', function(){
    const h = (location.hash || '').replace('#','');
    if (h && h !== TAB){ if(!RentalProfile.allowLeave()){history.replaceState(null,'',location.pathname+'#'+TAB);return;} TAB = h; render(); }
  });

  /* ---------- Старт ---------- */
  /* Заявки клиента со статусами частей (как в приложении): отмена клиентом живёт в order_parts.status = 'cancelled',
     а у самой заявки статус остаётся «new» — без частей сайт показывал отменённую заявку как «На рассмотрении»/«Завершена». */
  async function loadClientOrders(){
    let rows;
    try {
      rows = await api('/rest/v1/orders?select=*,order_parts(id,owner_email,status)&user_email=eq.' + encodeURIComponent(A.me) + '&order=id.desc&limit=50') || [];
    } catch(e){
      try { rows = await api('/rest/v1/orders?select=*,order_parts(status)&user_email=eq.' + encodeURIComponent(A.me) + '&order=id.desc&limit=50') || []; }
      catch(e2){ return await loadMySentOrders(); }
    }
    rows.forEach(function(o){
      const ps = (o.order_parts || []).map(function(x){ return x.status || 'new'; });
      if (!ps.length) return;
      if (ps.every(function(x){ return x === 'cancelled'; })) o.status = 'cancelled';
      else if (ps.some(function(x){ return x === 'rented'; })) o.status = 'rented';
      else if (ps.some(function(x){ return x === 'new'; })) o.status = 'new';
      else o.status = 'closed';
    });
    return rows;
  }

  async function boot(){
    const showcase = hydrateShowcase(); // Избранное берём из живой витрины, а не демо-данных.
    if (isAdmin()){
      try {
        const [myTools, myParts, myFees, myReviews, mySent] = await Promise.allSettled([
          loadMyTools(),
          loadMyOrderParts(),
          loadMyFeePayments(),
          loadLandlordReviews(A.me),
          loadClientOrders(),
          loadClientCards(),
          loadLordCards()
        ]);
        SENT = mySent.status === 'fulfilled' ? (mySent.value || []) : [];
        MY = myTools.status === 'fulfilled' ? (myTools.value || []) : [];
        ORDERS = myParts.status === 'fulfilled' ? (myParts.value || []) : [];
        FEES = myFees.status === 'fulfilled' ? (myFees.value || []) : [];
        REVIEWS = myReviews.status === 'fulfilled' ? (myReviews.value || []) : [];
      } catch(e){
        MY = []; ORDERS = []; FEES = []; REVIEWS = [];
        toast('Не удалось загрузить данные: ' + e.message);
      }
    } else if (isAuthed()){
      try {
        const both = await Promise.all([loadClientOrders(), loadClientCards()]);
        ORDERS = both[0] || [];
      } catch(e){ ORDERS = []; }
      await loadStaff();
    }
    await showcase;
    if (!isAdmin() && (TAB === 'ads' || TAB === 'sent' || TAB === 'home')) TAB = STAFF ? 'staff' : 'orders';
    if (TAB === 'staff' && !STAFF) TAB = 'orders';
    render();
  }

  (async function init(){
    /* Ссылка из письма «подтвердите почту»: #access_token=…&refresh_token=…&type=signup.
       Ключ берём только из адреса после «#» (на сервер не уходит) и сразу убираем из строки. */
    const hp = new URLSearchParams((location.hash || '').slice(1));
    if (hp.get('access_token') && hp.get('refresh_token')){
      A.tok = hp.get('access_token'); A.rtok = hp.get('refresh_token'); saveSess();
      history.replaceState(null, '', location.pathname + location.search);
      TAB = 'orders';
    }
    await restoreSess();
    if (!isAuthed()){ screenLogin(); return; }
    if (nextUrl() && hp.get('access_token')){ location.replace(nextUrl()); return; }
    boot();
  })();
})();
</script>
</body>
</html>
