    const p = isNew ? { name: pts.length ? '' : 'Основной пункт', address: '', city: '', lat: null, lng: null, tel: '', staff_publish: 'approve',
      open_min: [540, 540, 540, 540, 540, 540, 540], close_min: [1140, 1140, 1140, 1140, 1140, 1140, 1140] }
      : pts.find(function(x){ return String(x.id) === String(id); });
    if (!p) return;
    const geo = { lat: p.lat, lng: p.lng, city: p.city || '' };
    const op = Array.isArray(p.open_min) && p.open_min.length === 7 ? p.open_min : [540, 540, 540, 540, 540, 540, 540];
    const cl = Array.isArray(p.close_min) && p.close_min.length === 7 ? p.close_min : [1140, 1140, 1140, 1140, 1140, 1140, 1140];
    const staff = isNew ? [] : (OW_STAFF || []).filter(function(s){ return (s.point_ids || []).map(String).indexOf(String(p.id)) >= 0; });
    const body = '<form class="ow-form" id="owPf" novalidate data-point="' + esc(isNew ? 'new' : p.id) + '">' +
      '<div class="sw-fld"><label class="sw-l" for="owPfName">Название</label><input class="inp" id="owPfName" maxlength="80" autocomplete="off" value="' + esc(p.name || '') + '" placeholder="Например: Склад на Маресьева"></div>' +
      '<div class="sw-fld"><label class="sw-l" for="owPfAddr">Адрес</label><input class="inp" id="owPfAddr" name="point-address" maxlength="300" value="' + esc(p.address || '') + '" placeholder="Новочеркасск, ул. Маресьева, д. 36">' +
        '<input type="hidden" name="point-city" id="owPfCity" value="' + esc(p.city || '') + '">' +
        '<div class="ow-hint">Полный адрес: город, улица, дом. Выберите подсказку — тогда и расстояние до клиента посчитается точно.</div></div>' +
      (OW_PCOL.tel ? '<div class="sw-fld"><label class="sw-l" for="owPfTel">Телефон пункта выдачи <span class="muted">— необязательно</span></label><input class="inp" id="owPfTel" type="tel" maxlength="30" value="' + esc(p.tel || '') + '" placeholder="+7 900 123-45-67">' +
        '<div class="ow-hint">Клиенты видят его в карточке инструмента. Пусто — звонки идут на ваш номер.</div></div>' : '') +
      '<div class="sw-l">График</div><div class="ow-hours">' + OW_DAYS.map(function(d, i){
        const on = Number(op[i]) >= 0;
        return '<div class="ow-hr' + (on ? '' : ' off') + '" data-ow-d="' + i + '"><b>' + d + '</b>' +
          '<input class="inp" type="time" step="300" aria-label="' + d + ': открытие" data-ow-o value="' + (on ? owHM(op[i]) : '09:00') + '"' + (on ? '' : ' disabled') + '>' +
          '<span class="muted">–</span>' +
          '<input class="inp" type="time" step="300" aria-label="' + d + ': закрытие" data-ow-c value="' + (on ? owHM(cl[i]) : '19:00') + '"' + (on ? '' : ' disabled') + '>' +
          '<label class="chk"><input type="checkbox" data-ow-w' + (on ? ' checked' : '') + '><span>рабочий</span></label></div>';

  /* подтверждение в нижней панели (вместо окна браузера) */
  function askSheet(title, body, okLabel){
    return new Promise(function(res){
      let done = false;
      const fin = function(v){ if (!done){ done = true; res(v); } };
      openSheet(title, body,
        '<button class="btn sec" id="askNo" style="flex:1">Отмена</button>' +
        '<button class="btn" id="askYes" style="flex:1">' + esc(okLabel) + '</button>');
      const sh = $('sheet');
      $('askNo').onclick = function(){ fin(false); closeSheet(); };
      $('askYes').onclick = function(){ fin(true); closeSheet(true); };
      const mo = new MutationObserver(function(){ if (!document.body.contains(sh)){ mo.disconnect(); fin(false); } });
      mo.observe(document.body, { childList: true });
    });
  }
  function staffPartCard(p){
    if (STAFF && STAFF.owner && p._row){     // владелец: карточка и кнопки — как в его «Заявках» («Выдал», «Вернули», «В архив»)

      return ok ? lcCardHTML(p._row, ok, false) : oPlainCardHTML(p._row);
    }
    const sk = SCARDS && SCARDS[String(p.part_id)];
    if (sk) return lcCardHTML(p, sk, true);
    const i = stInfo(p), st = i.st;
    const days = Number(p.days) || 1;
    let due = '';
    if (st === 'rented' && p.rented_at){
      due = '<div class="hint"' + (i.late ? ' style="color:var(--red)"' : '') + '>Выдан ' + esc(stWhen(Date.parse(p.rented_at))) +
        ' · вернуть до <b>' + esc(stWhen(i.end)) + '</b>' + (i.late ? ' — просрочено' : '') + '</div>';

    if (p.can_act && st === 'rented') btns = '<button class="btn sm lc-ok" data-staff-do="closed" data-id="' + esc(p.part_id) + '">Вернули</button>';
    if (!p.can_act && p.mine && (st === 'new' || st === 'rented')) btns = '<span class="small muted">Это ваша заявка — отмечает другой сотрудник или владелец</span>';
    if (tel && (st === 'new' || st === 'rented')) btns += '<a class="btn sm sec" href="tel:' + esc(tel) + '">Позвонить</a>';
    const tint = st === 'new' ? 'new' : st === 'rented' ? (i.late ? 'late' : 'rented') : 'off';

      (p.get_method ? '<div class="hint">Получение: ' + esc(p.get_method) + '</div>' : '') +
      (p.comment ? '<div class="hint lc-comment">' + esc(p.comment) + '</div>' : '') +

  /* ---------- Действия над объявлением ---------- */
  async function doAction(id, act, btn){
    const t = MY.find(function(x){ return String(x.id) === String(id); });
    if (!t) return;

    if (act === 'del'){
      openSheet('Удалить объявление?',
        '<p style="color:var(--gr);line-height:1.6">«' + esc(t.name) + '» будет удалено безвозвратно. ' +
        'Если инструмент временно недоступен — лучше снять с публикации.</p>',
        '<button class="btn sec" id="dNo" style="flex:1">Отмена</button>' +
        '<button class="btn" id="dYes" style="flex:1;background:#C62828;border-color:#C62828">Удалить</button>');

      $('dNo').addEventListener('click', closeSheet);
      $('dYes').addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Удаляем…';
        try {
          await deleteTool(id);
          MY = MY.filter(function(x){ return String(x.id) !== String(id); });
          closeSheet(); render(); toast('Объявление удалено');
        } catch(err){
          closeSheet(); toast('Не удалось удалить: ' + err.message);
        }
      });
      return;
    }

    const map = { hide:'archived', show:'active' };
    const next = map[act];
    if (!next) return;

    const old = btn.textContent;
    btn.disabled = true; btn.textContent = '…';
    try {
      const up = await updateTool(id, { status: next });
      t.status = up ? up.status : next;
      t.active = t.status === 'active';
      render();
      toast(next === 'active' ? 'Опубликовано'
          : next === 'archived' ? 'Снято с публикации'
          : 'Отправлено на модерацию');
    } catch(err){
      btn.disabled = false; btn.textContent = old;
      toast('Не удалось: ' + err.message);
    }
  }

  /* ---------- Действия над заявками ---------- */
  async function doOrderAction(id, act, btn){
    const part = ORDERS.find(function(p){ return String(p.id) === String(id); });
    if (!part) return;

    btn.disabled = true;
    const oldText = btn.textContent;
    btn.textContent = '…';

    try {
      if (act === 'arch'){
        if (!confirm('Переместить заявку в архив?')){ btn.disabled = false; btn.textContent = oldText; return; }
        await updateOrderPart(id, { archived: true });
        part.archived = true;
        toast('Заявка перемещена в архив');
      } else if (act === 'unarch'){
        await updateOrderPart(id, { archived: false });
        part.archived = false;
        toast('Заявка восстановлена из архива');
      } else if (act === 'rented'){
        if (!confirm('Отметить «Выдал»? Срок аренды пойдёт с этой минуты.')){ btn.disabled = false; btn.textContent = oldText; return; }
        await updateOrderPart(id, { status: 'rented' });
        part.status = 'rented';
        toast('Инструмент переведён в статус «В аренде»');
      } else if (act === 'closed'){
        if (!confirm('Отметить «Вернули»? Заявка закроется целиком, комиссия будет начислена.')){ btn.disabled = false; btn.textContent = oldText; return; }
        await updateOrderPart(id, { status: 'closed' });
        part.status = 'closed';
        toast('Заказ завершён! Комиссия учтена');
        // Обновляем список для точного расчёта начисленной комиссии
        ORDERS = await loadMyOrderParts();
      }
      if (LCARDS) await loadLordCards();
      render();
    } catch(err){
      btn.disabled = false;
      btn.textContent = oldText;
      toast('Ошибка: ' + err.message);
    }
  }

  window.onFavChanged = function(){ if (TAB === 'fav') render(); };

  /* сигнал базы «в ваших заявках что-то поменялось» (IvaLive, SQL 20261119) или вкладка снова видна — перечитать сразу */
  let LIVE_T = null, LIVE_VIS = 0;
  window.addEventListener('iva:orders', function(e){
    const d = (e && e.detail) || {};
    if (d.visible){ if (Date.now() - LIVE_VIS < 15000) return; LIVE_VIS = Date.now(); }
    clearTimeout(LIVE_T);
    LIVE_T = setTimeout(liveTick, 600);
  });
  window.addEventListener('iva:live', function(){
    const a = $('ordUpd'), b = $('stUpd');
    if (a) a.textContent = oUpdTxt();
    if (b) b.textContent = stUpdTxt();
  });
  async function liveTick(){
    if (!isAuthed()) return;
    if (isAdmin()) await oTick();
    if (STAFF && STAFF.status === 'active' && !isAdmin()) await stTick();
    /* свои заявки клиента (и «Я арендую» арендодателя): статус, «Выдал», отмена */
    const mine = isAdmin() ? TAB === 'sent' : (TAB === 'orders' || TAB === 'staff');
    if (!mine || $('sheet')) return;
    try {
      const both = await Promise.all([loadClientOrders(), loadClientCards()]);
      const rows = both[0] || [], was = JSON.stringify((isAdmin() ? SENT : ORDERS).map(function(o){ return [o.id, o.status]; }));
      if (isAdmin()) SENT = rows; else ORDERS = rows;
      if (JSON.stringify(rows.map(function(o){ return [o.id, o.status]; })) !== was && TAB !== 'staff') liveRender();
    } catch(err){}
  }

  window.addEventListener('hashchange', function(){
    const h = (location.hash || '').replace('#','');
    if (h && h !== TAB){ if(!RentalProfile.allowLeave()){history.replaceState(null,'',location.pathname+'#'+TAB);return;} TAB = h; render(); }
  });

  /* ---------- Старт ---------- */
  /* Заявки клиента со статусами частей (как в приложении): отмена клиентом живёт в order_parts.status = 'cancelled',
     а у самой заявки статус остаётся «new» — без частей сайт показывал отменённую заявку как «На рассмотрении»/«Завершена». */
  async function loadClientOrders(){
    let rows;
    try {
      rows = await api('/rest/v1/orders?select=*,order_parts(id,owner_email,status)&user_email=eq.' + encodeURIComponent(A.me) + '&order=id.desc&limit=50') || [];
    } catch(e){
      try { rows = await api('/rest/v1/orders?select=*,order_parts(status)&user_email=eq.' + encodeURIComponent(A.me) + '&order=id.desc&limit=50') || []; }
      catch(e2){ return await loadMySentOrders(); }
    }
    rows.forEach(function(o){
      const ps = (o.order_parts || []).map(function(x){ return x.status || 'new'; });
      if (!ps.length) return;
      if (ps.every(function(x){ return x === 'cancelled'; })) o.status = 'cancelled';
      else if (ps.some(function(x){ return x === 'rented'; })) o.status = 'rented';
      else if (ps.some(function(x){ return x === 'new'; })) o.status = 'new';
      else o.status = 'closed';
    });
    return rows;
  }

  /* 05.11.2026 (стабильность): роль (арендодатель / сотрудник / клиент) не узнали из-за сбоя связи — два повтора,
     потом «Нет связи — Повторить». Раньше в этом случае открывался кабинет клиента с «Хотите сдавать свой инструмент?». */
  function bootWait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function bootFail(){
    $('root').className = 'wrap';
    $('root').innerHTML = '<div class="empty" style="padding:70px 20px">' +
      '<svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>' +
      '<b>Нет связи с сервером</b><p>Кабинет не загрузился: не удалось узнать вашу роль. Проверьте интернет и нажмите «Повторить».</p>' +
      '<button type="button" class="btn" data-boot-retry="1">Повторить</button></div>';
  }
  function sessLost(){
    if (isAuthed()) return false;
    if (ST_TIMER){ clearInterval(ST_TIMER); ST_TIMER = null; }
    if (O_TIMER){ clearInterval(O_TIMER); O_TIMER = null; }
    try { localStorage.removeItem('iva_staff_hint'); } catch(x){}
    $('root').className = 'wrap';
    screenLogin('Сессия завершилась — войдите снова');
    return true;
  }
  async function boot(){
    if (A.adminFail && !A.admin){
      for (let i = 0; i < 2 && A.adminFail; i++){ await bootWait(1500 * (i + 1)); await loadAdmin(); }
      if (A.adminFail && !A.admin){ bootFail(); return; }
    }
    const showcase = hydrateShowcase(); // Избранное берём из живой витрины, а не демо-данных.
    if (isAdmin()){
      const owP = Promise.allSettled([owLoadPts(), owLoadTools(), owLoadStaff(), owLoadChats()]);   // 06.11.2026: «Работа» и окна «Прокат»
      try {
        const [myTools, myParts, myFees, myReviews, mySent] = await Promise.allSettled([
          loadMyTools(),
          loadMyOrderParts(),
          loadMyFeePayments(),
          loadLandlordReviews(A.me),
          loadClientOrders(),
          loadClientCards(),
          loadLordCards()
        ]);
        SENT = mySent.status === 'fulfilled' ? (mySent.value || []) : [];
        MY = myTools.status === 'fulfilled' ? (myTools.value || []) : [];
        ORDERS = myParts.status === 'fulfilled' ? (myParts.value || []) : [];
        FEES = myFees.status === 'fulfilled' ? (myFees.value || []) : [];
        REVIEWS = myReviews.status === 'fulfilled' ? (myReviews.value || []) : [];
        if (myParts.status === 'fulfilled') O_UPD = Date.now();   // 24.10.2026: первая же новая заявка — «новая», даже если «Заявки» не открывали
      } catch(e){
        MY = []; ORDERS = []; FEES = []; REVIEWS = [];
        toast('Не удалось загрузить данные: ' + e.message);
      }
      await owP;
      owSync();
    } else if (isAuthed()){
      try {
        const both = await Promise.all([loadClientOrders(), loadClientCards()]);
        ORDERS = both[0] || [];
      } catch(e){ ORDERS = []; }
      let ok = await loadStaff();
      for (let i = 0; !ok && i < 2; i++){ await bootWait(1500 * (i + 1)); ok = await loadStaff(); }
      if (!ok && !STAFF_OK){ await showcase; bootFail(); return; }
    }
    await showcase;
    if (!isAdmin() && (TAB === 'ads' || TAB === 'sent' || TAB === 'home')) TAB = STAFF ? 'staff' : 'orders';
    if (TAB === 'staff' && !STAFF) TAB = 'orders';
    render();
  }

  (async function init(){
    /* Ссылка из письма «подтвердите почту»: #access_token=…&refresh_token=…&type=signup.
       Ключ берём только из адреса после «#» (на сервер не уходит) и сразу убираем из строки. */
    const hp = new URLSearchParams((location.hash || '').slice(1));
    if (hp.get('access_token') && hp.get('refresh_token')){
      A.tok = hp.get('access_token'); A.rtok = hp.get('refresh_token'); saveSess();
      history.replaceState(null, '', location.pathname + location.search);
      TAB = 'orders';
    }
    await restoreSess();
    if (!isAuthed()){ screenLogin(); return; }
    if (nextUrl() && hp.get('access_token')){ location.replace(nextUrl()); return; }
    boot();
  })();
})();
</script>
</body>
</html>
