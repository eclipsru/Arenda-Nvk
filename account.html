<style>
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;
  overflow-x:auto;padding-bottom:1px}
.tabs button{padding:11px 16px;font-size:14.5px;color:var(--gr);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--or);border-bottom-color:var(--or);font-weight:600}
.tabs button .n{margin-left:6px;font-size:12px;color:var(--g2)}
.tabs button.on .n{color:var(--or)}
.tabs button .n.warn{background:var(--red);color:#fff;padding:1px 6px;border-radius:8px;font-weight:700}

/* Строка объявления */
.row-ad{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;margin-bottom:11px;align-items:flex-start}
.row-ad .rph{width:104px;height:80px;border-radius:var(--r-s);overflow:hidden;
  flex-shrink:0;background:#12151B}
.row-ad .rph img{width:100%;height:100%;object-fit:cover}
.row-ad .rmid{flex:1;min-width:0}
.row-ad .rnm{font-weight:600;font-size:15px;margin-bottom:4px;line-height:1.3}
.row-ad .rpr{font-size:15px;font-weight:700}
.row-ad .rpr span{font-size:12.5px;color:var(--g2);font-weight:600}
.row-ad .rmeta{font-size:12.5px;color:var(--g2);margin-top:5px}
.row-ad .racts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.row-ad .racts button,.row-ad .racts a{font-size:13px;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--field);color:var(--gr);transition:.14s}
.row-ad .racts button:hover,.row-ad .racts a:hover{border-color:var(--line-2);color:var(--tx)}
.row-ad .racts .del:hover{border-color:var(--red);color:var(--red)}
.row-ad .racts .pub:hover{border-color:var(--or);color:var(--or)}

/* Профиль */
.prof-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.prof-row:last-child{border-bottom:none}
.prof-row dt{color:var(--g2);min-width:170px;flex-shrink:0}
.prof-row dd{font-weight:500;word-break:break-word}

/* Вход */
.auth-box{max-width:390px;margin:50px auto;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:26px}
.auth-box h2{font-size:21px;margin-bottom:6px}
.auth-box p{color:var(--g2);font-size:14px;margin-bottom:20px}
.auth-box .fld{margin-bottom:14px}
.auth-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.auth-err{background:rgba(255,138,128,.12);border:1px solid rgba(255,138,128,.3);
  color:var(--red);padding:10px 13px;border-radius:var(--r-s);font-size:13.5px;
  margin-bottom:14px;display:none}
.auth-err.show{display:block}
.auth-ok{background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.3);color:var(--grn);
  padding:10px 13px;border-radius:var(--r-s);font-size:13.5px;margin-bottom:14px;display:none;line-height:1.5}
.auth-ok.show{display:block}
.auth-tabs{display:flex;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.auth-tabs button{flex:1;padding:10px 0;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--gr)}
.auth-tabs button.on{background:var(--card);color:var(--or);box-shadow:0 1px 0 var(--line)}
.auth-box .auth-consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;color:var(--gr);margin:4px 0 16px;line-height:1.45}
.auth-consent input{margin-top:2px;width:18px;height:18px;flex-shrink:0;accent-color:var(--or)}
.auth-consent a{color:var(--or)}
.auth-fgt{text-align:right;margin:-4px 0 14px}
.auth-fgt button{color:var(--or);font-size:13px;padding:6px 0}
.b-cancelled{background:rgba(255,138,128,.14);color:var(--red)}
.staff-head b{display:block;margin-top:2px}
.staff-pts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.staff-pt{display:flex;flex-direction:column;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px}
.staff-pt b{margin:0;font-size:13.5px}
.staff-pt small{color:var(--g2);font-size:12px}
.lend-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:26px;
  padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.lend-card b{font-size:15px}
.lend-card p{color:var(--gr);font-size:13px;margin-top:4px;line-height:1.5;max-width:520px}

/* KPI показатели комиссии */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lb{font-size:12.5px;color:var(--g2);margin-bottom:7px}
.kpi .vl{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi .sub{font-size:12px;color:var(--g2);margin-top:5px}
.kpi.warn{border-color:rgba(255,138,128,.4)}
.kpi.warn .vl{color:var(--red)}
.kpi.good .vl{color:var(--grn)}

/* Таблицы */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:10px 14px;color:var(--g2);font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--field)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .neg{color:var(--red);font-weight:600}
.tbl .pos{color:var(--grn);font-weight:600}

/* Карточки заявок */
.order-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.order-card .title{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.3}
.order-card .hint{font-size:13.5px;color:var(--gr);margin-top:5px;line-height:1.4}
.order-card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Бейджи статусов */
.b-new{background:rgba(255,143,31,.16);color:var(--or)}
.b-rented{background:rgba(33,150,243,.16);color:#64B5F6}
.b-closed{background:rgba(76,175,80,.16);color:var(--grn)}
.b-mod{background:rgba(255,183,77,.16);color:var(--yel)}

.mini-btn{font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--field);color:var(--gr);transition:.14s;cursor:pointer}
.mini-btn:hover{border-color:var(--line-2);color:var(--tx)}

@media (max-width:620px){
  .row-ad{flex-wrap:wrap}
  .row-ad .rph{width:76px;height:60px}
  .row-ad.ad-c{flex-wrap:nowrap;gap:12px;padding:12px}
  .row-ad.ad-c .rph{width:96px;height:96px}
  .prof-row{flex-direction:column;gap:3px}
  .prof-row dt{min-width:0;font-size:12.5px}
  .kpi .vl{font-size:20px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px}
  .tbl:not(.tc) th:nth-child(n+4),.tbl:not(.tc) td:nth-child(n+4){display:none}
}
</style>

<script>
(function(){
  mountChrome('cab', '');

  let TAB = (location.hash || '').replace('#','');   // пусто — выбирается в render(): «Сводка» / «Я арендую» / заявки
  let MY = [];
  let ORDERS = [];
  let FEES = [];
  let REVIEWS = [];
  let SENT = [];
  let ST_PT = 'all', ST_F = 'all', ST_Q = '', ST_UPD = 0, ST_TIMER = null, ST_FRESH = {};   // «Смена» сотрудника (этап 1)
  let STOOLS = null, ST_VIEW = 'orders', ST_TF = 'all', ST_TQ = '';                          // инструмент пунктов (этап 2)
  if (TAB === 'staff-tools'){ TAB = 'staff'; ST_VIEW = 'tools'; history.replaceState(null, '', location.pathname + location.search + '#staff'); }   // возврат из формы инструмента
  let STCHATS = null;                                                                        // сообщения пунктов (этап 3)
  let STAFF = null;          // этап D: сотрудник проката (iva_staff_me) — приглашение или работа
  let SPARTS = [];           // заявки пунктов сотрудника (iva_staff_parts)             // этап C: заявки, которые арендодатель сам отправил как арендатор («Я арендую»)
  let SUB_TAB = 'all';       // фильтр по статусу объявлений
  let SUB_TAB_ORD = 'all';   // фильтр по статусу заявок
  let LJ = null, LJ_OFF = false;   // «Выдал / Принял» на карточках владельца: part_id → журнал (SQL 20261118)
  let OQ = '', O_PT = 'all', O_UPD = 0, O_TIMER = null, O_FRESH = {};   // «Заявки» владельца: поиск, пункт, автообновление (24.10.2026)

  function niceDate(d){
    if (!d) return '—';
    const dt = new Date(String(d).replace(' ', 'T'));
    if (isNaN(dt.getTime())) return String(d);
    return dt.toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function copyToClipboard(text, msg){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast(msg || 'Скопировано');
      }).catch(function(){
        prompt('Скопируйте номер:', text);
      });
    } else {
      prompt('Скопируйте номер:', text);
    }
  }

  /* ---------- Куда вернуть после входа ----------
     ?next=chat.html?who=…&lend=1 — например, из «Написать владельцу». Только адрес этого сайта. */
  function nextUrl(){
    const n = new URLSearchParams(location.search).get('next') || '';
    return /^[a-z0-9_-]+\.html([?#][^\s]*)?$/i.test(n) ? n : '';
  }
  function afterLogin(){
    const n = nextUrl();
    if (n){ location.href = n; return; }
    boot();
  }

  /* ---------- Экран входа и регистрации ----------
     20.10.2026: регистрация клиента перенесена сюда (страница cabinet.html зависала на заставке);
     добавлено «Забыли пароль?». Регистрация даёт только аккаунт клиента — права арендодателя выдаёт
     владелец площадки после переписки (решение владельца 20.10.2026). */
  let AUTH_MODE = 'in';
  function screenLogin(msg){
    const up = AUTH_MODE === 'up';
    $('root').innerHTML =
      '<div class="auth-box">' +
        '<div class="auth-tabs" role="tablist">' +
          '<button type="button" role="tab" data-auth="in" aria-selected="' + (!up) + '" class="' + (up ? '' : 'on') + '">Вход</button>' +
          '<button type="button" role="tab" data-auth="up" aria-selected="' + up + '" class="' + (up ? 'on' : '') + '">Регистрация</button>' +
        '</div>' +
        '<p>' + (up ? 'Аккаунт клиента «Ивы»: заявки, избранное и сообщения в одном месте.'
                    : 'Личный кабинет площадки «Ива»') + '</p>' +
        '<div class="auth-err" id="aErr"></div>' +
        '<div class="auth-ok" id="aOk"></div>' +
        (up ? '<div class="fld"><label for="lName">Имя</label>' +
          '<input class="inp" id="lName" autocomplete="given-name" maxlength="60" placeholder="Иван"></div>' : '') +
        '<div class="fld"><label for="lEmail">Почта</label>' +
          '<input class="inp" id="lEmail" type="email" autocomplete="' + (up ? 'email' : 'username') + '" placeholder="you@mail.ru"></div>' +
        '<div class="fld"><label for="lPass">Пароль</label>' +
          '<input class="inp" id="lPass" type="password" autocomplete="' + (up ? 'new-password' : 'current-password') + '" placeholder="' + (up ? 'Не менее 6 символов' : '••••••••') + '"></div>' +
        (up ? '<div class="fld"><label for="lPass2">Повторите пароль</label>' +
          '<input class="inp" id="lPass2" type="password" autocomplete="new-password"></div>' +
          '<label class="auth-consent"><input type="checkbox" id="lAgree">' +
          '<span>Согласен на <a href="privacy.html" target="_blank" rel="noopener">обработку данных аккаунта</a> (имя и почта)</span></label>'
          : '<div class="auth-fgt"><button type="button" id="lForgot">Забыли пароль?</button></div>') +
        '<button class="btn wide" id="lGo">' + (up ? 'Создать аккаунт' : 'Войти') + '</button>' +
        '<p style="margin:16px 0 0;font-size:13px;text-align:center">' +
          (up ? 'Уже есть аккаунт? <a href="#" data-auth="in" style="color:var(--or)">Войти</a>'
              : 'Нет аккаунта? <a href="#" data-auth="up" style="color:var(--or)">Зарегистрироваться</a>') + '</p>' +
      '</div>';

    const go = $('lGo'), em = $('lEmail'), pw = $('lPass'), er = $('aErr'), ok = $('aOk');
    const say = function(t){ ok.classList.remove('show'); er.textContent = t; er.classList.add('show'); };
    const good = function(t){ er.classList.remove('show'); ok.textContent = t; ok.classList.add('show'); };
    if (msg) good(msg);

    $$('[data-auth]', $('root')).forEach(function(b){
      b.addEventListener('click', function(ev){
        ev.preventDefault();
        const keep = em.value;
        AUTH_MODE = b.getAttribute('data-auth');
        screenLogin();
        $('lEmail').value = keep;
      });
    });

    function addResend(){
      if (typeof resendConfirmEmail !== 'function' || $('resendBtn')) return;
      const rb = document.createElement('button');
      rb.id = 'resendBtn'; rb.className = 'btn wide sec'; rb.style.marginTop = '10px';
      rb.textContent = 'Отправить письмо ещё раз';
      rb.addEventListener('click', async function(){
        rb.disabled = true;
        try {
          await resendConfirmEmail(em.value.trim().toLowerCase(), confirmRedirect());
          good('Письмо отправлено — проверьте ящик и папку «Спам»');
        } catch(e2){ say(e2.message); }
        rb.disabled = false;
      });
      go.insertAdjacentElement('afterend', rb);
    }

    async function doLogin(){
      const e = em.value.trim().toLowerCase(), p = pw.value;
      if (!e || !p){ say('Введите почту и пароль'); return; }
      go.disabled = true; go.textContent = 'Входим…';
      try {
        await signIn(e, p);
        afterLogin();
      } catch(err){
        say(err.message);
        if (/не подтверждена|not confirmed/i.test(err.message || '')) addResend();
        go.disabled = false; go.textContent = 'Войти';
      }
    }

    async function doSignup(){
      const name = $('lName').value.trim(), e = em.value.trim().toLowerCase(), p = pw.value;
      if (!name){ say('Укажите имя'); return; }
      if (typeof IvaEmailGuard !== 'undefined'){ const bad = IvaEmailGuard.check(e); if (bad){ say(bad); return; } }
      if (p.length < 6){ say('Пароль — не короче 6 символов'); return; }
      if (p !== $('lPass2').value){ say('Пароли не совпадают'); return; }
      if (!$('lAgree').checked){ say('Нужно согласие на обработку данных аккаунта'); return; }
      go.disabled = true; go.textContent = 'Создаём…';
      try {
        const r = await fetch(SB + '/auth/v1/signup?redirect_to=' + encodeURIComponent(confirmRedirect()), {
          method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' },
          body: JSON.stringify({ email:e, password:p, data:{ name:name, full_name:name } })
        });
        const txt = await r.text();
        if (!r.ok){
          const m = sbErr(txt);
          if (/already registered|already been registered|exists/i.test(m)) throw new Error('Такой аккаунт уже есть — войдите или нажмите «Забыли пароль?»');
          if (/rate limit|too many/i.test(m)) throw new Error('Слишком много попыток. Подождите немного и повторите');
          if (/password/i.test(m)) throw new Error('Пароль не подходит: не короче 6 символов');
          throw new Error(m);
        }
        let j = {}; try { j = JSON.parse(txt); } catch(x){}
        const confirmed = j.access_token && j.user && (typeof IvaEmailGuard === 'undefined' || IvaEmailGuard.isConfirmed(j.user));
        if (confirmed){
          A.tok = j.access_token; A.rtok = j.refresh_token; A.me = ((j.user || {}).email || e).toLowerCase(); A.uname = name;
          applyAuthUser(j.user); saveSess(); await loadAdmin(); afterLogin(); return;
        }
        AUTH_MODE = 'in';
        screenLogin('Аккаунт создан. Мы отправили письмо на ' + e + ' — откройте ссылку из письма, затем войдите здесь.');
        $('lEmail').value = e;
      } catch(err){
        say(err.message);
        go.disabled = false; go.textContent = 'Создать аккаунт';
      }
    }

    const fg = $('lForgot');
    if (fg) fg.addEventListener('click', async function(){
      const e = em.value.trim().toLowerCase();
      if (typeof IvaEmailGuard !== 'undefined'){ const bad = IvaEmailGuard.check(e); if (bad){ say('Введите почту, на которую зарегистрирован аккаунт'); em.focus(); return; } }
      fg.disabled = true;
      try {
        const r = await fetch(SB + '/auth/v1/recover?redirect_to=' + encodeURIComponent(new URL('reset-password.html', location.href).href), {
          method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ email:e })
        });
        if (!r.ok && r.status !== 429) throw new Error(sbErr(await r.text()));
        if (r.status === 429) throw new Error('Письмо уже отправлено недавно. Подождите минуту и повторите');
        good('Если аккаунт с почтой ' + e + ' есть, мы отправили на неё ссылку для нового пароля. Проверьте и папку «Спам».');
      } catch(err){ say(err.message || 'Не удалось отправить письмо'); }
      fg.disabled = false;
    });

    go.addEventListener('click', AUTH_MODE === 'up' ? doSignup : doLogin);
    $$('input.inp', $('root')).forEach(function(i){
      i.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') go.click(); });
    });
  }
  /* Ссылка из письма подтверждения ведёт сюда же (и сохраняет ?next=) */
  function confirmRedirect(){ return new URL('account.html' + location.search, location.href).href; }

  /* ---------- Расчёт статистики по комиссии ---------- */
  function computeFeeStats(){
    const a = A.admin || {};
    const feePct = a.fee_pct != null ? a.fee_pct : 3;
    const debtLimit = Number(a.debt_limit) || 0;

    const closed = ORDERS.filter(function(p){ return p.status === 'closed'; });
    const feeAll = closed.reduce(function(acc, p){ return acc + (Number(p.fee) || 0); }, 0);
    const rentAll = closed.reduce(function(acc, p){ return acc + (Number(p.rent_sum) || 0); }, 0);

    const paidAll = FEES.filter(function(f){ return f.status === 'confirmed'; })
                        .reduce(function(acc, f){ return acc + (Number(f.amount) || 0); }, 0);
    const pendingPaid = FEES.filter(function(f){ return f.status === 'pending'; })
                            .reduce(function(acc, f){ return acc + (Number(f.amount) || 0); }, 0);

    const debt = Math.max(0, feeAll - paidAll);
    const isBlocked = debtLimit > 0 && debt > debtLimit;

    // Сводка по периодам
    const now = Date.now();
    const t0 = new Date(); t0.setHours(0,0,0,0); const d0 = t0.getTime();
    const w0 = now - 6 * 86400000;
    const m0 = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();

    function pTime(str){ return new Date(String(str).replace(' ', 'T')).getTime(); }

    const per = { d:[0,0,0], w:[0,0,0], mo:[0,0,0], a:[rentAll, feeAll, rentAll - feeAll] };
    closed.forEach(function(p){
      const t = pTime(p.created_at);
      const r = Number(p.rent_sum) || 0;
      const f = Number(p.fee) || 0;
      if (t >= d0){ per.d[0] += r; per.d[1] += f; per.d[2] += (r - f); }
      if (t >= w0){ per.w[0] += r; per.w[1] += f; per.w[2] += (r - f); }
      if (t >= m0){ per.mo[0] += r; per.mo[1] += f; per.mo[2] += (r - f); }
    });

    return {
      feePct: feePct,
      debtLimit: debtLimit,
      feeAll: feeAll,
      rentAll: rentAll,
      paidAll: paidAll,
      pendingPaid: pendingPaid,
      debt: debt,
      isBlocked: isBlocked,
      closedCount: closed.length,
      per: per
    };
  }

  /* ---------- Кабинеты, этап 1 (21.10.2026): заявки проката — как в приложении ----------
     Та же функция базы, что у приложения: iva_order_cards('admin') владельцу и ('staff') сотруднику (SQL 10.121–10.126).
     В карточке: ход заявки, пункт, инструменты со сроками и «чеком», таймер «осталось / просрочено» на каждый срок,
     «Вернули» по сроку (iva_staff_return), просьба клиента изменить заявку («Принять» / «Отклонить» — iva_order_edit_decide),
     причина отмены, «Позвонить» и «Написать» клиенту. Если функции в базе нет — остаётся прежняя простая карточка. */
  let LCARDS = null;         // владелец: part_id → { c: заявка, p: часть } или null
  let SCARDS = null;         // сотрудник: то же для его пунктов

  function lcMap(r){
    if (!Array.isArray(r)) return null;
    const m = {};
    r.forEach(function(x){
      const c = x && x.iva_order_cards ? x.iva_order_cards : x;
      const p = c && Array.isArray(c.parts) ? c.parts[0] : null;
      if (p && p.part_id != null) m[String(p.part_id)] = { c: c, p: p };
    });
    return m;
  }
  async function loadLordCards(){
    try { LCARDS = lcMap(await api('/rest/v1/rpc/iva_order_cards', 'POST', { p_scope: 'admin' })); }
    catch(e){ LCARDS = null; }
    await loadLordJournal();
  }
  /* 24.10.2026: кто выдал и кто принял — одним запросом по всем выданным и закрытым частям (iva_parts_journal, SQL 20261118).
     Пишет только база (триггер 10.107, возврат по срокам 10.124). Нет функции в базе — строк просто нет. */
  async function loadLordJournal(){
    if (LJ_OFF || !LCARDS) return;
    const ids = Object.keys(LCARDS).filter(function(id){
      const st = LCARDS[id].p.status || 'new';
      return /^\d+$/.test(id) && (st === 'rented' || st === 'closed');
    }).slice(0, 500).map(Number);
    if (!ids.length){ LJ = {}; return; }
    try {
      const r = await api('/rest/v1/rpc/iva_parts_journal', 'POST', { p_parts: ids });
      const m = {};
      (Array.isArray(r) ? r : []).forEach(function(x){ const j = x && x.iva_parts_journal ? x.iva_parts_journal : x; if (j && j.part_id != null) m[String(j.part_id)] = j; });
      LJ = m;
    } catch(e){
      if (/PGRST202|404|Could not find the function/i.test(String(e && e.message || ''))) LJ_OFF = true;
    }
  }
  /* строка журнала: «Выдал: Иван · 24 окт., 14:05» */
  function ljLine(lb, who, at, tz){
    if (!who) return '';
    const t = Date.parse(at || '');
    return '<div class="hint lc-who">' + lb + ': <b style="color:var(--tx)">' + esc(who) + '</b>' + (t ? ' · ' + esc(coWhen(t, tz)) : '') + '</div>';
  }

  /* сроки выданной части: { дни: конец срока } — только у ещё не возвращённых инструментов */
  function lcTerms(k){
    const c = k.c, p = k.p, items = Array.isArray(p.items) ? p.items : [], out = {};
    if ((p.status || 'new') !== 'rented' || !p.rented_at) return out;
    const tz = p.tz || 'Europe/Moscow';
    items.forEach(function(it){
      if (it.returned_at) return;
      const d = coDays(it, c.days);
      if (!out[d]) out[d] = coRentEnd(p.rented_at, d, p.rent_mode, p.close_min, tz);
    });
    if (!items.length){ const d = coDays({}, c.days); out[d] = coRentEnd(p.rented_at, d, p.rent_mode, p.close_min, tz); }
    return out;
  }
  function lcLate(k){
    const t = lcTerms(k), now = Date.now();
    return Object.keys(t).some(function(d){ return t[d] && t[d] < now; });
  }
  function lcDaysTxt(d){ d = parseInt(d, 10) || 0; return d > 0 ? d + ' ' + plural(d, 'сутки', 'суток', 'суток') : 'срок заявки'; }
  /* что клиент просит изменить — как в приложении (IvaOrderEditPatch.diff) */
  function lcDiff(b, a){
    const out = [];
    if (!b || !a) return out;
    const bi = Array.isArray(b.items) ? b.items : [], ai = Array.isArray(a.items) ? a.items : [];
    bi.forEach(function(x){
      const y = ai.find(function(z){ return String(z.id || '') === String(x.id || ''); });
      const n = x.name || 'Инструмент';
      if (!y) out.push('Убрать: ' + n);
      else if ((parseInt(x.days, 10) || 0) !== (parseInt(y.days, 10) || 0)) out.push(n + ': ' + lcDaysTxt(x.days) + ' → ' + lcDaysTxt(y.days));
    });
    if ((b.get_method || '') !== (a.get_method || '')) out.push('Получение: ' + (b.get_method || '—') + ' → ' + (a.get_method || '—'));
    if ((b.comment || '') !== (a.comment || '')) out.push('Комментарий: ' + (a.comment ? '«' + a.comment + '»' : 'убрать'));
    return out;
  }

  /* row — строка order_parts (владелец) или iva_staff_parts (сотрудник); k — { c, p } из iva_order_cards */
  function lcCardHTML(row, k, staff){
    const c = k.c, p = k.p;
    const st = p.status || row.status || 'new';
    const isArc = !staff && !!row.archived;
    const tz = p.tz || 'Europe/Moscow';
    const items = Array.isArray(p.items) ? p.items : [];
    const terms = lcTerms(k), tKeys = Object.keys(terms).map(Number).sort(function(a, b){ return a - b; });
    const now = Date.now();
    const late = tKeys.some(function(d){ return terms[d] && terms[d] < now; });
    const tint = st === 'cancelled' || st === 'closed' || isArc ? 'off' : (late ? 'late' : st);
    const badge = st === 'new' ? 'Новая заявка' : st === 'rented' ? (late ? 'Просрочена' : 'В аренде') : st === 'cancelled' ? 'Отменена клиентом' : 'Завершена';
    const bcls = st === 'rented' && late ? 'b-cancelled' : 'b-' + st;
    const canAct = staff ? !!row.can_act : !isArc;
    const pid = esc(p.part_id);
    const jr = !staff && LJ ? LJ[String(p.part_id)] || null : null;      // кто выдал / кто принял — только владельцу
    const jItems = {}, jWhos = {};
    if (jr && Array.isArray(jr.items)) jr.items.forEach(function(x){ if (x && x.n != null){ jItems[x.n] = x; if (x.returned_who) jWhos[x.returned_who + '|' + x.returned_at] = 1; } });
    const jPerItem = Object.keys(jWhos).length > 1;   // принимали по частям — «принял …» у каждого инструмента

    /* сроки: таймер у каждого; «Вернули» по сроку, когда сроков несколько */
    let termsHTML = '';
    tKeys.forEach(function(d){
      const end = terms[d];
      if (!end) return;
      const names = items.filter(function(it){ return !it.returned_at && coDays(it, c.days) === d; }).map(function(it){ return it.name || 'Инструмент'; }).join(', ');
      termsHTML += '<div class="co-term lc-term' + (end < now ? ' late' : '') + '"><div>' +

  async function lcReload(){
    if (isAdmin()){

  /* ---------- «Всё по порядку», пункт 4 (24.10.2026): «Заявки» владельца — как «Смена» сотрудника ----------
     Плитки-фильтры (Новые / Просрочены / Вернуть сегодня / В аренде), группы: «Клиент просит изменить» → «Просрочены» → «Новые» →
     «В аренде» (ближайший возврат сверху) → «Завершены» → «Отменены»; поиск по №, клиенту, телефону, инструменту, пункту;
     выбор пункта (когда пунктов больше одного); автообновление раз в 30 секунд, новая заявка подсвечивается и всплывает сообщение.
     Данные — те же order_parts + iva_order_cards('admin'); новых запросов к базе нет. Без iva_order_cards — прежние простые карточки. */
  const O_GROUPS = [
    ['change', 'Клиент просит изменить'], ['late', 'Просрочены'], ['new', 'Новые'], ['rented', 'В аренде'],
    ['closed', 'Завершены'], ['cancelled', 'Отменены клиентом'], ['archived', 'Архив']
  ];
  const O_FN = { new: 'Новые', late: 'Просрочены', today: 'Вернуть сегодня', rented: 'В аренде', change: 'Ждут решения',
                 closed: 'Завершены', cancelled: 'Отменены', archived: 'Архив' };
  function oCard(p){ return LCARDS ? LCARDS[String(p.id)] || null : null; }
  function oInfo(p){
    const st = p.status || 'new', k = oCard(p), arc = !!p.archived;
    let end = 0;
    if (!arc && st === 'rented' && k){ const t = lcTerms(k); Object.keys(t).forEach(function(d){ if (t[d] && (!end || t[d] < end)) end = t[d]; }); }
    const now = Date.now(), t1 = new Date(); t1.setHours(23, 59, 59, 999);
    const late = !!end && end < now;
    const change = !arc && !!(k && k.p.change && k.p.change.state === 'pending');
    return { st: st, arc: arc, end: end, late: late, today: !!end && !late && end <= t1.getTime(), change: change,
             g: arc ? 'archived' : change ? 'change' : late ? 'late' : st };
  }
  function oPts(){
    const m = {}, out = [];
    ORDERS.forEach(function(p){
      const k = oCard(p), pt = k && k.p.point;
      if (pt && pt.id != null && !m[pt.id]){ m[pt.id] = 1; out.push({ id: String(pt.id), name: pt.name || 'Пункт' }); }
    });
    return out;
  }
  function oScope(){
    if (O_PT === 'all') return ORDERS;
    return ORDERS.filter(function(p){ const k = oCard(p); return !!(k && k.p.point && String(k.p.point.id) === O_PT); });
  }
  function oCounts(list){
    const c = { new: 0, late: 0, today: 0, rented: 0, change: 0, closed: 0, cancelled: 0, archived: 0, all: 0 };
    list.forEach(function(p){
      const i = oInfo(p);
      if (i.arc){ c.archived++; return; }
      c.all++;
      if (i.st === 'new') c.new++;
      if (i.st === 'rented') c.rented++;
      if (i.st === 'closed') c.closed++;
      if (i.st === 'cancelled') c.cancelled++;
      if (i.late) c.late++;
      if (i.today) c.today++;
      if (i.change) c.change++;
    });
    return c;
  }
  function oKpisHTML(){
    const c = oCounts(oScope()), F = SUB_TAB_ORD || 'all';
    const k = function(f, cls, lb, n, sub){
      return '<button type="button" class="kpi home-kpi st-k ' + cls + (n ? ' has' : '') + (F === f ? ' on' : '') + '" data-ord-f="' + f + '" aria-pressed="' + (F === f) + '">' +
        '<div class="lb">' + lb + '</div><div class="vl">' + n + '</div><div class="sub">' + sub + '</div></button>';
    };
    return k('new', 'k-new', 'Новые', c.new, 'ждут выдачи') +
      k('late', 'k-late', 'Просрочены', c.late, c.late ? 'свяжитесь с клиентом' : 'всё в срок') +
      k('today', 'k-today', 'Вернуть сегодня', c.today, 'срок до конца дня') +
      k('rented', 'k-rented', 'В аренде', c.rented, 'выдано сейчас');
  }
  function oChipsHTML(){
    const c = oCounts(oScope()), F = SUB_TAB_ORD || 'all';
    return [['all', 'Все'], ['change', 'Ждут решения'], ['closed', 'Завершены'], ['cancelled', 'Отменены'], ['archived', 'Архив']]
      .filter(function(x){ return x[0] !== 'change' || c.change || F === 'change'; })
      .map(function(x){
        const on = F === x[0];
        return '<button class="chip' + (on ? ' on' : '') + '" data-ost="' + x[0] + '" aria-pressed="' + on + '"' +
          (on ? ' style="border-color:var(--or);color:var(--or)"' : '') + '>' + x[1] + ' · ' + c[x[0]] + '</button>';
      }).join('');
  }
  function oText(p){
    const k = oCard(p), o = p.orders || {}, c = k ? k.c : {}, pp = k ? k.p : {};
    const items = Array.isArray(pp.items) ? pp.items.map(function(it){ return it.name || ''; }).join(' ') : '';
    const tel = [o.phone, c.client_tel].join(' ');
    const j = LJ && LJ[String(p.id)], jw = j ? [j.issued_who, j.returned_who].concat((j.items || []).map(function(x){ return x.returned_who; })).join(' ') : '';
    return [p.order_id, o.name, c.client_name, tel, tel.replace(/\D/g, ''), p.tools_text, items, pp.point && pp.point.name, o.address, c.address, jw]
      .join(' ').toLowerCase();
  }
  function oListHTML(){
    const F = SUB_TAB_ORD || 'all';
    const q = OQ.trim().toLowerCase().replace(/^№\s*/, '');
    const pass = function(i){
      if (F === 'archived') return i.arc;
      if (i.arc) return false;
      if (F === 'all') return true;
      if (F === 'late') return i.late;
      if (F === 'today') return i.today;
      if (F === 'change') return i.change;
      return i.st === F;
    };
    const list = oScope().filter(function(p){ return pass(oInfo(p)) && (!q || oText(p).indexOf(q) >= 0); });
    let h = '';
    O_GROUPS.forEach(function(g){
      const rows = list.filter(function(p){ return oInfo(p).g === g[0]; });
      if (!rows.length) return;
      rows.sort(function(a, b){
        const ea = oInfo(a).end, eb = oInfo(b).end;
        return (ea && eb ? ea - eb : 0) || (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0);
      });
      h += '<div class="st-g st-g-' + g[0] + '">' + g[1] + ' · ' + rows.length + '</div>' +
        rows.map(function(p){
          const fr = O_FRESH[p.id] && Date.now() - O_FRESH[p.id] < 120000;
          const k = oCard(p);
          return '<div class="st-wrap' + (fr ? ' st-fresh' : '') + '">' + (k ? lcCardHTML(p, k, false) : oPlainCardHTML(p)) + '</div>';
        }).join('');
    });
    if (h) return h;
    if (!ORDERS.length){
      return '<div class="empty">' +
        '<svg viewBox="0 0 24 24"><path d="M7 4h-2l-1 2H2v13a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6h-2l-1-2h-2l1 2H6zM5 8h14v11H5zm4 2h6v2H9z"/></svg>' +
        '<b>Заявок пока нет</b><p>Когда клиенты оформят заявку на ваш инструмент, она появится здесь — страница обновляется сама.</p></div>';
    }
    return '<div class="empty"><b>Ничего не найдено</b><p>' + (q ? 'Измените строку поиска' : 'По этому фильтру заявок нет') + '.</p>' +
      '<button type="button" class="btn sec sm" data-ord-f="all" data-ord-clear="1">Показать все заявки</button></div>';
  }
  function oUpdTxt(){
    return (O_UPD ? 'Обновлено ' + stWhen(O_UPD).replace(/^сегодня /, '') + ' · ' : '') + 'обновляется само каждые 30 секунд';
  }
  function oUpdLine(){
    const F = SUB_TAB_ORD || 'all';
    return '<span id="ordUpd">' + oUpdTxt() + '</span>' +
      (F !== 'all' ? ' · фильтр «' + (O_FN[F] || F) + '» — <button type="button" class="st-link" data-ord-f="all">показать все</button>' : '');

  function oPtsHTML(pts){
    return [{ id: 'all', name: 'Все пункты' }].concat(pts).map(function(x){
      const on = O_PT === x.id;
      const n = ORDERS.filter(function(p){ const i = oInfo(p), k = oCard(p);

  /* обновить плитки, фильтры и список, не трогая поле поиска */

  async function oReload(){
    const r = await Promise.allSettled([loadMyOrderParts(), loadLordCards()]);
    if (r[0].status !== 'fulfilled') throw r[0].reason;
    const seen = {}; ORDERS.forEach(function(p){ seen[p.id] = 1; });
    const had = ORDERS.length > 0 || O_UPD > 0;
    ORDERS = r[0].value || [];
    O_UPD = Date.now();
    const fresh = had ? ORDERS.filter(function(p){ return !seen[p.id] && (p.status || 'new') === 'new' && !p.archived; }) : [];
    fresh.forEach(function(p){ O_FRESH[p.id] = Date.now(); });
    return fresh;
  }

    return JSON.stringify(ORDERS.map(function(p){
      const k = oCard(p);
      return [p.id, p.status, !!p.archived, k ? [k.p.rented_at || '', k.p.change ? k.p.change.state : '', k.p.cancel ? 1 : 0,
        (k.p.items || []).map(function(it){ return it.returned_at ? 1 : 0; }).join('')] : 0];

  /* автообновление раз в 30 секунд, пока открыты «Заявки» и вкладка браузера видна; таймеры «осталось» тикают отдельно */
  function oAuto(){
    if (O_TIMER) return;
    O_TIMER = setInterval(async function(){
      if (TAB !== 'orders' || !isAdmin() || document.hidden || $('sheet') || document.querySelector('#ordList button:disabled')) return;
      const s0 = oSig();
      let fresh;
      try { fresh = await oReload(); } catch(e){ return; }

      if (fresh.length) toast(fresh.length === 1 ? 'Новая заявка: ' + (fresh[0].tools_text || '') : 'Новых заявок: ' + fresh.length);
      if (oSig() !== s0) oRepaint(); else { const u = $('ordUpd'); if (u) u.textContent = oUpdTxt(); }
    }, 30000);
  }

  /* простая карточка — когда в базе ещё нет iva_order_cards */

  /* ---------- Этап F сайта (20.10.2026): заявки клиента — как в приложении ----------
     Одна функция базы iva_order_cards('client') (та же, что у приложения): прокат, пункт с телефоном, инструменты со сроками,
     время выдачи, причина отмены, ожидающее изменение. Если функции в базе ещё нет — остаётся прежний простой список.
     Отмена — iva_order_cancel (пока ничего не выдано, с причиной, без комиссии); вопрос «Вы взяли инструмент?» — iva_order_followups. */
  let CCARDS = null;         // карточки заявок клиента (iva_order_cards) или null — тогда прежний список
  let CFOLLOW = [];          // вопросы «Вы в итоге взяли инструмент?»
  let CO_F = '';             // фильтр: active | done | cancelled | all
  const CO_REASONS = ['Передумал(а)', 'Нашёл(ла) в другом месте', 'Изменились планы', 'Ошибся(лась) в заявке'];

  async function loadClientCards(){
    try {
      const r = await api('/rest/v1/rpc/iva_order_cards', 'POST', { p_scope: 'client' });
      CCARDS = Array.isArray(r) ? r.map(function(x){ return x && x.iva_order_cards ? x.iva_order_cards : x; }).filter(Boolean) : null;
    } catch(e){ CCARDS = null; }
    try {
      const f = await api('/rest/v1/rpc/iva_order_followups', 'POST', {});
      CFOLLOW = Array.isArray(f) ? f : [];
    } catch(e){ CFOLLOW = []; }
  }

  /* часовой пояс проката → время */
  function coParts(ms, tz){
    const o = {};
    try {
      new Intl.DateTimeFormat('en-CA', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
        .formatToParts(new Date(ms)).forEach(function(p){ o[p.type] = Number(p.value); });
    } catch(e){ const d = new Date(ms); return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(), hour: d.getHours(), minute: d.getMinutes() }; }
    return o;
  }
  function coZoned(y, m, d, min, tz){
    const guess = Date.UTC(y, m - 1, d, 0, min);
    const p = coParts(guess, tz);
    return guess - (Date.UTC(p.year, p.month - 1, p.day, p.hour % 24, p.minute) - guess);
  }
  /* то же правило, что iva_rent_end в базе: «сутки» — выдача + N × 24 ч; «до закрытия пункта» — закрытие N-го дня (выходные пропускаются) */
  function coRentEnd(at, days, mode, close, tz){
    const t = Date.parse(at);
    if (!t || !(days > 0)) return 0;
    const ok = mode === 'close' && Array.isArray(close) && close.length === 7 && close.some(function(c){ return c != null && c >= 0; });
    if (!ok) return t + days * 864e5;
    const p = coParts(t, tz);
    const base = Date.UTC(p.year, p.month - 1, p.day) + days * 864e5;
    for (let i = 0; i < 7; i++){
      const dt = new Date(base + i * 864e5);
      const m = close[(dt.getUTCDay() || 7) - 1];
      if (m != null && m >= 0) return coZoned(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate(), m, tz);
    }
    return t + days * 864e5;
  }
  function coWhen(ms, tz){
    try { return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: tz || 'Europe/Moscow' }); }
    catch(e){ return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  }
  function coSpan(ms){
    const m = Math.max(1, Math.round(Math.abs(ms) / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
    if (d) return d + ' д' + (h ? ' ' + h + ' ч' : '');
    if (h) return h + ' ч' + (mi ? ' ' + mi + ' мин' : '');
    return mi + ' мин';
  }
  function coTimer(end){
    const left = end - Date.now();
    return left > 0 ? 'осталось ' + coSpan(left) : 'просрочено на ' + coSpan(left);
  }
  function coDays(it, orderDays){
    const d = parseInt(it && it.days, 10);
    if (d >= 1) return Math.min(365, d);
    return Math.max(1, Math.min(365, parseInt(orderDays, 10) || 1));
  }
  function coOrderStatus(c){
    const ps = (c.parts || []).map(function(p){ return p.status || 'new'; });
    if (!ps.length) return 'new';
    if (ps.every(function(x){ return x === 'cancelled'; })) return 'cancelled';
    if (ps.some(function(x){ return x === 'rented'; })) return 'rented';
    if (ps.some(function(x){ return x === 'new'; })) return 'new';
    return 'closed';
  }
  function coOwnerMap(rows){
    const m = {};
    (rows || []).forEach(function(o){ (o.order_parts || []).forEach(function(p){ if (p && p.id != null && p.owner_email) m[String(p.id)] = p.owner_email; }); });
    return m;
  }
  function coSteps(st){
    const n = st === 'new' ? 1 : st === 'rented' ? 2 : 3;
    return '<div class="co-steps" aria-label="Ход заявки">' +
      ['Отправлена', 'Выдана', 'Возвращена'].map(function(t, i){
        return '<span class="co-step' + (i < n ? ' on' : '') + (i === n - 1 && st !== 'closed' ? ' cur' : '') + '"><i></i>' + t + '</span>';
      }).join('') + '</div>';
  }

  function coPartHTML(c, p, owners){
    const st = p.status || 'new';
    const items = Array.isArray(p.items) ? p.items : [];
    const tz = p.tz || 'Europe/Moscow';
    let late = false;
    /* сроки (у разных инструментов может быть свой) — у выданной части таймер на каждый срок */
    const terms = {};
    items.forEach(function(it){ if (!it.returned_at){ const d = coDays(it, c.days); terms[d] = true; } });
    let termsHTML = '';
    if (st === 'rented' && p.rented_at){
      Object.keys(terms).map(Number).sort(function(a, b){ return a - b; }).forEach(function(d){
        const end = coRentEnd(p.rented_at, d, p.rent_mode, p.close_min, tz);
        if (!end) return;
        if (end < Date.now()) late = true;
        termsHTML += '<div class="co-term' + (end < Date.now() ? ' late' : '') + '">' +
          (Object.keys(terms).length > 1 ? '<b>' + d + ' ' + plural(d, 'сутки', 'суток', 'суток') + ':</b> ' : '') +
          'вернуть до <b>' + esc(coWhen(end, tz)) + '</b> · <span data-co-end="' + end + '">' + coTimer(end) + '</span></div>';
      });
      if (!items.length){
        const d = coDays({}, c.days), end = coRentEnd(p.rented_at, d, p.rent_mode, p.close_min, tz);
        if (end){ if (end < Date.now()) late = true;
          termsHTML += '<div class="co-term' + (end < Date.now() ? ' late' : '') + '">вернуть до <b>' + esc(coWhen(end, tz)) + '</b> · <span data-co-end="' + end + '">' + coTimer(end) + '</span></div>'; }
      }
    }
    const tint = st === 'cancelled' || st === 'closed' ? 'off' : (late ? 'late' : st);
    const badge = st === 'new' ? 'На рассмотрении' : st === 'rented' ? (late ? 'Просрочена' : 'В аренде') : st === 'cancelled' ? 'Отменена' : 'Завершена';
    const bcls = st === 'rented' && late ? 'b-cancelled' : 'b-' + st;

    /* инструменты и «чек»: цена × сутки; после возврата — начатые сутки (считает база) */
    let sum = 0, dep = 0, fact = false;
    const list = items.map(function(it){
      const price = Number(it.price) || 0, plan = coDays(it, c.days);
      const used = parseInt(it.used_days, 10) >= 1 ? parseInt(it.used_days, 10) : 0;
      const d = used || plan;
      if (used) fact = true;
      sum += price * d; dep += Number(it.deposit) || 0;
      const img = /^https:\/\//.test(it.img || '') ? '<img src="' + esc(it.img) + '" alt="" loading="lazy">' : '<span class="co-noimg"></span>';
      const name = esc(it.name || 'Инструмент');
      return '<div class="co-item">' + img + '<div class="co-item-t">' +
        (it.id ? '<a href="tool.html?id=' + encodeURIComponent(it.id) + '">' + name + '</a>' : '<b>' + name + '</b>') +
        '<span>' + (price ? rub(price) + ' × ' : '') + d + ' ' + plural(d, 'сутки', 'суток', 'суток') + (used && used !== plan ? ' (по факту, было ' + plan + ')' : '') +
        (price ? ' = <b>' + rub(price * d) + '</b>' : '') + '</span>' +
        (it.returned_at && st === 'rented' ? '<span class="co-ok">возвращён ' + esc(coWhen(Date.parse(it.returned_at), tz)) + '</span>' : '') +
        '</div></div>';
    }).join('');

    const pt = p.point || null;
    const tel = (pt && pt.tel) || p.prokat_tel || '';
    const addr = pt ? [pt.city, pt.address].filter(Boolean).join(', ') : (p.prokat_addr || '');
    const owner = owners[String(p.part_id)] || '';
    const firstTool = items.length && items[0].id ? '&tool=' + encodeURIComponent(items[0].id) : '';

    let acts = '';
    if (st !== 'cancelled'){
      if (tel) acts += '<a class="btn sm sec" href="tel:' + esc(String(tel).replace(/[^\d+]/g, '')) + '">Позвонить</a>';
      if (owner) acts += '<a class="btn sm sec" href="chat.html?who=' + encodeURIComponent(owner) + firstTool + '">Написать</a>';
      if (addr && st !== 'closed') acts += '<a class="btn sm sec" target="_blank" rel="noopener noreferrer" href="https://yandex.ru/maps/?text=' + encodeURIComponent(addr) + '">Как добраться ↗</a>';
    }

    const ch = p.change || null, cn = p.cancel || null;
    return '<div class="co-part t-' + tint + '">' +
      '<div class="co-part-h"><b>' + esc(p.company || 'Прокат') + '</b><span class="badge ' + bcls + '">' + badge + '</span></div>' +
      (st !== 'cancelled' ? coSteps(st) : '') +
      (addr ? '<div class="hint">' + (pt && pt.name ? esc(pt.name) + ' — ' : 'Адрес: ') + esc(addr) + (p.work_hours ? ' · ' + esc(p.work_hours) : '') + '</div>' : '') +
      (st === 'rented' && p.rented_at ? '<div class="hint">Выдан ' + esc(coWhen(Date.parse(p.rented_at), tz)) + '</div>' : '') +
      termsHTML +
      (list ? '<div class="co-items">' + list + '</div>' : (p.tools_text ? '<div class="hint">' + esc(p.tools_text) + '</div>' : '')) +
      (sum && st !== 'cancelled' ? '<div class="co-sum"><span>' + (st === 'closed' ? 'Итого за аренду' : 'Аренда по заявке') + '</span><b>' + rub(sum) + '</b></div>' : '') +
      (dep && st !== 'closed' && st !== 'cancelled' ? '<div class="co-sum sm"><span>Залог (вернут после возврата инструмента)</span><b>' + rub(dep) + '</b></div>' : '') +
      (sum && st === 'rented' ? '<div class="hint">Итог считает прокат при возврате: начатые сутки от выдачи (час запаса).</div>' : '') +
      (fact && st === 'closed' ? '<div class="hint">Посчитано по факту: начатые сутки от выдачи до возврата.</div>' : '') +
      (ch && ch.state === 'pending' ? '<div class="co-note">Вы попросили изменить заявку — ждём ответа проката.</div>' : '') +
      (ch && (ch.state === 'accepted' || ch.state === 'approved') ? '<div class="co-note ok">Прокат принял изменение заявки.</div>' : '') +
      (ch && ch.state === 'rejected' ? '<div class="co-note">Прокат не принял изменение — действует прежняя заявка.</div>' : '') +
      (st === 'cancelled' && cn && cn.reason ? '<div class="hint">Причина отмены: ' + esc(cn.reason) + '</div>' : '') +
      (acts ? '<div class="acts">' + acts + '</div>' : '') +
    '</div>';
  }

  function coCardHTML(c, owners){
    const parts = c.parts || [];
    const st = coOrderStatus(c);
    const canCancel = parts.some(function(p){ return (p.status || 'new') === 'new'; }) &&
                      !parts.some(function(p){ return p.status === 'rented' || p.status === 'closed'; });
    return '<div class="order-card co-card">' +
      '<div class="top"><b>Заявка №' + esc(c.order_id) + '</b><span class="small muted">' + niceDate(c.created_at) + '</span></div>' +
      (parts.length ? parts.map(function(p){ return coPartHTML(c, p, owners); }).join('')
                    : '<div class="title">' + esc(c.tools || 'Инструмент') + '</div>') +
      (c.get_method ? '<div class="hint">Получение: ' + esc(c.get_method) + '</div>' : '') +
      (c.comment ? '<details class="co-more"><summary>Подробности заявки</summary><div>' + esc(c.comment) + '</div></details>' : '') +
      (canCancel ? '<div class="acts"><button class="btn sm sec co-cancel" data-co-cancel="' + esc(c.order_id) + '">Отменить заявку</button>' +
        '<span class="small muted">Изменить состав или срок — в приложении или напишите в прокат</span></div>' : '') +
      (st === 'closed' && parts.some(function(p){ return (p.items || []).length; }) ? '<div class="small muted" style="margin-top:8px">Оцените инструмент — откройте его карточку и оставьте отзыв.</div>' : '') +
    '</div>';
  }

  function coFollowHTML(){
    return CFOLLOW.map(function(f){
      return '<div class="box co-follow">' +
        '<b>Вы в итоге взяли инструмент?</b>' +
        '<p class="small muted">Вы отменили заявку №' + esc(f.order_id) + (f.company ? ' в прокате «' + esc(f.company) + '»' : '') + (f.tools_text ? ' (' + esc(f.tools_text) + ')' : '') + '.</p>' +
        '<div class="acts"><button class="btn sm" data-co-follow="took" data-id="' + esc(f.id) + '">Да, взял(а)</button>' +
        '<button class="btn sm sec" data-co-follow="not" data-id="' + esc(f.id) + '">Нет</button>' +
        '<button class="btn sm sec" data-co-follow="later" data-id="' + esc(f.id) + '">Спросить позже</button></div>' +
      '</div>';
    }).join('');
  }

  function viewClientCards(rows){
    const owners = coOwnerMap(rows);
    const all = CCARDS || [];
    const grp = function(c){ const s = coOrderStatus(c); return s === 'new' || s === 'rented' ? 'active' : s === 'cancelled' ? 'cancelled' : 'done'; };
    const cnt = { all: all.length, active: 0, done: 0, cancelled: 0 };
    all.forEach(function(c){ cnt[grp(c)]++; });
    if (!CO_F) CO_F = cnt.active ? 'active' : 'all';
    const list = CO_F === 'all' ? all : all.filter(function(c){ return grp(c) === CO_F; });
    let h = coFollowHTML();
    h += '<div class="chips" style="margin-bottom:14px">' +
      [['active', 'Активные'], ['done', 'Завершённые'], ['cancelled', 'Отменённые'], ['all', 'Все']].map(function(x){
        return '<button class="chip' + (CO_F === x[0] ? ' on' : '') + '" data-co-f="' + x[0] + '"' +
          (CO_F === x[0] ? ' style="border-color:var(--or);color:var(--or)"' : '') + '>' + x[1] + ' · ' + cnt[x[0]] + '</button>';
      }).join('') + '</div>';
    if (!list.length){
      return h + '<div class="empty"><b>' + (all.length ? 'Здесь пусто' : 'Заявок пока нет') + '</b>' +
        '<p>' + (all.length ? 'Переключитесь на другую вкладку.' : 'Выберите подходящий инструмент в каталоге и нажмите «Оформить заявку».') + '</p>' +
        '<a class="btn" href="catalog.html">Перейти в каталог</a></div>';
    }
    return h + list.map(function(c){ return coCardHTML(c, owners); }).join('');
  }

  /* таймеры «осталось / просрочено» обновляются раз в минуту без перерисовки страницы */
  setInterval(function(){
    document.querySelectorAll('[data-co-end]').forEach(function(el){
      const end = Number(el.getAttribute('data-co-end'));
      if (end) el.textContent = coTimer(end);
    });
  }, 60000);

  function coCancel(orderId){
    openSheet('Отмена заявки №' + esc(orderId),
      '<p class="small muted" style="line-height:1.6;margin-bottom:10px">Отменить можно, пока инструмент не выдан. Комиссия с проката не берётся.</p>' +
      '<label class="small" style="display:block;margin-bottom:8px">Почему отменяете? Прокат увидит причину</label>' +
      '<div class="chips" style="margin-bottom:10px">' + CO_REASONS.map(function(r){ return '<button class="chip" type="button" data-co-why="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') + '</div>' +
      '<textarea id="coWhy" class="inp" rows="3" maxlength="300" placeholder="Причина" style="width:100%"></textarea>' +
      '<p class="small muted" style="margin-top:8px">Через пару дней спросим, взяли ли вы всё же инструмент в этом прокате.</p>' +
      '<p class="small" id="coErr" style="color:var(--red);display:none;margin-top:8px"></p>',
      '<button class="btn sec" id="coNo" style="flex:1">Не отменять</button>' +
      '<button class="btn" id="coYes" style="flex:1">Отменить</button>');
    document.querySelectorAll('[data-co-why]').forEach(function(b){
      b.addEventListener('click', function(){ $('coWhy').value = b.getAttribute('data-co-why'); $('coWhy').focus(); });
    });
    $('coNo').addEventListener('click', function(){ closeSheet(); });
    $('coYes').addEventListener('click', async function(){
      const why = ($('coWhy').value || '').replace(/\s+/g, ' ').trim();
      const err = $('coErr');
      if (why.length < 2){ err.textContent = 'Укажите причину отмены'; err.style.display = 'block'; return; }
      const btn = this; btn.disabled = true; btn.textContent = 'Отменяем…';
      try {
        await api('/rest/v1/rpc/iva_order_cancel', 'POST', { p_order: Number(orderId), p_reason: why });
        closeSheet();
        toast('Заявка отменена. Прокат увидит причину');
        await coReload();
      } catch(e){
        btn.disabled = false; btn.textContent = 'Отменить';
        const msg = String(e && e.message || '');
        err.textContent = /iva_order_cancel|PGRST202|Could not find|schema cache/i.test(msg)

    const sum = pub.reduce(function(acc, r){ return acc + (Number(r.rating) || 0); }, 0);

    const dist = [5, 4, 3, 2, 1].map(function(n){ return [n, pub.filter(function(r){ return Number(r.rating) === n; }).length]; });
    const maxN = Math.max.apply(null, dist.map(function(d){ return d[1]; }).concat([1]));
    const isLow = function(r){ return (Number(r.rating) || 0) <= 3; };
    const hasText = function(r){ return !!String(r.text || '').trim(); };
    const cnt = { all: REVIEWS.length, low: REVIEWS.filter(isLow).length, text: REVIEWS.filter(hasText).length };
    if (!cnt[RV_F]) RV_F = 'all';
    const shown = RV_F === 'low' ? REVIEWS.filter(isLow) : RV_F === 'text' ? REVIEWS.filter(hasText) : REVIEWS;
    const chips = '<div class="chips" style="margin-bottom:4px">' +
      [['all', 'Все'], ['low', 'Оценка 1–3'], ['text', 'С текстом']].map(function(x){
        return '<button class="chip' + (RV_F === x[0] ? ' on' : '') + '" data-rv-f="' + x[0] + '"' +
          (RV_F === x[0] ? ' style="border-color:var(--or);color:var(--or)"' : '') + '>' + x[1] + ' · ' + cnt[x[0]] + '</button>';

        '</div>' +
      '</div>' +
      '<div class="rv-dist">' + dist.map(function(d){
        return '<div class="rv-row"><span>' + d[0] + ' ★</span><span class="rv-bar"><i style="width:' + Math.round(d[1] / maxN * 100) + '%"></i></span><span>' + d[1] + '</span></div>';
      }).join('') + '</div>' +
    '</div>' + chips +
    '<div class="review-list">' + shown.map(function(r){
      const isHidden = r.status === 'hidden';
      const toolTitle = (r.tools && r.tools.name) || 'Инструмент';

              '<span class="review-stars">' + '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) + '</span>' +
              '<span class="muted" style="font-size:13px">· ' + esc(r.author_name || 'Арендатор') + '</span>' +

  /* ---------- Сотрудник проката на сайте (этап D, 20.10.2026) ----------
     Как в приложении (IvaStaffPatch / IvaStaffOrdersPatch) и теми же функциями базы:
       iva_staff_me — приглашение или работа; iva_staff_answer — «Принять» / «Отказаться»;
       iva_staff_parts — заявки ТОЛЬКО своих пунктов (без денег и почты клиента);
       iva_staff_set_status — «Выдал» / «Вернули» (право «Выдача», свой пункт, new → rented → closed).
     Без SQL сотрудников (20261028/1029) функции не найдутся — вкладка просто не появится. */
  async function loadStaff(){
    STAFF = null; SPARTS = []; SCARDS = null; STOOLS = null; STCHATS = null;
    try {
      const r = await api('/rest/v1/rpc/iva_staff_me', 'POST', {});
      STAFF = (Array.isArray(r) ? r[0] : r) || null;
    } catch(e){ STAFF = null; }
    try { if (STAFF) localStorage.setItem('iva_staff_hint', '1'); else localStorage.removeItem('iva_staff_hint'); } catch(e){}
    if (STAFF && STAFF.status === 'active' && (STAFF.can_issue || STAFF.can_notify)){
      try { SPARTS = await api('/rest/v1/rpc/iva_staff_parts', 'POST', {}) || []; } catch(e){ SPARTS = []; }
      try { SCARDS = lcMap(await api('/rest/v1/rpc/iva_order_cards', 'POST', { p_scope: 'staff' })); } catch(e){ SCARDS = null; }
    }
    /* этап 2 «Работы в прокате»: инструмент пунктов сотрудника с правом «Добавляет инструмент» (iva_staff_tools, SQL 10.122) */
    if (STAFF && STAFF.status === 'active' && STAFF.can_catalog){
      try {
        const r = await api('/rest/v1/rpc/iva_staff_tools', 'POST', {});
        STOOLS = Array.isArray(r) ? r.map(function(x){ return x && x.iva_staff_tools ? x.iva_staff_tools : x; }).filter(Boolean) : null;
      } catch(e){ STOOLS = null; }
    }
    /* этап 3: переписки пунктов сотрудника с правом «Отвечает в чате» */
    if (STAFF && STAFF.status === 'active' && STAFF.can_chat) await stLoadChats();
  }

    return n ? '<span class="n">' + n + '</span>' : '';
  }

        .then(function(){ stChatPoll(false); }).catch(function(){});

    };
    ta.onkeydown = function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('stChSend').click(); } };

  /* автообновление раз в 30 секунд, пока открыта «Работа» и вкладка браузера видна */
  function stAuto(){
    if (ST_TIMER) return;
    ST_TIMER = setInterval(async function(){
      if (TAB !== 'staff' || !STAFF || STAFF.status !== 'active' || document.hidden || $('sheet')) return;
      const seen = {}; SPARTS.forEach(function(p){ seen[p.part_id] = 1; });
      const sig = function(){ return JSON.stringify(SPARTS.map(function(p){ return [p.part_id, p.status, p.rented_at || '']; })) + '|' + (SCARDS ? Object.keys(SCARDS).length : -1) +
        '|' + JSON.stringify((STOOLS || []).map(function(t){ return [t.id, t.review || '', t.edit_state || '', t.status || '', t.active]; })) +
        '|' + JSON.stringify((STCHATS || []).map(function(c){ return [c.kind, c.key, c.peer, c.unread, c.last_at]; })); };
      const s0 = sig(), u0 = stUnread(STCHATS);
      try { await loadStaff(); } catch(e){ return; }
      ST_UPD = Date.now();
      if (!STAFF || STAFF.status !== 'active'){ render(); return; }
      const fresh = SPARTS.filter(function(p){ return !seen[p.part_id] && (p.status || 'new') === 'new'; });
      fresh.forEach(function(p){ ST_FRESH[p.part_id] = Date.now(); });
      if (fresh.length) toast(fresh.length === 1 ? 'Новая заявка: ' + (fresh[0].tools_text || '') : 'Новых заявок: ' + fresh.length);
      else if (stUnread(STCHATS) > u0) toast('Новое сообщение от клиента');
      if (sig() !== s0) stRepaint(); else { const u = $('stUpd'); if (u) u.textContent = stUpdTxt(); }
    }, 30000);
  }
