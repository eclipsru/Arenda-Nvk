<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог — Ива, аренда инструмента</title>
<meta name="description" content="Каталог инструмента в аренду: фильтры по цене, категории, городу и состоянию. Цена за сутки, возвратный залог.">
<meta name="theme-color" content="#101217">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css?v=20260923-global-search">
</head>
<body>

<div id="hdr"></div>

<main class="page">
  <div class="wrap catalog-wide">
    <div class="sect" style="padding-bottom:0">
      <div class="sect-h">
        <h2 id="ttl">Каталог</h2>
      </div>
    </div>

    <div class="layout">
      <!-- Фильтры (десктоп) -->
      <aside class="filters" id="filters"></aside>

      <!-- Результаты -->
      <section>
        <div class="toolbar">
          <button class="f-mob-btn" id="fMob">
            <svg viewBox="0 0 24 24"><path d="M3 5h18M7 12h10M11 19h2"/></svg>
            Фильтры <span class="n hide" id="fMobN">0</span>
          </button>
          <span class="found" id="found"></span>
          <div class="sort">
            <span>Сортировка</span>
            <select class="inp" id="sort" aria-label="Сначала по состоянию инструмента">
              <option value="new">Новые</option>
              <option value="good">Хорошие</option>
              <option value="work">Рабочие</option>
            </select>
          </div>
        </div>

        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </div>
</main>

<div id="ftr"></div>
<div id="bnav"></div>

<script src="assets/data.js"></script>
<script src="assets/sb.js?v=20260923-edit-profile-city"></script>
<script src="assets/app.js?v=20260923-edit-profile-city"></script>
<script>
(function(){

  /* ---------- Состояние фильтров из URL ---------- */
  var p = new URLSearchParams(location.search);
  var F = {
    q:         p.get('q') || '',
    cat:       p.get('cat') || '',
    sub:       p.get('sub') || '',
    city:      p.has('city') ? p.get('city').trim() : getCity(),
    priceFrom: Number(p.get('from')) || 0,
    priceTo:   Number(p.get('to')) || 0,
    conds:     (p.get('cond') || '').split(',').filter(Boolean),
    delivery:  p.get('delivery') === '1'
  };
  var SORT = p.get('sort') || 'new';
  if (['new','good','work'].indexOf(SORT) === -1) SORT = 'new';

  setCity(F.city,p.has('city')); // Город в ссылке имеет приоритет над сохранённым.
  mountChrome('', F.q);

  /* ---------- Синхронизация URL без перезагрузки ---------- */
  function syncURL(){
    var u = new URLSearchParams();
    if (F.q) u.set('q', F.q);
    if (F.cat) u.set('cat', F.cat);
    if (F.sub) u.set('sub', F.sub);
    u.set('city', F.city); // city= сохраняет явный выбор всех городов.
    if (F.priceFrom) u.set('from', F.priceFrom);
    if (F.priceTo) u.set('to', F.priceTo);
    if (F.conds.length) u.set('cond', F.conds.join(','));
    if (F.delivery) u.set('delivery', '1');
    if (SORT !== 'new') u.set('sort', SORT);
    var s = u.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
  }

  /* ---------- Счётчик по категории с учётом прочих фильтров ---------- */
  function countFor(catKey){
    var probe = Object.assign({}, F, {cat:catKey, sub:''});
    return applyFilters(ADS, probe).length;
  }

  /* ---------- Разметка панели фильтров ---------- */
  function filtersHTML(){
    var subs = F.cat ? subsOf(F.cat) : [];

    var catList = '<div class="f-item' + (!F.cat ? ' on' : '') + '" data-cat="">' +
                    'Все категории<span class="n">' + countFor('') + '</span></div>' +
      CATS.map(function(c){
        return '<div class="f-item' + (F.cat === c.key ? ' on' : '') + '" data-cat="' + c.key + '">' +
                 esc(c.title) + '<span class="n">' + countFor(c.key) + '</span></div>';
      }).join('');

    var subBlock = subs.length ?
      '<div class="f-grp"><h4>Подкатегория</h4><div class="f-list">' +
        '<div class="f-item' + (!F.sub ? ' on' : '') + '" data-sub="">Любая</div>' +
        subs.map(function(s){
          var n = ADS.filter(function(a){
            return a.status === 'active' && (!F.city || cityMatches(a.city,F.city)) && a.cat === F.cat && a.sub === s.key;
          }).length;
          return '<div class="f-item' + (F.sub === s.key ? ' on' : '') + '" data-sub="' + s.key + '">' +
                   esc(s.title) + '<span class="n">' + n + '</span></div>';
        }).join('') +
      '</div></div>' : '';

    return '' +
    '<div class="f-grp"><h4>Цена за сутки, ₽</h4>' +
      '<div class="f-row">' +
        '<input class="inp" id="pFrom" type="number" min="0" placeholder="от" value="' + (F.priceFrom || '') + '">' +
        '<input class="inp" id="pTo" type="number" min="0" placeholder="до" value="' + (F.priceTo || '') + '">' +
      '</div>' +
    '</div>' +

    '<div class="f-grp"><h4>Категория</h4><div class="f-list">' + catList + '</div></div>' +
    subBlock +

    '<div class="f-grp"><h4>Город</h4>' +
      '<select class="inp" id="fCity">' +
        '<option value="">Все города</option>' +
        availableCities().map(function(c){
          return '<option value="' + esc(c) + '"' + (F.city === c ? ' selected' : '') + '>' + esc(c) + '</option>';
        }).join('') +
      '</select>' +
    '</div>' +

    '<div class="f-grp"><h4>Состояние</h4>' +
      CONDS.map(function(c){
        return '<label class="chk"><input type="checkbox" data-cond="' + c.key + '"' +
               (F.conds.indexOf(c.key) !== -1 ? ' checked' : '') + '>' + esc(c.title) + '</label>';
      }).join('') +
    '</div>' +

    '<div class="f-grp">' +
      '<label class="chk"><input type="checkbox" id="fDeliv"' + (F.delivery ? ' checked' : '') + '>' +
        'Только с доставкой</label>' +
    '</div>' +

    '<div class="f-grp">' +
      '<button class="btn sec wide sm" id="fReset">Сбросить фильтры</button>' +
    '</div>';
  }

  /* ---------- Привязка обработчиков панели ---------- */
  function bindFilters(root){
    root.addEventListener('click', function(e){
      var c = e.target.closest('[data-cat]');
      if (c){ F.cat = c.getAttribute('data-cat'); F.sub = ''; render(); return; }

      var s = e.target.closest('[data-sub]');
      if (s){ F.sub = s.getAttribute('data-sub'); render(); return; }

      if (e.target.id === 'fReset'){
        setCity('',true);
        F = {q:'', cat:'', sub:'', city:'', priceFrom:0, priceTo:0, conds:[], delivery:false};
        render();
      }
    });

    root.addEventListener('change', function(e){
      var t = e.target;
      if (t.id === 'fCity'){ setCity(t.value,true); F.city = t.value; render(); }
      else if (t.id === 'fDeliv'){ F.delivery = t.checked; render(); }
      else if (t.hasAttribute && t.hasAttribute('data-cond')){
        var k = t.getAttribute('data-cond');
        var i = F.conds.indexOf(k);
        if (t.checked && i === -1) F.conds.push(k);
        if (!t.checked && i !== -1) F.conds.splice(i, 1);
        render();
      }
    });

    /* Цена — применяем по Enter или потере фокуса, чтобы не дёргалось при наборе */
    root.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && (e.target.id === 'pFrom' || e.target.id === 'pTo')) e.target.blur();
    });
    root.addEventListener('blur', function(e){
      if (e.target.id === 'pFrom' || e.target.id === 'pTo'){
        var fEl = root.querySelector('#pFrom'), tEl = root.querySelector('#pTo');
        var from = Number(fEl && fEl.value) || 0;
        var to   = Number(tEl && tEl.value) || 0;
        if (from !== F.priceFrom || to !== F.priceTo){
          F.priceFrom = from; F.priceTo = to; render();
        }
      }
    }, true);
  }

  /* ---------- Чипы активных фильтров ---------- */
  function chipsHTML(){
    var out = [];
    var add = function(label, key){
      out.push('<span class="chip">' + esc(label) +
               '<button data-x="' + key + '" aria-label="Убрать">×</button></span>');
    };

    if (F.q)    add('«' + F.q + '»', 'q');
    if (F.cat)  add(catTitle(F.cat), 'cat');
    if (F.sub)  add(subTitle(F.sub), 'sub');
    if (F.city) add(F.city, 'city');
    if (F.priceFrom) add('от ' + F.priceFrom + ' ₽', 'from');
    if (F.priceTo)   add('до ' + F.priceTo + ' ₽', 'to');
    F.conds.forEach(function(c){ add(condTitle(c), 'cond:' + c); });
    if (F.delivery) add('С доставкой', 'delivery');

    if (out.length > 1) out.push('<span class="chip clr" data-x="all">Сбросить всё</span>');
    return out.join('');
  }

  /* ---------- Главный рендер ---------- */
  function render(){
    setCity(F.city);
    syncURL();

    /* Панель фильтров: десктопная всегда, мобильная — если открыта шторка */
    $('filters').innerHTML = filtersHTML();
    var sheetBody = $1('#sheet .sheet-b');
    if (sheetBody && sheetBody.querySelector('#fCity')) sheetBody.innerHTML = filtersHTML();

    /* Заголовок */
    $('ttl').textContent = F.cat ? catTitle(F.cat) : (F.q ? 'Поиск: ' + F.q : 'Каталог');

    /* Результаты */
    var list = sortAds(applyFilters(ADS, F), SORT);
    $('found').textContent = 'Найдено ' + list.length + ' ' +
      plural(list.length, 'объявление', 'объявления', 'объявлений');

    $('chips').innerHTML = chipsHTML();

    /* Счётчик активных фильтров на мобильной кнопке */
    var n = (F.cat?1:0) + (F.sub?1:0) + (F.city?1:0) + (F.priceFrom?1:0) +
            (F.priceTo?1:0) + F.conds.length + (F.delivery?1:0);
    $('fMobN').textContent = n;
    $('fMobN').classList.toggle('hide', !n);

    if (!list.length){
      $('grid').innerHTML =
        '<div class="empty" style="grid-column:1/-1">' +
          '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>' +
          '<b>Ничего не нашлось</b>' +
          '<p>' + (F.city ? 'В городе «' + esc(F.city) + '» нет объявлений по выбранным условиям. ' :
             'По выбранным условиям объявлений нет. ') + 'Измените фильтры или выберите другой город.</p>' +
          '<button class="btn sec" id="eReset">Сбросить фильтры</button>' +
        '</div>';
      var er = $('eReset');
      if (er) er.addEventListener('click', function(){
        setCity('',true);
        F = {q:'', cat:'', sub:'', city:'', priceFrom:0, priceTo:0, conds:[], delivery:false};
        render();
      });
      return;
    }
    $('grid').innerHTML = list.map(adCard).join('');
  }

  /* ---------- Снятие чипа ---------- */
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('[data-x]');
    if (!b) return;
    var k = b.getAttribute('data-x');

    if (k === 'all'){
      setCity('',true);
      F = {q:'', cat:'', sub:'', city:'', priceFrom:0, priceTo:0, conds:[], delivery:false};
      var qi = $('q'); if (qi) qi.value = '';
    }
    else if (k === 'q'){ F.q = ''; var qi2 = $('q'); if (qi2) qi2.value = ''; }
    else if (k === 'cat'){ F.cat = ''; F.sub = ''; }
    else if (k === 'sub'){ F.sub = ''; }
    else if (k === 'city'){ setCity('',true); F.city = ''; }
    else if (k === 'from'){ F.priceFrom = 0; }
    else if (k === 'to'){ F.priceTo = 0; }
    else if (k === 'delivery'){ F.delivery = false; }
    else if (k.indexOf('cond:') === 0){
      var c = k.slice(5), i = F.conds.indexOf(c);
      if (i !== -1) F.conds.splice(i, 1);
    }
    render();
  });

  /* ---------- Сортировка ---------- */
  $('sort').value = SORT;
  $('sort').addEventListener('change', function(){ SORT = this.value; render(); });

  /* ---------- Мобильная шторка фильтров ---------- */
  $('fMob').addEventListener('click', function(){
    openSheet('Фильтры', filtersHTML(),
      '<button class="btn sec" id="shReset" style="flex:1">Сбросить</button>' +
      '<button class="btn" id="shOk" style="flex:2">Показать</button>');

    bindFilters($1('#sheet .sheet-b'));

    $('shOk').addEventListener('click', closeSheet);
    $('shReset').addEventListener('click', function(){
      setCity('',true);
      F = {q:'', cat:'', sub:'', city:'', priceFrom:0, priceTo:0, conds:[], delivery:false};
      render();
      closeSheet();
    });
  });

  window.onCityChanged = function(){ F.city = getCity(); render(); };

  bindFilters($('filters'));
  render();
  hydrateShowcase().then(render);   /* перерисовать по живым данным */
})();
</script>
</body>
</html>
