<body>

<div id="hdr"></div>

<main class="page">
  <div class="wrap catalog-wide">
    <div class="sect" style="padding-bottom:0">
      <div class="sect-h">
        <h2 id="ttl">Каталог</h2>
      </div>
    </div>

    <div class="layout">
      <!-- Фильтры (десктоп) -->
      <aside class="filters" id="filters"></aside>

      <!-- Результаты -->
      <section>
        <div class="toolbar">
          <button class="f-mob-btn" id="fMob">
            <svg viewBox="0 0 24 24"><path d="M3 5h18M7 12h10M11 19h2"/></svg>
            Фильтры <span class="n hide" id="fMobN">0</span>
          </button>
          <span class="found" id="found"></span>
          <div class="sort">
            <span>Сортировка</span>
            <select class="inp" id="sort" aria-label="Сортировка объявлений">
              <option value="fresh">Сначала новые</option>
              <option value="cheap">Сначала дешевле</option>
              <option value="dear">Сначала дороже</option>
              <option value="rating">По рейтингу</option>
            </select>
          </div>
        </div>

        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </div>
</main>

<div id="ftr"></div>
<div id="bnav"></div>

<script src="assets/data.js"></script>
<script src="assets/geo.js?v=20260923-photon"></script>
<script src="assets/sb.js?v=20260923-photon"></script>
<script src="assets/models.js?v=20261020-power"></script>
<script src="assets/app-release.js?v=20261009-rel"></script>
<script src="assets/app.js?v=20261022-a"></script>
<script src="assets/clicks.js?v=20261001-p4"></script>
<script>
(function(){

  /* ---------- Состояние фильтров из URL ---------- */
  var p = new URLSearchParams(location.search);
  var F = {
    q:         p.get('q') || '',
    cat:       p.get('cat') || '',
    sub:       p.get('sub') || '',
    city:      p.has('city') ? p.get('city').trim() : getCity(),
    priceFrom: Number(p.get('from')) || 0,
    priceTo:   Number(p.get('to')) || 0,
    conds:     (p.get('cond') || '').split(',').filter(Boolean),
    delivery:  p.get('delivery') === '1',
    kind:      p.get('kind') || '',      /* 10.85: вид и характеристики (s.ключ=значение, r.ключ=от..до) */
    specs:     {},
    ranges:    {}
  };
  p.forEach(function(v, k){
    if (k.indexOf('s.') === 0 && v) F.specs[k.slice(2)] = v;
    if (k.indexOf('r.') === 0){
      var b = v.split('..'), lo = ivaNumSafe(b[0]), hi = ivaNumSafe(b[1]);
      if (!isNaN(lo) || !isNaN(hi)) F.ranges[k.slice(2)] = [lo, hi];
    }
  });
  function emptyF(){
    return {q:'', cat:'', sub:'', city:'', priceFrom:0, priceTo:0, conds:[], delivery:false, kind:'', specs:{}, ranges:{}};
  }
  function ivaNumSafe(v){ return typeof ivaNum === 'function' ? ivaNum(v) : NaN; }

  /* 10.85: вид и характеристики объявлений — отдельной загрузкой (ivaCatalogSpecs); пока не пришли или SQL не
     применён (SP = null) — каталог как раньше, вид в ссылке не мешает. */
  var SP = null;
  function kindsOfSub(){ return SP && F.sub ? SP.kinds.filter(function(k){ return k.cat === F.cat && k.sub === F.sub; }) : []; }
  function kindOn(){ return !!(SP && F.kind && kindsOfSub().some(function(k){ return k.key === F.kind; })); }
  function kindFields(){ return kindOn() ? ivaFieldsFor({ fields: SP.fields }, F.kind) : []; }
  function specOf(ad){ return SP && SP.byId[ad.id] || null; }
  function clearKind(){ F.kind = ''; F.specs = {}; F.ranges = {}; }
  function numIn(v){ return isNaN(v) ? '' : ivaNumText(v).replace(/\u00a0/g, ''); }
  /* Объявления вида при условиях f (без вида — как раньше); state: 1 — подходит, 0 — нет нужной характеристики. */
  function byKind(list, f){
    if (!kindOn()) return list.map(function(ad){ return { ad: ad, st: 1 }; });
    var out = [];
    list.forEach(function(ad){
      var sp = specOf(ad);
      if (!sp || sp.kind !== F.kind) return;
      var st = ivaSpecState(sp.specs, f.specs, f.ranges);
      if (st >= 0) out.push({ ad: ad, st: st });
    });
    return out;
  }
  function results(){
    var rows = byKind(sortAds(applyFilters(ADS, F), SORT), F);
    return rows.filter(function(r){ return r.st === 1; }).concat(rows.filter(function(r){ return r.st === 0; }));
  }
  /* Этап E (20.10.2026): настоящая сортировка — по свежести, цене и рейтингу. Состояние инструмента — это фильтр
     «Состояние» слева; старые ?sort=new|good|work открываются как «Сначала новые объявления». */
  var SORT = p.get('sort') || 'fresh';
  if (['fresh','cheap','dear','rating'].indexOf(SORT) === -1) SORT = 'fresh';

  setCity(F.city,p.has('city')); F.city=getCity(); // Город в ссылке имеет приоритет над сохранённым.
  mountChrome('catalog', F.q);

  /* ---------- Синхронизация URL без перезагрузки ---------- */
  function syncURL(){
    var u = new URLSearchParams();
    if (F.q) u.set('q', F.q);
    if (F.cat) u.set('cat', F.cat);
    if (F.sub) u.set('sub', F.sub);
    u.set('city', F.city); // city= сохраняет явный выбор всех городов.
    if (F.priceFrom) u.set('from', F.priceFrom);
    if (F.priceTo) u.set('to', F.priceTo);
    if (F.conds.length) u.set('cond', F.conds.join(','));
    if (F.delivery) u.set('delivery', '1');
    if (SORT !== 'fresh') u.set('sort', SORT);
    if (F.kind){
      u.set('kind', F.kind);
      Object.keys(F.specs).forEach(function(k){ u.set('s.' + k, F.specs[k]); });
      Object.keys(F.ranges).forEach(function(k){ var r = F.ranges[k]; u.set('r.' + k, (isNaN(r[0]) ? '' : r[0]) + '..' + (isNaN(r[1]) ? '' : r[1])); });
    }
    var s = u.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
  }

  /* ---------- Счётчик по категории с учётом прочих фильтров ---------- */
  function countFor(catKey){
    var probe = Object.assign({}, F, {cat:catKey, sub:''});
    return applyFilters(ADS, probe).length;
  }

  /* ---------- Разметка панели фильтров ---------- */
  function filtersHTML(){
    var subs = F.cat ? subsOf(F.cat) : [];

    var catList = '<div class="f-item' + (!F.cat ? ' on' : '') + '" data-cat="">' +
                    'Все категории<span class="n">' + countFor('') + '</span></div>' +
      CATS.map(function(c){
        return '<div class="f-item' + (F.cat === c.key ? ' on' : '') + '" data-cat="' + c.key + '">' +
                 esc(c.title) + '<span class="n">' + countFor(c.key) + '</span></div>';
      }).join('');

    var subBlock = subs.length ?
      '<div class="f-grp"><h4>Подкатегория</h4><div class="f-list">' +
        '<div class="f-item' + (!F.sub ? ' on' : '') + '" data-sub="">Любая</div>' +
        subs.map(function(s){
          var n = ADS.filter(function(a){
            return a.status === 'active' && (!F.city || cityMatches(a.city,F.city)) && a.cat === F.cat && a.sub === s.key;
          }).length;
          return '<div class="f-item' + (F.sub === s.key ? ' on' : '') + '" data-sub="' + s.key + '">' +
                   esc(s.title) + '<span class="n">' + n + '</span></div>';
        }).join('') +
      '</div></div>' : '';

    return '' +
    '<div class="f-grp"><h4>Цена за сутки, ₽</h4>' +
      '<div class="f-row">' +
        '<input class="inp" id="pFrom" type="number" min="0" placeholder="от" value="' + (F.priceFrom || '') + '">' +
        '<input class="inp" id="pTo" type="number" min="0" placeholder="до" value="' + (F.priceTo || '') + '">' +
      '</div>' +
    '</div>' +

    '<div class="f-grp"><h4>Категория</h4><div class="f-list">' + catList + '</div></div>' +
    subBlock + kindHTML() +

    '<div class="f-grp"><h4>Город</h4>' +
      '<select class="inp" id="fCity">' +
        '<option value="">Все города</option>' +
        availableCities().map(function(c){
          return '<option value="' + esc(c) + '"' + (F.city === c ? ' selected' : '') + '>' + esc(c) + '</option>';
        }).join('') +
      '</select>' +
    '</div>' +

    '<div class="f-grp"><h4>Состояние</h4>' +
      CONDS.map(function(c){
        return '<label class="chk"><input type="checkbox" data-cond="' + c.key + '"' +
               (F.conds.indexOf(c.key) !== -1 ? ' checked' : '') + '>' + esc(c.title) + '</label>';
      }).join('') +
    '</div>' +

    '<div class="f-grp">' +
      '<label class="chk"><input type="checkbox" id="fDeliv"' + (F.delivery ? ' checked' : '') + '>' +
        'Только с доставкой</label>' +
    '</div>' +

    '<div class="f-grp">' +
      '<button class="btn sec wide sm" id="fReset">Сбросить фильтры</button>' +
    '</div>';
  }

  /* ---------- 10.85: «Вид» и характеристики (как в приложении) ---------- */
  function kindHTML(){
    var kinds = kindsOfSub();
    if (!kinds.length) return '';
    var base = applyFilters(ADS, F), cnt = {};
    base.forEach(function(ad){ var sp = specOf(ad); if (sp) cnt[sp.kind] = (cnt[sp.kind] || 0) + 1; });
    var shown = kinds.filter(function(k){ return cnt[k.key] || k.key === F.kind; });
    if (!shown.length) return '';
    var out = '<div class="f-grp"><h4>Вид</h4><div class="f-list">' +
      '<div class="f-item' + (!kindOn() ? ' on' : '') + '" data-kind="">Любой</div>' +
      shown.map(function(k){
        return '<div class="f-item' + (F.kind === k.key ? ' on' : '') + '" data-kind="' + esc(k.key) + '">' +
                 esc(k.title) + '<span class="n">' + (cnt[k.key] || 0) + '</span></div>';
      }).join('') + '</div></div>';
    if (!kindOn()) return out;
    var fl = kindFields(), ofKind = base.filter(function(ad){ var sp = specOf(ad); return sp && sp.kind === F.kind; });
    ivaChoiceFields(fl).forEach(function(f){
      var other = { specs: Object.assign({}, F.specs), ranges: F.ranges }, c = {};
      delete other.specs[f.key];
      ofKind.forEach(function(ad){
        var sp = specOf(ad);
        if (ivaSpecState(sp.specs, other.specs, other.ranges) < 0) return;
        var v = String(sp.specs[f.key] == null ? '' : sp.specs[f.key]).trim();
        if (v) c[v] = (c[v] || 0) + 1;
      });
      var sel = F.specs[f.key] || '', vals = f.options.filter(function(v){ return c[v] || v === sel; });
      if (!vals.length) return;
      out += '<div class="f-grp"><h4>' + esc(f.title) + '</h4><div class="f-list">' +
        '<div class="f-item' + (!sel ? ' on' : '') + '" data-spec="' + esc(f.key) + '" data-val="">Любое</div>' +
        vals.map(function(v){
          return '<div class="f-item' + (v === sel ? ' on' : '') + '" data-spec="' + esc(f.key) + '" data-val="' + esc(v) + '">' +
                   esc(v) + '<span class="n">' + (c[v] || 0) + '</span></div>';
        }).join('') + '</div></div>';
    });
    ivaNumFields(fl).forEach(function(f){
      var has = F.ranges[f.key] || ofKind.some(function(ad){ return !isNaN(ivaNum(specOf(ad).specs[f.key])); });
      if (!has) return;
      var other = { specs: F.specs, ranges: Object.assign({}, F.ranges) }, min = NaN, max = NaN, n = 0;
      delete other.ranges[f.key];
      ofKind.forEach(function(ad){
        var sp = specOf(ad);
        if (ivaSpecState(sp.specs, other.specs, other.ranges) < 0) return;
        var v = ivaNum(sp.specs[f.key]);
        if (isNaN(v)) return;
        n++; if (isNaN(min) || v < min) min = v; if (isNaN(max) || v > max) max = v;
      });
      var r = F.ranges[f.key] || [NaN, NaN];
      out += '<div class="f-grp"><h4>' + esc(f.title + (f.unit ? ', ' + f.unit : '')) + '</h4>' +
        '<div class="f-row">' +
          '<input class="inp" data-rng="' + esc(f.key) + '" data-end="0" inputmode="decimal" placeholder="от" value="' + numIn(r[0]) + '">' +
          '<input class="inp" data-rng="' + esc(f.key) + '" data-end="1" inputmode="decimal" placeholder="до" value="' + numIn(r[1]) + '">' +
        '</div><div class="small muted" style="margin-top:6px">' + esc(ivaRangeHint(min, max, n, f.unit)) + '</div></div>';
    });
    var miss = results().filter(function(x){ return x.st === 0; }).length;
    if (miss) out += '<div class="f-grp"><div class="small muted" id="fSpecNote">' + esc(ivaMissingNote(miss)) + '</div></div>';
    return out;
  }

  /* ---------- Привязка обработчиков панели ---------- */
  function bindFilters(root){
    root.addEventListener('click', function(e){
      var c = e.target.closest('[data-cat]');
      if (c){ F.cat = c.getAttribute('data-cat'); F.sub = ''; clearKind(); render(); return; }

      var s = e.target.closest('[data-sub]');
      if (s){ F.sub = s.getAttribute('data-sub'); clearKind(); render(); return; }

      var kd = e.target.closest('[data-kind]');
      if (kd){ var nk = kd.getAttribute('data-kind'); if (nk !== F.kind){ clearKind(); F.kind = nk; } render(); return; }

      var sv = e.target.closest('[data-spec]');
      if (sv){
        var sk = sv.getAttribute('data-spec'), val = sv.getAttribute('data-val');
        if (!val || F.specs[sk] === val) delete F.specs[sk]; else F.specs[sk] = val;
        render(); return;
      }

      if (e.target.id === 'fReset'){
        setCity('',true);
        F = emptyF();
        render();
      }
    });

    root.addEventListener('change', function(e){
      var t = e.target;
      if (t.id === 'fCity'){ setCity(t.value,true); F.city = t.value; render(); }
      else if (t.id === 'fDeliv'){ F.delivery = t.checked; render(); }
      else if (t.hasAttribute && t.hasAttribute('data-cond')){
        var k = t.getAttribute('data-cond');
        var i = F.conds.indexOf(k);
        if (t.checked && i === -1) F.conds.push(k);
        if (!t.checked && i !== -1) F.conds.splice(i, 1);
        render();
      }
    });

    /* Цена — применяем по Enter или потере фокуса, чтобы не дёргалось при наборе */
    root.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && (e.target.id === 'pFrom' || e.target.id === 'pTo' || e.target.hasAttribute('data-rng'))) e.target.blur();
    });
    root.addEventListener('blur', function(e){
      if (e.target.id === 'pFrom' || e.target.id === 'pTo'){
        var fEl = root.querySelector('#pFrom'), tEl = root.querySelector('#pTo');
        var from = Number(fEl && fEl.value) || 0;
        var to   = Number(tEl && tEl.value) || 0;
        if (from !== F.priceFrom || to !== F.priceTo){
          F.priceFrom = from; F.priceTo = to; render();
        }
      }
      if (e.target.hasAttribute && e.target.hasAttribute('data-rng')){   /* 10.85: «от/до» характеристики — как цена */
        var key = e.target.getAttribute('data-rng');
        var lo = ivaNum((root.querySelector('[data-rng="' + key + '"][data-end="0"]') || {}).value);
        var hi = ivaNum((root.querySelector('[data-rng="' + key + '"][data-end="1"]') || {}).value);
        var old = F.ranges[key] || [NaN, NaN];
        if (String(lo) === String(old[0]) && String(hi) === String(old[1])) return;
        if (isNaN(lo) && isNaN(hi)) delete F.ranges[key]; else F.ranges[key] = [lo, hi];
        render();
      }
    }, true);
  }

  /* ---------- Чипы активных фильтров ---------- */
  function chipsHTML(){
    var out = [];
    var add = function(label, key){
      out.push('<span class="chip">' + esc(label) +
               '<button data-x="' + key + '" aria-label="Убрать">×</button></span>');
    };

    if (F.q)    add('«' + F.q + '»', 'q');
    if (F.cat)  add(catTitle(F.cat), 'cat');
    if (F.sub)  add(subTitle(F.sub), 'sub');
    if (kindOn()){
      var kt = kindsOfSub().filter(function(k){ return k.key === F.kind; })[0];
      add(kt ? kt.title : F.kind, 'kind');
      var fl = kindFields();
      Object.keys(F.specs).forEach(function(k){ add(ivaSpecChip(fl, k, F.specs[k]), 's:' + k); });
      Object.keys(F.ranges).forEach(function(k){ add(ivaRangeChip(fl, k, F.ranges[k]).replace(/\u00a0/g, ' '), 'r:' + k); });
    }
    if (F.city) add(F.city, 'city');
    if (F.priceFrom) add('от ' + F.priceFrom + ' ₽', 'from');
    if (F.priceTo)   add('до ' + F.priceTo + ' ₽', 'to');
    F.conds.forEach(function(c){ add(condTitle(c), 'cond:' + c); });
    if (F.delivery) add('С доставкой', 'delivery');

    if (out.length > 1) out.push('<span class="chip clr" data-x="all">Сбросить всё</span>');
    return out.join('');
  }

  /* ---------- Главный рендер ---------- */
  function render(){
    setCity(F.city);
    syncURL();

    /* Панель фильтров: десктопная всегда, мобильная — если открыта шторка */
    $('filters').innerHTML = filtersHTML();
    var sheetBody = $1('#sheet .sheet-b');
    if (sheetBody && sheetBody.querySelector('#fCity')) sheetBody.innerHTML = filtersHTML();

    /* Заголовок */
    $('ttl').textContent = F.cat ? catTitle(F.cat) : (F.q ? 'Поиск: ' + F.q : 'Каталог');

    /* Результаты */
    var list = results().map(function(r){ return r.ad; });   /* 10.85: без нужной характеристики — в конце */
    $('found').textContent = 'Найдено ' + list.length + ' ' +
      plural(list.length, 'объявление', 'объявления', 'объявлений');

    $('chips').innerHTML = chipsHTML();
    var shOk = $('shOk'); if (shOk) shOk.textContent = showNText(list.length);

    /* Счётчик активных фильтров на мобильной кнопке */
    var n = (F.cat?1:0) + (F.sub?1:0) + (F.city?1:0) + (F.priceFrom?1:0) +
            (F.priceTo?1:0) + F.conds.length + (F.delivery?1:0) +
            (kindOn() ? 1 + Object.keys(F.specs).length + Object.keys(F.ranges).length : 0);
    $('fMobN').textContent = n;
    $('fMobN').classList.toggle('hide', !n);

    if (!list.length){
      // Пустое состояние: не тупик, а понятный следующий шаг (этап П4).
      // Только тексты и ссылки — никакого сбора данных.
      var allEmpty = (typeof ADS === 'undefined') || !ADS.length;
      $('grid').innerHTML = ivaEmptyStateHTML({
        city: F.city, hasFilters: n > 0, allEmpty: allEmpty, pages: _cityPagesData
      });
      var er = $('eReset');
      if (er) er.addEventListener('click', function(){
        setCity('',true);
        F = emptyF();
        render();
      });
      // Список городов со страницами подгружается один раз и не тормозит показ:
      // пока его нет — ведём в общий список, после загрузки — сразу в нужный город.
      if (!_cityPagesData && typeof loadCityPages === 'function'){
        loadCityPages().then(function(){ render(); });
      }
      return;
    }
    $('grid').innerHTML = list.map(adCard).join('');
  }

  /* ---------- Снятие чипа ---------- */
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('[data-x]');
    if (!b) return;
    var k = b.getAttribute('data-x');

    if (k === 'all'){
      setCity('',true);
      F = emptyF();
      var qi = $('q'); if (qi) qi.value = '';
    }
    else if (k === 'q'){ F.q = ''; var qi2 = $('q'); if (qi2) qi2.value = ''; }
    else if (k === 'cat'){ F.cat = ''; F.sub = ''; clearKind(); }
    else if (k === 'sub'){ F.sub = ''; clearKind(); }
    else if (k === 'kind'){ clearKind(); }
    else if (k.indexOf('s:') === 0){ delete F.specs[k.slice(2)]; }
    else if (k.indexOf('r:') === 0){ delete F.ranges[k.slice(2)]; }
    else if (k === 'city'){ setCity('',true); F.city = ''; }
    else if (k === 'from'){ F.priceFrom = 0; }
    else if (k === 'to'){ F.priceTo = 0; }
    else if (k === 'delivery'){ F.delivery = false; }
    else if (k.indexOf('cond:') === 0){
      var c = k.slice(5), i = F.conds.indexOf(c);
      if (i !== -1) F.conds.splice(i, 1);
    }
    render();
  });

  /* ---------- Сортировка ---------- */
  $('sort').value = SORT;
  $('sort').addEventListener('change', function(){ SORT = this.value; render(); });

  /* «Показать 12» — сколько найдётся, видно прямо в шторке фильтров (этап E) */
  function showNText(n){
    if (n == null) n = results().length;
    return n ? 'Показать ' + n : 'Ничего не найдено';
  }

  /* ---------- Мобильная шторка фильтров ---------- */
  $('fMob').addEventListener('click', function(){
    openSheet('Фильтры', filtersHTML(),
      '<button class="btn sec" id="shReset" style="flex:0 0 auto;padding-left:18px;padding-right:18px">Сбросить</button>' +
      '<button class="btn" id="shOk" style="flex:1">' + showNText() + '</button>');

    bindFilters($1('#sheet .sheet-b'));

    $('shOk').addEventListener('click', closeSheet);
    $('shReset').addEventListener('click', function(){
      setCity('',true);
      F = emptyF();
      render();
      closeSheet();
    });
  });

  window.onCityChanged = function(){ F.city = getCity(); render(); };

  IvaClicks.init(getCity(), {views: false});  // считаем только обращения, не показы
  bindFilters($('filters'));
  render();
  hydrateShowcase().then(render)   /* перерисовать по живым данным */
    .then(function(){ return typeof ivaCatalogSpecs === 'function' ? ivaCatalogSpecs(api) : null; })
    .then(function(sp){   /* 10.85: вид и характеристики пришли — «Вид» в фильтре; вид не из этой подкатегории — снимается */
      if (!sp) return;
      SP = sp;
      if (F.kind && !kindOn()) clearKind();
      render();
    });
})();
</script>
</body>
</html>
