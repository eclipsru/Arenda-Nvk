<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101217">
<title>Ива — Инструмент в аренду</title>
<style>
:root{--bg:#101217;--card:#1A1D24;--field:#171A21;--line:#262B35;--fl:#3A4050;--or:#FF8F1F;--ord:#F57C00;--tx:#F2F4F8;--gr:#9AA1B0;--g2:#6B7080;--red:#FF8A80;--grn:#4CAF50;--grnB:#00E676}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0B0D11;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--tx)}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px #000}
button{font-family:inherit;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;outline:none}
.hide{display:none!important}
/* ---- splash ---- */
#splash{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center}
#splash img{width:96px;height:96px;border-radius:20px;border:1px solid var(--line);background:#101217}
#splash div{margin-top:18px;font-size:22px;font-weight:700}
/* ---- header ---- */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr img{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#101217}
.hdr .tt{flex:1;font-weight:700;font-size:15px}
.hdr .out{color:var(--or);font-weight:700;font-size:13px;padding:6px}
/* ---- bottom nav ---- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:#12151B;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;color:var(--g2);font-size:10.5px;padding:8px 0 9px;position:relative}
.nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:currentColor}
.nav button.on{color:var(--or)}
.nav .plus{width:52px;height:52px;margin-top:-20px;border-radius:50%;background:var(--or);color:#fff!important;box-shadow:0 4px 14px #0008;display:flex;align-items:center;justify-content:center}
.nav .plus svg{width:26px;height:26px;margin:0}
/* ---- screens ---- */
.scr{padding:12px 14px 86px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs span{padding:0 2px 9px;color:var(--gr);font-weight:700;font-size:16px;cursor:pointer}
.tabs span.on{color:#fff;border-bottom:3px solid var(--or)}
/* ---- auth ---- */
#auth .hero{height:128px;background:linear-gradient(160deg,#1C1410,#12151B 70%);border-radius:0 0 18px 18px;display:flex;align-items:center;padding:16px;gap:14px;border-bottom:1px solid var(--line)}
#auth .hero b{font-size:20px;text-shadow:0 2px 8px #000}
.fld{display:flex;align-items:center;background:var(--field);border:1px solid var(--fl);border-radius:12px;padding:0 12px;margin-top:12px}
.fld input{flex:1;background:none;border:0;color:var(--tx);font-size:16px;padding:14px 0}
.fld input::placeholder{color:var(--g2)}
.big{display:block;width:100%;background:var(--ord);color:#fff;font-size:17px;font-weight:700;padding:15px;border-radius:12px;margin-top:18px}
.big:active{background:var(--or)}
.link{display:block;text-align:center;color:#C9CFDA;font-size:15px;padding:14px;cursor:pointer}
.err{color:var(--red);font-size:14px;margin-top:12px;display:none}
.fgt{color:var(--or);font-size:13px;font-weight:700;margin-top:10px;display:inline-block;cursor:pointer}
/* ---- home ---- */
.srch{display:flex;align-items:center;background:var(--field);border:1px solid var(--fl);border-radius:12px;padding:0 12px}
.srch input{flex:1;background:none;border:0;color:var(--tx);font-size:15px;padding:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--gr);font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px}
.chip.on{background:var(--ord);border-color:var(--ord);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;cursor:pointer}
.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#12151B}
.tile .nm{font-size:13.5px;font-weight:600;padding:8px 10px 2px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .pr{padding:2px 10px 10px;font-weight:700;font-size:14.5px}
.tile .pr small{display:block;color:var(--g2);font-weight:500;font-size:11px}
.tile .like{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#101217cc;display:flex;align-items:center;justify-content:center}
.tile .like svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2}
.tile .like.on svg{fill:var(--or);stroke:var(--or)}
.catdash{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-top:10px}
.dcat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;cursor:pointer}
.dcat:hover{border-color:var(--fl);background:#1E222B}
.dic svg{width:27px;height:27px;fill:var(--or)}
.dcat b{font-size:13.5px;font-weight:600;line-height:1.25}
/* ---- buttons/inputs generic ---- */
.btn{background:var(--ord);color:#fff;font-weight:700;font-size:15px;padding:13px 18px;border-radius:12px}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn.grn{background:var(--grn)}
.btn.red{background:#B3261E}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:10px}
.inp{width:100%;background:var(--field);border:1px solid var(--fl);border-radius:12px;color:var(--tx);font-size:15.5px;padding:13px 12px;margin-top:10px}
.inp::placeholder{color:var(--g2)}
textarea.inp{resize:vertical;min-height:70px}
.lbl{color:var(--g2);font-size:12px;margin-top:14px;display:block}
/* ---- cart bar ---- */
.cbar{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;background:var(--ord);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;box-shadow:0 6px 18px #000a;z-index:15}
/* ---- modal ---- */
.mask{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px 30px}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--fl);margin:0 auto 14px}
.sheet h3{font-size:18px;margin-bottom:8px}
/* ---- tool card ---- */
.timg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#12151B}
.rowline{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.price{font-size:20px;font-weight:700;color:var(--or)}
.dep{color:var(--gr);font-size:13px;margin-top:2px}
.sect{color:var(--g2);font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.txt{font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.ownbox{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;font-size:13.5px;color:var(--gr);line-height:1.5}
.qty{display:inline-flex;align-items:center;gap:14px;background:var(--field);border:1px solid var(--fl);border-radius:12px;padding:8px 14px;margin-top:12px}
.qty button{background:none;color:var(--or);font-size:22px;font-weight:700;width:28px}
.qty b{min-width:20px;text-align:center}
.hint{color:var(--g2);font-size:12px;margin-top:6px}
/* ---- lists ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .dt{color:var(--g2);font-size:12px;white-space:nowrap}
.card .body{font-size:14px;line-height:1.45;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:12px}
.b-new{background:#0e2a15;color:var(--grnB)}
.b-rented{background:#2d230c;color:#FFC26B}
.b-closed{background:#2d1113;color:var(--red)}
.rowbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empt{color:var(--g2);text-align:center;padding:40px 20px;font-size:14px}
/* ---- chat ---- */
.thr{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;cursor:pointer}
.ava{width:44px;height:44px;border-radius:50%;background:var(--ord);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.thr .nm{font-weight:600;font-size:14.5px}
.thr .ms{color:var(--g2);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.thr .un{min-width:20px;height:20px;border-radius:10px;background:var(--or);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-left:auto}
.msgs{padding:6px 14px 100px}.chdr{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line)}.chdr .tt{flex:1;font-weight:700;font-size:15px}
.msg{max-width:78%;margin-top:8px;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.msg.me{background:var(--ord);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.ot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .tm{display:block;font-size:10.5px;opacity:.75;margin-top:3px}
.daysep{text-align:center;color:var(--g2);font-size:11.5px;margin:12px 0 2px}
.ibar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#12151B;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:21}
.ibar input{flex:1;background:var(--field);border:1px solid var(--fl);border-radius:20px;color:var(--tx);font-size:15px;padding:11px 16px}
.ibar .send{width:42px;height:42px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center}
.ibar .send svg{width:20px;height:20px;fill:#fff}
.clip{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--fl);display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.clip svg{width:20px;height:20px;fill:var(--gr)}
/* ---- stats ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{color:var(--g2);font-size:11.5px}
.stat .v{font-size:19px;font-weight:700;margin-top:4px}
.neg{color:var(--red)}.pos{color:var(--grnB)}
/* ---- toast ---- */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#2A2E38;color:#fff;font-size:13.5px;padding:11px 16px;border-radius:12px;z-index:60;max-width:86%;text-align:center;box-shadow:0 6px 18px #000b;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.sugg{background:#20242D;border:1px solid var(--line);border-radius:0 0 12px 12px;margin-top:-10px;overflow:hidden}
.sugg div{padding:10px 12px;font-size:13.5px;color:var(--tx);border-top:1px solid var(--line);cursor:pointer}
.sw{position:relative;width:46px;height:26px;background:var(--fl);border-radius:13px;flex:0 0 46px;cursor:pointer;transition:.2s}
.sw.on{background:var(--grn)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:23px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv span{color:var(--gr)}
.hub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hub::-webkit-scrollbar{display:none}
.hub button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--gr);font-size:13px;font-weight:700;padding:9px 14px;border-radius:20px}
.hub button.on{background:var(--ord);border-color:var(--ord);color:#fff}

/* ================== ДЕСКТОП (шапка как у Авито) ================== */
#tophead{display:block;background:#12151B;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.toprow{background:#0E1116;border-bottom:1px solid var(--line)}
.tr-in{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:6px 14px;max-width:1280px;margin:0 auto}
.tlinks{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.tlinks button{background:none;color:var(--gr);font-size:12.5px;padding:6px 9px;border-radius:8px;position:relative}
.tlinks button:hover{color:var(--tx);background:var(--card)}
.tlinks button i{position:absolute;top:3px;right:4px;width:7px;height:7px;background:var(--or);border-radius:50%;display:none}
.tlinks button i.show{display:block}
.place{background:var(--ord)!important;color:#fff!important;font-weight:700;font-size:12.5px;padding:7px 13px!important;border-radius:8px;margin-right:6px}
.place:hover{background:var(--or)!important}
.uwrap{position:relative;margin-left:4px}
.uava{width:32px;height:32px;border-radius:50%;background:var(--ord);color:#fff;font-weight:700;border:0;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.umenu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:200px;padding:6px;z-index:50;box-shadow:0 14px 40px #000b}
.umenu b,.umenu a{display:block;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;color:var(--tx)}
.umenu b:hover{background:#2A2013;color:var(--or)}
.umenu a{color:var(--red)}
.umenu a:hover{background:#2d1113}
.citybtn{display:flex;align-items:center;gap:6px;background:none;color:var(--tx);font-size:13px;font-weight:600;padding:9px 10px;border-radius:9px;flex:0 0 auto;margin-left:2px}
.citybtn:hover{background:var(--card)}
.citybtn svg{width:14px;height:14px;fill:var(--or);flex:0 0 14px}
.tsrch-w{position:relative;flex:1;min-width:160px}
.mega{position:fixed;left:10px;right:10px;top:118px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;min-height:300px;max-height:62vh;box-shadow:0 18px 50px #000c;z-index:45;overflow:hidden}
.mega-l{width:280px;flex:0 0 280px;overflow-y:auto;border-right:1px solid var(--line);padding:8px}
.mega-l div{padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;color:var(--tx)}
.mega-l div.on,.mega-l div:hover{background:#2A2013;color:var(--or)}
.mega-r{flex:1;overflow-y:auto;padding:14px}
.mega-r div{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--gr);font-size:13.5px}
.mega-r div:hover{background:var(--card);color:var(--tx)}
.mega-r .ttl{font-size:11.5px;text-transform:uppercase;color:var(--g2);letter-spacing:.4px;padding-bottom:6px;cursor:default}
@media(min-width:800px){
  .app{max-width:none;box-shadow:none}
  #tophead{position:sticky}
  .mega{position:absolute;top:calc(100% + 6px);left:0;right:0}
  .tr-in{padding:7px 22px}
  .th-in{padding:10px 22px}
  .th-in{display:flex;align-items:center;gap:14px;padding:10px 22px;max-width:1280px;margin:0 auto}
  .th-in .slogo{display:flex;align-items:center;gap:10px;cursor:pointer;flex:0 0 auto}
  .th-in .slogo img{width:56px;height:56px;border-radius:13px;border:1px solid var(--line)}
  .th-in .slogo b{font-size:20px;display:block;line-height:1.1}
  .th-in .slogo span{color:var(--g2);font-size:12px}
  .tsrch{flex:1;display:flex;align-items:center;background:var(--field);border:1px solid var(--fl);border-radius:10px;padding:0 12px}
  .tsrch svg{width:16px;height:16px;fill:var(--g2);flex:0 0 16px}
  .tsrch input{flex:1;background:none;border:0;color:var(--tx);font-size:15.5px;padding:12px 8px}
  .tsrch input::placeholder{color:var(--g2)}
  .tnav{display:flex;gap:4px;flex:0 0 auto}
  .tsrch button{flex:0 0 auto;background:var(--ord);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:8px;margin-left:6px}
  .tsrch button:hover{background:var(--or)}
  .tnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--gr);font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:9px}
  .tnav button svg{width:19px;height:19px;fill:currentColor}
  .tnav button:hover{background:var(--card);color:var(--tx)}
  .tnav button.on{color:var(--or);background:#2A2013}
  .tnav button i{position:absolute;top:3px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--or);display:none}
  .tnav button i.show{display:block}
  .place{flex:0 0 auto;background:var(--ord);color:#fff;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:9px}
  .place:hover{background:var(--or)}
  .prof{display:flex;flex-direction:column;align-items:flex-end;margin-left:2px;line-height:1.3;flex:0 0 auto}
  .prof span{font-size:12.5px;color:var(--tx);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prof a{color:var(--g2);font-size:11.5px;cursor:pointer}
  .prof a:hover{color:var(--or)}
  .catrow{display:flex;gap:6px;overflow-x:auto;padding:8px 22px;max-width:1280px;margin:0 auto;scrollbar-width:none;border-top:1px solid var(--line)}
  .catrow::-webkit-scrollbar{display:none}
  .catrow button{flex:0 0 auto;background:none;border:1px solid transparent;color:var(--gr);font-size:13px;font-weight:600;padding:7px 12px;border-radius:18px}
  .catrow button:hover{color:var(--tx);background:var(--card)}
  .catrow button.on{background:var(--ord);color:#fff}
  #main{margin-left:0}
  .hdr,.nav{display:none!important}
  .scr .srch{display:none}
  .scr{padding:22px 30px 60px;max-width:1280px;margin:0 auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
  .mask{align-items:center;justify-content:center}
  .sheet{border-radius:16px;max-width:620px}
  .cbar{left:auto;right:44px;transform:none;bottom:30px;max-width:430px}
  .stats{grid-template-columns:repeat(4,1fr)}
  #auth{padding-top:6vh}
  .abox{width:470px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding-bottom:8px}
  .chatwrap{display:flex;height:100vh}
  .clist{width:330px;flex:0 0 330px;border-right:1px solid var(--line);overflow-y:auto;padding:14px}
  .clist .thr{margin-top:0;margin-bottom:10px}
  .clist .thr.on{border-color:var(--or)}
  .cpane{flex:1;display:flex;flex-direction:column;min-width:0}
  .cpane .chdr{display:flex;align-items:center;gap:11px;padding:12px 22px;border-bottom:1px solid var(--line)}
  .cpane .chdr .tt{flex:1;font-weight:700;font-size:15.5px}
  .cpane .msgs{flex:1;overflow-y:auto;padding:16px 26px}
  .cpane .ibar{position:static;transform:none;max-width:none;border:0;border-top:1px solid var(--line);background:var(--bg)}
  #catMenu{display:block;width:252px;flex:0 0 252px;position:sticky;top:142px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;max-height:calc(100vh - 170px);overflow-y:auto}
  .cm-item{display:block;width:100%;text-align:left;background:none;color:var(--tx);font-size:13.5px;font-weight:600;padding:9px 11px;border-radius:9px}
  .cm-item:hover{background:var(--field)}
  .cm-item.on{background:#2A2013;color:var(--or)}
  .cm-sub{display:block;width:100%;text-align:left;background:none;color:var(--gr);font-size:12.5px;font-weight:500;padding:6px 11px 6px 24px;border-radius:8px}
  .cm-sub:hover{color:var(--tx);background:var(--field)}
  .cm-sub.on{color:var(--or);font-weight:700}

<script>
/* ================== КОНСТАНТЫ ================== */
var SB='https://wdxdeatphizclskfmfxi.supabase.co';
var KEY='sb_publishable_dtRaEHNNPBFbHFvg8hw9iA_FqJSz9BE';
var SKLAD={lat:47.4526182,lon:40.1008652};
var OWNER_EMAIL='eclips.ru@mail.ru';
var DELIV_PER_KM=40;
var S={city:'',tok:null,ref:null,exp:0,me:'',uname:'',uphone:'',admin:null,tools:[],cats:[],subs:[],limited:[],likes:{},cart:{},screen:'home',cat:'',sub:'',q:'',chatWith:null,pollT:null,days:1,delivery:false,daddr:'',dkm:0,dsum:0,cabTab:'tools',ordTab:'act'};
function $(id){return document.getElementById(id)}
function esc(s){return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function m(x){x=Math.round(x||0);return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+' \u20BD'}
function pad(n){return n<10?'0'+n:''+n}
function pdate(dt){var s=String(dt).replace(' ','T');if(s.slice(-3)==='+00')s+=':00';return new Date(s)}
function nice(dt){if(!dt)return '';var d=pdate(dt);if(isNaN(d))return dt;return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dayKey(dt){var d=pdate(dt);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},2600)}
function cset(k,d){try{localStorage.setItem('iva_'+k,JSON.stringify({t:Date.now(),d:d}))}catch(e){}}
function cget(k,ttl){try{var x=JSON.parse(localStorage.getItem('iva_'+k)||'null');return (x&&Date.now()-x.t<ttl)?x.d:null}catch(e){return null}}
function cdel(k){try{localStorage.removeItem('iva_'+k)}catch(e){}}

/* ================== API ================== */
function rerr(t){try{var j=JSON.parse(t);return j.message||j.error_description||j.msg||t}catch(e){return t}}
async function api(path,method,body){
  if(!S.tok)throw new Error('Нужен вход');
  var h={'apikey':KEY,'Content-Type':'application/json','Authorization':'Bearer '+S.tok};
  var r=await fetch(SB+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401){await refreshTok();h['Authorization']='Bearer '+S.tok;r=await fetch(SB+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined})}
  var t=await r.text();
  if(!r.ok)throw new Error(rerr(t));
  return t?JSON.parse(t):null;
}
async function refreshTok(){
  var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.ref})});
  if(!r.ok)throw new Error('Сессия истекла');
  var j=await r.json();saveAuth(j);
}
function saveAuth(j){
  S.tok=j.access_token;S.ref=j.refresh_token;S.exp=Date.now()+(j.expires_in||3600)*1000;
  var u=j.user||{};
  S.me=(u.email||'').toLowerCase();
  var md=u.user_metadata||{};
  S.uname=md.full_name||md.name||'';
  S.uphone=md.phone||'';
  try{localStorage.setItem('iva_auth',JSON.stringify({tok:S.tok,ref:S.ref,exp:S.exp}))}catch(e){}
}
async function authCall(path,method,body,noAuth){
  var h={'apikey':KEY,'Content-Type':'application/json'};
  if(!noAuth&&S.tok)h['Authorization']='Bearer '+S.tok;
  var r=await fetch(SB+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  var t=await r.text();
  if(!r.ok)throw new Error(rerr(t));
  return t?JSON.parse(t):null;
}

/* ================== ВХОД ================== */
var regMode=false;
$('authTabs').onclick=function(e){var s=e.target.getAttribute('data-t');if(!s)return;setReg(s==='up')};
function setReg(up){regMode=up;
  $('regFlds').classList.toggle('hide',!up);
  $('fgt').classList.toggle('hide',up);
  $('authBtn').textContent=up?'Создать аккаунт':'Войти';
  $('authSwitch').textContent=up?'У меня есть аккаунт':'Создать аккаунт';
  var sp=document.querySelectorAll('#authTabs span');
  sp[0].classList.toggle('on',!up);sp[1].classList.toggle('on',up);
  $('authErr').style.display='none';
}
$('authSwitch').onclick=function(){setReg(!regMode)};
$('fgt').onclick=async function(){
  var em=$('aEmail').value.trim();if(!em){toast('Введите email');return}
  try{await fetch(SB+'/auth/v1/recover',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em})});toast('Ссылка для смены пароля отправлена на '+em)}catch(e){toast('Не удалось отправить')}
};
$('authBtn').onclick=async function(){
  var b=$('authBtn'),em=$('aEmail').value.trim().toLowerCase(),pw=$('aPass').value;
  var err=$('authErr');err.style.display='none';
  if(!em||!pw){err.textContent='Введите email и пароль';err.style.display='block';return}
  b.textContent='Подождите…';b.disabled=true;
  try{
    if(regMode){
      var nm=$('rName').value.trim(),ls=$('rLast').value.trim(),ph=$('rPhone').value.trim();
      if(!nm){throw new Error('Укажите имя')}
      var full=(ls+' '+nm).trim();
      var j=await authCall('/auth/v1/signup','POST',{email:em,password:pw,data:{full_name:full,name:nm,phone:ph}});
      if(j&&j.access_token){saveAuth(j);await enter()}
      else{b.textContent='Создать аккаунт';b.disabled=false;toast(j&&j.user?'Аккаунт создан. Если письмо с подтверждением пришло — подтвердите email и войдите.':'Аккаунт создан, войдите');setReg(false);return}
    }else{
      var j2=await authCall('/auth/v1/token?grant_type=password','POST',{email:em,password:pw},true);
      saveAuth(j2);await enter();
    }
  }catch(e){err.textContent=e.message;err.style.display='block'}
  b.textContent=regMode?'Создать аккаунт':'Войти';b.disabled=false;
};
$('aPass').addEventListener('keydown',function(e){if(e.key==='Enter')$('authBtn').click()});
function doLogout(){
  if(!confirm('Выйти из аккаунта?'))return;
  S.tok=null;S.ref=null;S.admin=null;S.cart={};S.likes={};
  try{localStorage.removeItem('iva_auth')}catch(e){}
  if(S.pollT){clearInterval(S.pollT);S.pollT=null}
  $('main').classList.add('hide');$('tophead').classList.add('hide');$('auth').classList.remove('hide');setReg(false);
}
$('btnOut').onclick=doLogout;$('btnOut2').onclick=doLogout;

/* ================== СТАРТ ================== */
(async function boot(){
  try{
    var a=JSON.parse(localStorage.getItem('iva_auth')||'null');
    if(a&&a.tok){S.tok=a.tok;S.ref=a.ref;S.exp=a.exp;
      try{var u=await authCall('/auth/v1/user','GET',null);S.me=(u.email||'').toLowerCase();var md=u.user_metadata||{};S.uname=md.full_name||md.name||'';S.uphone=md.phone||'';}
      catch(e){await refreshTok()}
    }
  }catch(e){}
  if(S.tok){enter()}else{setTimeout(function(){$('splash').classList.add('hide');$('auth').classList.remove('hide')},400)}
})();
async function enter(){
  $('splash').classList.add('hide');$('auth').classList.add('hide');$('main').classList.remove('hide');$('tophead').classList.remove('hide');
  $('whoami').textContent=S.uname||S.me;
  var cl2=$('cityName');if(cl2)cl2.textContent=S.city||'Новочеркасск';
  setUava();
  updPlace();
  var ac=cget('admins',300000);
  if(ac){S.admin=findMe(ac)}else{loadAdmins()}
  try{
    var arr=await api('/rest/v1/admins?select=email,role,active,fee_pct,debt_limit,full_name,company,phone,address,org_address,work_hours,avatar&email=eq.'+encodeURIComponent(S.me));
    if(arr&&arr.length){S.admin=arr[0];var lst=cget('admins',300000)||[];lst=lst.filter(function(x){return (x.email||'').toLowerCase()!==S.me});lst.push(S.admin);cset('admins',lst)}
  }catch(e){}
  go('home');
  loadBase();
  if(S.admin)loadUnread();
}
function findMe(lst){for(var i=0;i<lst.length;i++){if((lst[i].email||'').toLowerCase()===S.me)return lst[i]}return null}
async function loadAdmins(){
  try{var a=await api('/rest/v1/admins?select=email,role,active,fee_pct,debt_limit,full_name,company,phone,address,org_address,work_hours,avatar');cset('admins',a);if(!S.admin)S.admin=findMe(a);setUava();updPlace()}catch(e){}
}
async function loadBase(){
  var c=cget('base',180000);
  if(c){S.tools=c.tools;S.cats=c.cats;S.subs=c.subs;S.limited=c.limited;renderMega();if(S.screen==='home')go('home');loadLikes()}
  try{
    var tl=await api('/rest/v1/tools?select=*&active=eq.true&order=sort.asc.nullslast,created_at.desc&limit=500');
    var cl=await api('/rest/v1/cats?select=*&active=eq.true&order=sort.asc.nullslast');
    var sc=await api('/rest/v1/subcats?select=*&active=eq.true&order=sort.asc.nullslast');
    var lm=await api('/rest/v1/limited_admins?select=email');
    S.tools=tl;S.cats=cl;S.subs=sc;S.limited=(lm||[]).map(function(x){return (x.email||'').toLowerCase()});
    cset('base',{tools:tl,cats:cl,subs:sc,limited:S.limited});
    renderMega();updPlace();
    if(S.screen==='home')go('home');
  }catch(e){if(!c)toast('Не удалось загрузить каталог: '+e.message)}
  loadLikes();
}
async function loadLikes(){
  if(!S.tok)return;
  try{var l=await api('/rest/v1/likes?select=tool_id&user_email=eq.'+encodeURIComponent(S.me));var o={};(l||[]).forEach(function(x){o[x.tool_id]=1});S.likes=o;if(S.screen==='home')go('home')}catch(e){}
}
async function toggleLike(id,el){
  try{
    if(S.likes[id]){await api('/rest/v1/likes?tool_id=eq.'+id+'&user_email=eq.'+encodeURIComponent(S.me),'DELETE');delete S.likes[id]}
    else{await api('/rest/v1/likes','POST',{tool_id:id,user_email:S.me});S.likes[id]=1}
    if(el)el.classList.toggle('on',!!S.likes[id]);
  }catch(e){toast('Не получилось: '+e.message)}
}
function isAdmin(){return !!S.admin}
function isChief(){return S.admin&&S.admin.role==='chief'}

/* ================== НАВИГАЦИЯ ================== */
var CITIES=['Новочеркасск','Ростов-на-Дону','Аксай','Батайск','Азов','Таганрог','Шахты','Новошахтинск','Красный Сулин','Волгодонск','Сальск','Миллерово'];

function setUava(){var u=$('uava');if(!u)return;var a=adminByMail(S.me);var av=a&&a.avatar;
  if(av)u.innerHTML='<img src="'+esc(av)+'" style="width:100%;height:100%;object-fit:cover">';
  else{var n=(S.uname||S.me||'?');u.innerHTML='<span style="font-size:14px">'+esc((n[0]||'?').toUpperCase())+'</span>'}}
function citySheet(){
  var h='<div class="sheet"><div class="grab"></div><h3>Выбор города</h3><div id="clst">';
  for(var i=0;i<CITIES.length;i++){var c=CITIES[i];var on=(c===S.city||(c==='Новочеркасск'&&!S.city));
    h+='<div class="kv" data-c="'+esc(c)+'" style="cursor:pointer"><span>'+esc(c)+'</span>'+(on?'<b style="color:var(--or)">✓</b>':'')+'</div>'}
  h+='</div><div class="hint" style="margin-top:10px">В Новочеркасске — весь каталог. По другим городам показываем инструменты с выдачей в этом городе.</div></div>';
  openLayer(h);
  $('clst').onclick=function(e){var d=e.target.closest('[data-c]');if(!d)return;
    S.city=d.getAttribute('data-c');if(S.city==='Новочеркасск')S.city='';
    try{localStorage.setItem('iva_city',S.city)}catch(x){}
    var cl=$('cityName');if(cl)cl.textContent=S.city||'Новочеркасск';
    closeLayer();S.cat='';S.sub='';S.favOnly=false;go('home');
    if(!S.city){toast('Показываем весь каталог');return}
    var lst=S.tools.filter(function(t){var a=adminByMail(t.owner_email);return a&&a.address&&a.address.toLowerCase().indexOf(S.city.toLowerCase())>=0});
    toast(lst.length?('Выдача в '+d.getAttribute('data-c')+': найдено '+lst.length):('В '+d.getAttribute('data-c')+' пока нет выдачи — показываем все'))}}
function closeMega(){var m=$('mega');if(m)m.classList.add('hide')}

  for(var i=0;i<S.cats.length;i++){var c=S.cats[i];h+='<div data-c="'+esc(c.key)+'" class="'+(S.cat===c.key?'on':'')+'">'+esc(c.title)+'</div>'}
  L.innerHTML=h;
  function fillR(k){var hh='';var ttl=k?catTitle(k):'Все категории';
    if(k)hh+='<div data-s="" style="color:var(--or);font-weight:700">Все объявления категории</div>';
    for(var j=0;j<S.subs.length;j++){var s2=S.subs[j];if(s2.cat!==k)continue;hh+='<div data-s="'+esc(s2.key)+'">'+esc(s2.title)+'</div>'}
    R.innerHTML='<div class="ttl">'+esc(ttl)+'</div>'+hh}
  fillR(S.cat||'');
  L.onmouseover=function(e){var d=e.target.closest('[data-c]');if(d)fillR(d.getAttribute('data-c'))};
  L.onclick=function(e){var d=e.target.closest('[data-c]');if(!d)return;S.cat=d.getAttribute('data-c');S.sub='';S.favOnly=false;closeMega();go('home')};
  R.onclick=function(e){var d=e.target.closest('[data-s]');if(!d||!d.getAttribute('data-s'))return;S.sub=d.getAttribute('data-s');closeMega();go('home')}}

function go(n){
  S.screen=n;if(S.pollT){clearInterval(S.pollT);S.pollT=null}
  if(n==='home')vHome();
  else if(n==='chat')vChat();
  else if(n==='orders')vOrders();
  else if(n==='cab')vCab();
  else if(n==='fav')vFav();
  else if(n==='cart')vCart();
  else if(n==='notif')vNotif();
  else if(n==='myads')vMyads();
  else if(n==='likes')vLikes();
  else if(n==='company')vCompany();
  window.scrollTo(0,0);
}

/* ================== ГЛАВНАЯ ================== */
function catTitle(key){for(var i=0;i<S.cats.length;i++)if(S.cats[i].key===key)return S.cats[i].title;return key}
function subTitle(cat,key){for(var i=0;i<S.subs.length;i++){var s=S.subs[i];if(s.cat===cat&&s.key===key)return s.title}for(var j=0;j<S.subs.length;j++)if(S.subs[j].key===key)return S.subs[j].title;return key}
function myTools(){var lm=S.limited||[];var city=(S.city||'').trim().toLowerCase();
  if(city&&city!=='новочеркасск'){var al=cget('admins',300000)||[];
    if(al.length)return S.tools.filter(function(t){var a=adminByMail(t.owner_email);var ad=((a&&a.address)||'').toLowerCase();return lm.indexOf((t.owner_email||'').toLowerCase())<0&&ad.indexOf(city)>=0})}
  return S.tools.filter(function(t){return lm.indexOf((t.owner_email||'').toLowerCase())<0})}
function updPlace(){var ab=document.querySelector('#tophead .place');if(!ab)return;
  var lim=S.limited.indexOf(S.me)>=0;
  ab.style.display=(isAdmin()&&!lim)?'':'none'}
function renderCatMenu(){var mm=$('catMenu');if(!mm)return;
  var h='<button class="cm-item'+((!S.cat&&!S.favOnly)?' on':'')+'" data-c="">Весь каталог</button>';
  for(var i=0;i<S.cats.length;i++){var c=S.cats[i];var on=S.cat===c.key;
    h+='<button class="cm-item'+(on?' on':'')+'" data-c="'+esc(c.key)+'">'+esc(c.title)+'</button>';
    if(on){for(var j=0;j<S.subs.length;j++){var s3=S.subs[j];if(s3.cat!==c.key)continue;
      h+='<button class="cm-sub'+(S.sub===s3.key?' on':'')+'" data-s="'+esc(s3.key)+'">'+esc(s3.title)+'</button>'}}}
  mm.innerHTML=h;
  mm.onclick=function(e){
    var c=e.target.closest('[data-c]');if(c){S.cat=c.getAttribute('data-c');S.sub='';S.favOnly=false;go('home');return}
    var s4=e.target.closest('[data-s]');if(s4){S.sub=s4.getAttribute('data-s');go('home')}}}
function renderCatRow(){var cr=$('catRow');if(!cr)return;var h='<button class="'+(S.cat===''?'on':'')+'" data-c="">Все</button>';for(var i=0;i<S.cats.length;i++){var c=S.cats[i];h+='<button class="'+(S.cat===c.key?'on':'')+'" data-c="'+esc(c.key)+'">'+esc(c.title)+'</button>'}cr.innerHTML=h;cr.onclick=function(e){var b=e.target.closest('[data-c]');if(!b)return;S.cat=b.getAttribute('data-c');S.sub='';S.favOnly=false;go('home')}}
function hdrSearch(){var tq=$('tq');if(!tq)return;tq.value=S.q;tq.oninput=function(){S.q=this.value;if(this.value.trim())S.favOnly=false;var g=$('grid');if(S.screen==='home'&&g){g.innerHTML=tilesHtml();var d=$('dash');if(d)d.innerHTML=dashInner()}else if(S.screen!=='home'&&this.value.trim())go('home')};
  var tf=$('tfind');if(tf)tf.onclick=function(){if(S.screen!=='home')go('home')}}
function vHome(){
  navOn('home');
  var h='<div class="scr"><div class="srch"><input id="q" placeholder="Поиск: дрель, сварка…" value="'+esc(S.q)+'" autocomplete="off"></div><div class="chips" id="chips">';
  h+='<button class="chip'+(S.cat===''?' on':'')+'" data-c="">Все</button>';
  for(var i=0;i<S.cats.length;i++){var c=S.cats[i];h+='<button class="chip'+(S.cat===c.key?' on':'')+'" data-c="'+esc(c.key)+'">'+esc(c.title)+'</button>'}
  h+='</div>';
  if(S.cat){h+='<div class="chips" id="subchips"><button class="chip'+(S.sub===''?' on':'')+'" data-s="">Все виды</button>';
    for(var j=0;j<S.subs.length;j++){var s2=S.subs[j];if(s2.cat!==S.cat)continue;h+='<button class="chip'+(S.sub===s2.key?' on':'')+'" data-s="'+esc(s2.key)+'">'+esc(s2.title)+'</button>'}
    h+='</div>'}
  h+='<div class="homeflex"><aside id="catMenu"></aside><div class="homecol">'+(S.favOnly?'<div class="sect">Избранное</div>':'<div id="dash">'+dashInner()+'</div>')+'<div class="grid" id="grid">'+tilesHtml()+'</div></div></div><div id="cbar"></div></div>';
  $('view').innerHTML=h;
  $('q').oninput=function(){S.q=this.value;var g=$('grid');if(g)g.innerHTML=tilesHtml()};
  renderCatRow();hdrSearch();
  renderCatMenu();
  var dd=$('dash');if(dd)dd.onclick=function(e){var c=e.target.closest('[data-c]');if(!c)return;S.favOnly=false;S.cat=c.getAttribute('data-c');S.sub='';go('home')};
  $('chips').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;S.cat=b.getAttribute('data-c');S.sub='';S.favOnly=false;go('home')};
  var sc2=$('subchips');if(sc2)sc2.onclick=function(e){var b=e.target.closest('.chip');if(!b)return;S.sub=b.getAttribute('data-s');go('home')};
  cartBar();
}
function iconForCat(k){k=(k||'').toLowerCase();
  if(k.indexOf('свар')>=0)return '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>';
  if(k.indexOf('электр')>=0||k.indexOf('power')>=0||k.indexOf('дрел')>=0||k.indexOf('перфор')>=0)return '<svg viewBox="0 0 24 24"><path d="M16 7V3h-2v4h-4V3H8v4H6v6a6 6 0 0 0 5 5.9V22h2v-3.1A6 6 0 0 0 18 13V7z"/></svg>';
  if(k.indexOf('бенз')>=0)return '<svg viewBox="0 0 24 24"><path d="M5 3h8a2 2 0 0 1 2 2v16h-2V11H7v10H5V3zm2 2v4h6V5H7zM17 7l4 4v6a2 2 0 0 1-4 0v-4h-2v-2h2V7z"/></svg>';
  if(k.indexOf('руч')>=0||k.indexOf('инструм')>=0)return '<svg viewBox="0 0 24 24"><path d="M15.5 2.5 21.5 8.5 19 11l-2-2-2 2-3-3 2-2-1.5-1.5zM10.6 9.4 14.6 13.4 5 23l-3-3z"/></svg>';
  if(k.indexOf('строй')>=0)return '<svg viewBox="0 0 24 24"><path d="M12 2 22 7v10l-10 5L2 17V7zm0 10L4.2 8 12 4.2 19.8 8z"/></svg>';
  if(k.indexOf('сад')>=0)return '<svg viewBox="0 0 24 24"><path d="M5 21c8 0 14-6 14-16-10 0-16 6-16 14 0 1 .1 1.6.2 2C3 21 3 21 5 21z"/></svg>';
  return '<svg viewBox="0 0 24 24"><path d="M21.7 18.3 14 10.6V8a6 6 0 0 0-8-5.7l3.6 3.6-2.8 2.8L3.2 5.1A6 6 0 0 0 8.9 13h2.5l7.7 7.7z"/></svg>'}
function dashInner(){if((S.q||'').trim()||S.cat||S.favOnly)return '';var h='<div class="sect">Категории</div><div class="catdash">';
  for(var i=0;i<S.cats.length;i++){var c=S.cats[i];h+='<div class="dcat" data-c="'+esc(c.key)+'"><span class="dic">'+iconForCat(c.key)+'</span><b>'+esc(c.title)+'</b></div>'}
  return h+'</div>'}
function tilesHtml(){
  var q=S.q.trim().toLowerCase(),out='';
  var list=myTools();
  for(var i=0;i<list.length;i++){var t=list[i];
    if(S.cat&&t.cat!==S.cat)continue;
    if(S.cat&&S.sub&&t.sub!==S.sub)continue;
    if(q&&(t.name+' '+(t.descr||'')).toLowerCase().indexOf(q)<0)continue;
    if(S.favOnly&&!S.likes[t.id])continue;
    var im=t.img?esc(t.img):'';
    out+='<div class="tile" data-id="'+t.id+'">'
      +(im?'<img class="ph" loading="lazy" src="'+im+'" alt="">':'<div class="ph"></div>')
      +'<span class="like'+(S.likes[t.id]?' on':'')+'" data-l="'+t.id+'"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.2C.4 8.7 2 5 5.6 5c2 0 3.4 1.1 4.2 2.4h4.4C15 6.1 16.4 5 18.4 5 22 5 23.6 8.7 22 11.8 19.5 16.1 12 21 12 21z"/></svg></span>'
      +'<div class="nm">'+esc(t.name)+'</div>'
      +'<div class="pr">'+m(t.price)+'<small>залог '+m(t.deposit)+'</small></div></div>';
  }
  if(!out)out='<div class="empt" style="grid-column:1/-1">Ничего не найдено</div>';
  return out;
}
document.addEventListener('click',function(e){
  var l=e.target.closest('.like');if(l){e.stopPropagation();toggleLike(l.getAttribute('data-l'),l);return}
  var t=e.target.closest('.tile');if(t){toolCard(t.getAttribute('data-id'))}
});
function tById(id){for(var i=0;i<S.tools.length;i++)if(S.tools[i].id===id)return S.tools[i];return null}

/* ---- карточка инструмента ---- */
function toolCard(id){
  var t=tById(id);if(!t)return;
  var imgs=[];
  if(t.imgs&&t.imgs.length)for(var i=0;i<t.imgs.length;i++)if(t.imgs[i])imgs.push(t.imgs[i]);
  if(!imgs.length&&t.img)imgs.push(t.img);
  var own=adminByMail(t.owner_email);
  var h='<div class="sheet"><div class="grab"></div>';
  if(imgs.length>1){h+='<div style="display:flex;gap:8px;overflow-x:auto">'+imgs.map(function(u){return '<img class="timg" style="min-width:82%;width:82%" src="'+esc(u)+'">'}.bind(null)).join('')+'</div>'}
  else{h+=imgs.length?'<img class="timg" src="'+esc(imgs[0])+'">':''}
  h+='<div class="rowline"><div><h3>'+esc(t.name)+'</h3></div><div class="price">'+m(t.price)+'</div></div>'
   +'<div class="hint">в сутки · залог '+m(t.deposit)+' (возвращается при возврате)</div>';
  if(t.descr)h+='<div class="sect">Описание</div><div class="txt">'+esc(t.descr)+'</div>';
  if(t.terms)h+='<div class="sect">Условия</div><div class="txt">'+esc(t.terms)+'</div>';
  if(own)h+='<div class="ownbox"><b style="color:var(--tx)">'+esc(own.full_name||own.company||'Владелец')+'</b><br>'
    +(own.address?'Адрес выдачи: '+esc(own.address)+'<br>':'')
    +(own.work_hours?esc(own.work_hours)+'<br>':'')
    +(own.phone?'Тел: '+esc(own.phone):'')+'</div>';
  if(t.delivery)h+='<div class="ownbox">Доставка: '+(t.delivery_price?('от '+m(t.delivery_price)):'по расчёту 40 \u20BD/км')+'</div>';
  h+='<div class="sect">Количество</div><div class="qty"><button data-q="-1">−</button><b id="qv">1</b><button data-q="1">+</button></div>'
   +'<div class="rowbtns" style="margin-top:16px"><button class="btn" style="flex:1" id="toCart">В корзину</button>'
   +'<button class="btn sec" id="toChat">Написать</button></div></div>';
  openLayer(h);
  var qv=$('qv'),qty=1;
  var btns=document.querySelectorAll('.qty button');
  btns[0].onclick=function(){if(qty>1)qty--;qv.textContent=qty};
  btns[1].onclick=function(){if(qty<20)qty++;qv.textContent=qty};
  $('toCart').onclick=function(){S.cart[id]=(S.cart[id]||0)+qty;closeLayer();cartBar();toast('Добавлено в корзину')};
  $('toChat').onclick=function(){closeLayer();openChatWith(t.owner_email||OWNER_EMAIL,'Вопрос по инструменту: «'+t.name+'»')};
}
function adminByMail(em){var lst=cget('admins',300000)||[];em=(em||'').toLowerCase();for(var i=0;i<lst.length;i++)if((lst[i].email||'').toLowerCase()===em)return lst[i];return null}

/* ---- корзина / оформление ---- */
function cartCount(){var n=0;for(var k in S.cart)n+=S.cart[k];return n}
function cartBar(){
  var cd=$('cartDot');if(cd)cd.classList.toggle('show',cartCount()>0);
  var el=$('cbar');if(!el)return;
  var n=cartCount();
  if(!n){el.innerHTML='';return}
  var rent=0,dep=0;
  for(var id in S.cart){var t=tById(id);if(!t)continue;rent+=(t.price||0)*S.cart[id];dep+=(t.deposit||0)*S.cart[id]}
  el.innerHTML='<span>'+n+' инстр. · '+m(rent*S.days)+' / сут.</span><span>Оформить →</span>';
  el.onclick=orderSheet;
}
function orderSheet(){
  if(!cartCount()){toast('Корзина пуста');return}
  var pre='',fio=(S.uname||'').split(' ');
  var h='<div class="sheet"><div class="grab"></div><h3>Оформление заявки</h3>'
   +'<span class="lbl">Фамилия</span><input class="inp" id="oLast" autocomplete="off" value="'+esc(fio[0]||'')+'">'
   +'<span class="lbl">Имя</span><input class="inp" id="oName" autocomplete="off" value="'+esc(fio[1]||'')+'">'
   +'<span class="lbl">Отчество</span><input class="inp" id="oPatr" autocomplete="off">'
   +'<span class="lbl">Телефон</span><input class="inp" id="oPhone" value="'+esc(S.uphone||'')+'">'
   +'<span class="lbl">Срок аренды (дней)</span><div class="qty"><button id="dm">−</button><b id="dv">'+S.days+'</b><button id="dp">+</button></div>'
   +'<div class="tabs" style="margin-top:16px"><span class="on" data-m="0">Самовывоз</span><span data-m="1">Доставка</span></div>'
   +'<div id="dbox" class="hide"><input class="inp" id="oAddr" placeholder="Адрес доставки: улица, дом, город" autocomplete="off"><div id="sugg" class="sugg hide"></div><div class="hint" id="dtxt">40 \u20BD/км за каждый инструмент — рассчитаем по адресу</div></div>'
   +'<span class="lbl">Комментарий (необязательно)</span><textarea class="inp" id="oCmt" placeholder="Ваши пожелания"></textarea>'
   +'<div class="card" id="receipt" style="margin-top:14px"></div>'
   +'<button class="big" id="oSend">Отправить заявку</button></div>';
  openLayer(h);
  var meth=0;
  var tabs=document.querySelectorAll('#dbox')[0];
  document.querySelectorAll('.sheet .tabs span').forEach(function(sp){
    sp.onclick=function(){
      document.querySelectorAll('.sheet .tabs span').forEach(function(x){x.classList.remove('on')});
      sp.classList.add('on');meth=+sp.getAttribute('data-m');
      $('dbox').classList.toggle('hide',!meth);receiptUpd();
    };
  });
  $('dm').onclick=function(){if(S.days>1){S.days--;$('dv').textContent=S.days;receiptUpd()}};
  $('dp').onclick=function(){if(S.days<30){S.days++;$('dv').textContent=S.days;receiptUpd()}};
  var addr=$('oAddr'),tmr=null;
  addr.oninput=function(){clearTimeout(tmr);var v=this.value.trim();tmr=setTimeout(function(){if(v.length>4)photon(v);else $('sugg').classList.add('hide')},400);S.daddr=v;S.dkm=0;S.dsum=0;$('dtxt').textContent='40 \u20BD/км за каждый инструмент — рассчитаем по адресу';receiptUpd()};
  addr.onblur=function(){setTimeout(receiptUpd,300)};
  S._rupd=receiptUpd;
  $('oCmt').oninput=receiptUpd;
  function receiptUpd(){
    var rent=0,dep=0;
    for(var id in S.cart){var t=tById(id);if(!t)continue;rent+=(t.price||0)*S.cart[id];dep+=(t.deposit||0)*S.cart[id]}
    var dsum=(meth&&S.dsum)?S.dsum:0;
    $('receipt').innerHTML='<b style="font-size:13px;color:var(--gr)">ПРЕДВАРИТЕЛЬНЫЙ ЧЕК</b>'
      +Object.keys(S.cart).map(function(id){var t=tById(id);return '<div class="kv"><span>'+esc(t.name)+' ×'+S.cart[id]+'</span><b>'+m((t.price||0)*S.cart[id])+'</b></div>'}).join('')
      +'<div class="kv"><span>Аренда × '+S.days+' дн.</span><b>'+m(rent*S.days)+'</b></div>'
      +'<div class="kv"><span>Залог (возвратный)</span><b>'+m(dep)+'</b></div>'
      +(meth?'<div class="kv"><span>Доставка</span><b>'+(S.dsum?m(S.dsum):'по расчёту')+'</b></div>':'')
      +'<div class="kv" style="border:0"><span><b style="color:var(--tx)">ИТОГО к старту</b></span><b style="color:var(--or)">'+m(rent*S.days+dep+dsum)+'</b></div>';
  }
  receiptUpd();
  $('oSend').onclick=async function(){
    var last=$('oLast').value.trim(),nm=$('oName').value.trim(),patr=$('oPatr').value.trim();
    var phone=$('oPhone').value.trim(),cmt=$('oCmt').value.trim();
    if(!nm||!phone){toast('Укажите имя и телефон');return}
    if(meth&&!S.daddr){toast('Укажите адрес доставки');return}
    var full=(last+' '+nm+' '+patr).trim().replace(/ +/g,' ');
    var tshort=[],receipt='— — — ЧЕК (предварительно) — — —\n';var rent=0,dep=0;
    for(var id in S.cart){var t=tById(id);if(!t)continue;
      tshort.push(t.name+' ×'+S.cart[id]);
      rent+=(t.price||0)*S.cart[id];dep+=(t.deposit||0)*S.cart[id];
      receipt+='• '+t.name+' ×'+S.cart[id]+((t.price||0)>0?' — '+m(t.price)+' \u20BD':'')+'\n';
    }
    receipt+='Срок: '+S.days+' дн.\nАренда: '+m(rent*S.days)+' \u20BD\nЗалог (возвращается при возврате и проверке инструмента): '+m(dep)+' \u20BD\n';
    var gm=meth?('Доставка: '+S.daddr+(S.dkm?(' — '+Math.ceil(S.dkm)+' км — '+m(S.dsum)+' \u20BD'):'')):'Самовывоз, ул. Маресьева, 36';
    receipt+=(meth?'Доставка: '+(S.dsum?m(S.dsum)+' \u20BD':'рассчитаем при подтверждении')+'\n':'Доставка: самовывоз\n');
    receipt+='ИТОГО: '+m(rent*S.days+dep+(meth&&S.dsum?S.dsum:0))+' \u20BD';
    var comment=cmt?(cmt+'\n\n'+receipt):receipt;
    var b=$('oSend');b.textContent='Отправляем…';b.disabled=true;
    try{
      await api('/rest/v1/rpc/submit_order','POST',{p_name:full,p_phone:phone,p_tools:tshort.join(', '),p_get_method:gm,p_address:meth?S.daddr:'',p_comment:comment,p_user_email:S.me,p_days:S.days});
      S.cart={};S.days=1;closeLayer();cartBar();toast('Заявка отправлена! Мы свяжемся с вами');go('orders');
    }catch(e){b.textContent='Отправить заявку';b.disabled=false;toast('Не удалось отправить: '+e.message)}
  };
}
async function photon(q){
  try{
    var u='https://photon.komoot.io/api/?q='+encodeURIComponent(q+', Новочеркасск')+'&lang=ru&lat='+SKLAD.lat+'&lon='+SKLAD.lon+'&limit=5';
    var r=await fetch(u);var j=await r.json();var f=j.features||[];
    var sg=$('sugg');if(!sg)return;
    if(!f.length){sg.classList.add('hide');return}
    sg.innerHTML=f.map(function(ft,i){
      var p=ft.properties||[];
      var lbl=[p.name,p.city||p.district,p.state].filter(Boolean).join(', ');
      return '<div data-i="'+i+'">'+esc(lbl)+'</div>';
    }).join('');
    sg.classList.remove('hide');
    sg.onclick=function(e){
      var d=e.target.closest('[data-i]');if(!d)return;
      var ft=f[+d.getAttribute('data-i')];
      var p=ft.properties||{};
      var lbl=[p.name,p.city||p.district,p.state].filter(Boolean).join(', ');
      $('oAddr').value=lbl;S.daddr=lbl;
      var c=ft.geometry&&ft.geometry.coordinates;
      if(c){var km=hav(SKLAD.lat,SKLAD.lon,c[1],c[0]);S.dkm=km;S.dsum=Math.max(1,Math.ceil(km))*DELIV_PER_KM*cartCount();
        $('dtxt').textContent=Math.ceil(km)+' км × '+DELIV_PER_KM+' \u20BD × '+cartCount()+' инстр. = '+m(S.dsum)+' \u20BD'}
      sg.classList.add('hide');if(S._rupd)S._rupd();
    };
  }catch(e){}
}
function hav(a1,o1,a2,o2){var R=6371,dLa=(a2-a1)*Math.PI/180,dLo=(o2-o1)*Math.PI/180;var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}

/* ---- модалки ---- */
function openLayer(h){$('layer').innerHTML='<div class="mask" id="mask"><div class="sheet-wrap">'+h+'</div></div>';
  $('mask').onclick=function(e){if(e.target.id==='mask')closeLayer()};
}
function closeLayer(){$('layer').innerHTML=''}
</script>
<script>
/* ================== ЗАЯВКИ ================== */
function badge(st){var s=st||'new';var t=s==='new'?'Новая':(s==='rented'?'В аренде':'Закрыта');return '<span class="badge b-'+s+'">'+t+'</span>'}
function vOrders(){
  navOn('orders');

async function upPhoto(file,cb){
  if(!/^image\//.test(file.type)){toast('Это не изображение');return}
  toast('Загружаем фото…');
  try{
    var img=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){rej(new Error('файл не читается'))};i.src=URL.createObjectURL(file)});
    var mx=1280,sc=Math.min(1,mx/Math.max(img.width,img.height));
    var cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    var blob=await new Promise(function(res){cv.toBlob(res,'image/jpeg',0.82)});
    var path='w/'+Date.now()+'_'+Math.floor(Math.random()*1e6)+'.jpg';
    var r=await fetch(SB+'/storage/v1/object/iva/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.tok,'Content-Type':'image/jpeg'},body:blob});
    if(!r.ok){var t=await r.text();throw new Error(rerr(t))}
    cb(SB+'/storage/v1/object/public/iva/'+path);
  }catch(e){toast('Не удалось загрузить фото: '+e.message)}
}

async function cabInc(){
  var b=$('cabBody');b.innerHTML='<div class="empt">Загрузка…</div>';
  try{
    var own=isChief()?'':'&owner_email=eq.'+encodeURIComponent(S.me);
    var parts=await api('/rest/v1/order_parts?select=fee,rent_sum,created_at,owner_email&limit=1000'+own);
    var pays=await api('/rest/v1/fee_payments?select=amount,status'+(isChief()?'':'&admin_email=eq.'+encodeURIComponent(S.me)));
    var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),w0=t0-6*864e5,m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    function ms(dt){return new Date(String(dt).replace(' ','T').replace('+00','+00:00')).getTime()}
    var per={d:[0,0,0],w:[0,0,0],mo:[0,0,0],a:[0,0,0]};
    (parts||[]).forEach(function(p){
      var t=ms(p.created_at),r=p.rent_sum||0,f=p.fee||0;
      var arr=[r,f,r-f];
      if(t>=t0)for(var i=0;i<3;i++)per.d[i]+=arr[i];
      if(t>=w0)for(var i2=0;i2<3;i2++)per.w[i2]+=arr[i2];
      if(t>=m0)for(var i3=0;i3<3;i3++)per.mo[i3]+=arr[i3];
      for(var i4=0;i4<3;i4++)per.a[i4]+=arr[i4];
    });
    var paid=0;(pays||[]).forEach(function(p){if(p.status==='confirmed')paid+=p.amount||0});
    var feeAll=per.a[1],debt=Math.max(0,feeAll-paid);
    function box(k,v,neg){return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(neg?'':'')+'">'+v+'</div></div>'}
    b.innerHTML='<div class="sect">Доход за периоды</div>'
    +'<div class="stats">'
    +box('Сегодня','Выручка '+m(per.d[0])+'<br><small style="font-weight:500;color:var(--gr)">Комиссия '+m(per.d[1])+' · чистыми '+m(per.d[2])+'</small>')
    +box('7 дней','Выручка '+m(per.w[0])+'<br><small style="font-weight:500;color:var(--gr)">Комиссия '+m(per.w[1])+' · чистыми '+m(per.w[2])+'</small>')
    +box('Этот месяц','Выручка '+m(per.mo[0])+'<br><small style="font-weight:500;color:var(--gr)">Комиссия '+m(per.mo[1])+' · чистыми '+m(per.mo[2])+'</small>')
    +box('За всё время','Выручка '+m(per.a[0])+'<br><small style="font-weight:500;color:var(--gr)">Комиссия '+m(per.a[1])+' · чистыми '+m(per.a[2])+'</small>')
    +'</div>'
    +'<div class="card" style="margin-top:14px"><div class="top"><b>Комиссия</b><span class="dt">'+(isChief()?'все админы':'по вашим заявкам')+'</span></div>'
    +'<div class="kv"><span>Начислено всего</span><b>'+m(feeAll)+'</b></div>'
    +'<div class="kv"><span>Оплачено</span><b class="pos">'+m(paid)+'</b></div>'
    +'<div class="kv" style="border:0"><span>'+(debt>0?'К оплате':'Задолженности нет')+'</span><b class="'+(debt>0?'neg':'pos')+'">'+(debt>0?('−'+m(debt)):'0 \u20BD')+'</b></div>'
    +'<button class="btn" style="width:100%;margin-top:10px" id="payFee">Оплатить комиссию</button>'
    +'<div class="hint" style="text-align:center">Автооплата ЮKassa подключается после выпуска ключей</div></div>';
    $('payFee').onclick=function(){toast(debt>0?'Оплата комиссии появится сразу после подключения ЮKassa':'Задолженности нет')};
  }catch(e){b.innerHTML='<div class="empt">Ошибка: '+esc(e.message)+'</div>'}
}

async function cabAdms(){
  var b=$('cabBody');b.innerHTML='<div class="empt">Загрузка…</div>';
  try{
    var adms=await api('/rest/v1/admins?select=email,role,active,fee_pct,debt_limit,full_name,company&order=created_at.asc');
    var parts=await api('/rest/v1/order_parts?select=owner_email,fee&limit=2000');
    var pays=await api('/rest/v1/fee_payments?select=admin_email,amount,status&status=eq.confirmed');
    function debt(em){em=(em||'').toLowerCase();var f=0;(parts||[]).forEach(function(p){if((p.owner_email||'').toLowerCase()===em)f+=p.fee||0});var pd=0;(pays||[]).forEach(function(p){if((p.admin_email||'').toLowerCase()===em)pd+=p.amount||0});return Math.max(0,f-pd)}
    var h='<button class="btn" style="width:100%;margin-top:12px" id="addA">＋ Добавить администратора</button>';
    h+=(adms||[]).map(function(a){
      var d=debt(a.email),lim=a.debt_limit||0,blocked=lim>0&&d>lim;
      return '<div class="card" data-e="'+esc(a.email)+'" style="cursor:pointer"><div class="top"><b>'+esc(a.full_name||a.company||a.email)+'</b>'
      +'<span class="badge '+(a.active!==false?'b-new':'b-closed')+'">'+(a.role==='chief'?'Владелец':(a.active!==false?'Активен':'Выкл'))+'</span></div>'
      +'<div class="hint">'+esc(a.email)+'</div>'
      +'<div class="hint">Комиссия '+(a.fee_pct!=null?a.fee_pct:'—')+'% · лимит '+(lim?m(lim):'—')+'</div>'
      +(d>0?'<div class="hint" style="color:var(--red)">Долг: −'+m(d)+(blocked?' · ДОСТУП ОГРАНИЧЕН':'')+'</div>':'')
      +'</div>';
    }).join('');
    b.innerHTML=h;
    $('addA').onclick=function(){admForm(null)};
    b.onclick=function(e){var c=e.target.closest('[data-e]');if(c)admForm(c.getAttribute('data-e'),adms)};
  }catch(e){b.innerHTML='<div class="empt">Ошибка: '+esc(e.message)+'</div>'}
}
function admForm(em,adms){
  var a=null;
  if(em){adms=(adms||[]).concat(cget('admins',300000)||[]);for(var i=0;i<adms.length;i++)if((adms[i].email||'').toLowerCase()===(em||'').toLowerCase())a=adms[i]}
  var h='<div class="sheet"><div class="grab"></div><h3>'+(a?'Администратор':'Новый администратор')+'</h3>'
  +(a?'<div class="hint">'+esc(a.email)+'</div>':'<span class="lbl">Email *</span><input class="inp" id="aE" placeholder="admin@mail.ru">')
  +'<span class="lbl">ФИО</span><input class="inp" id="aF" value="'+esc(a?a.full_name||'':'')+'">'
  +'<span class="lbl">Комиссия, %</span><input class="inp" id="aP" type="number" value="'+(a&&a.fee_pct!=null?a.fee_pct:'')+'">'
  +'<span class="lbl">Лимит долга, ₽ (0 — без блокировки)</span><input class="inp" id="aL" type="number" value="'+(a&&a.debt_limit!=null?a.debt_limit:0)+'">'
  +'<div class="kv"><span>Доступ включён</span><span class="sw'+(!a||a.active!==false?' on':'')+'" id="aOn"><i></i></span></div>'
  +'<button class="big" id="aSave">Сохранить</button>'
  +'<div class="hint" style="margin-top:8px">Изменения комиссии действуют для новых заявок.</div></div>';
  openLayer(h);
  $('aOn').onclick=function(){this.classList.toggle('on')};
  $('aSave').onclick=async function(){
    var btn=$('aSave');btn.textContent='Сохраняем…';btn.disabled=true;
    try{
      var body={full_name:$('aF').value.trim(),fee_pct:+$('aP').value||0,debt_limit:+$('aL').value||0,active:$('aOn').classList.contains('on')};
      if(a)await api('/rest/v1/admins?email=eq.'+encodeURIComponent(a.email),'PATCH',body);
      else{
        var em=$('aE').value.trim().toLowerCase();
        if(!em){toast('Укажите email');btn.textContent='Сохранить';btn.disabled=false;return}
        body.email=em;body.role='admin';
        await api('/rest/v1/admins','POST',body);
      }
      cdel('admins');cdel('base');closeLayer();toast('Сохранено');cabAdms();
    }catch(e){btn.textContent='Сохранить';btn.disabled=false;toast('Ошибка: '+e.message)}
  };
}

function vCart(){
  navOn('cart');

  if(!n)h+='<div class="empt">Корзина пуста.<br>Добавьте инструменты из каталога</div>';
  else{
    var rent=0,dep=0,rows='';
    for(var id in S.cart){var t=tById(id);if(!t)continue;
      rent+=(t.price||0)*S.cart[id];dep+=(t.deposit||0)*S.cart[id];
      rows+='<div class="card" style="display:flex;gap:10px;align-items:center">'
      +(t.img?'<img src="'+esc(t.img)+'" style="width:56px;height:56px;border-radius:10px;object-fit:cover">':'<div style="width:56px;height:56px;border-radius:10px;background:var(--field)"></div>')

      +'<div class="qty" style="margin-top:6px;padding:4px 10px"><button data-d="'+id+'">−</button><b>'+S.cart[id]+'</b><button data-i="'+id+'">+</button></div></div>'
      +'<button class="btn sm sec" data-r="'+id+'">×</button></div>'}
    h+=rows
    +'<div class="card"><div class="kv"><span>Аренда за сутки</span><b>'+m(rent)+'</b></div><div class="kv" style="border:0"><span>Залог (возвратный)</span><b>'+m(dep)+'</b></div></div>'
    +'<button class="big" id="cartGo">Оформить заявку</button>';
  }
  h+='</div>';
  $('view').innerHTML=h;
  var vw=$('view');
  vw.onclick=function(e){
    var d=e.target.closest('[data-d]'),i2=e.target.closest('[data-i]'),r=e.target.closest('[data-r]');
    if(d){var id1=d.getAttribute('data-d');S.cart[id1]--;if(S.cart[id1]<=0)delete S.cart[id1];vCart();return}
    if(i2){var id2=i2.getAttribute('data-i');S.cart[id2]=(S.cart[id2]||0)+1;if(S.cart[id2]>20)S.cart[id2]=20;vCart();return}
    if(r){delete S.cart[r.getAttribute('data-r')];vCart();return}
    if(e.target.id==='cartGo')orderSheet();
  };
}
