<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пароль — Ива</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css?v=20260924-app-banner-v2">
<style>
.rp-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r-l);padding:24px;max-width:460px;margin:40px auto}
.rp-card h1{font-size:22px;margin:0 0 8px}
.rp-card label{display:block;margin:14px 0 6px;font-size:14px}
.rp-msg{margin-top:14px;font-size:14.5px;line-height:1.5}
.rp-msg.err{color:var(--red)}
.rp-msg.ok{color:var(--grn)}
</style>
</head>
<body>
<main class="page">
  <div class="wrap">
    <div class="rp-card" id="rp">
      <h1>Новый пароль</h1>
      <p class="muted small" id="rpLead">Загрузка…</p>
      <form id="rpForm" hidden>
        <label for="p1">Новый пароль</label>
        <input class="inp" id="p1" type="password" autocomplete="new-password" minlength="6" required>
        <label for="p2">Повторите пароль</label>
        <input class="inp" id="p2" type="password" autocomplete="new-password" minlength="6" required>
        <button class="btn wide" id="rpBtn" type="submit" style="margin-top:18px">Сохранить пароль</button>
      </form>
      <div class="rp-msg" id="rpMsg" role="status"></div>
      <p class="small muted" id="rpAfter" hidden style="margin-top:16px">
        Теперь войдите с новым паролем — в приложении «Ива» или на сайте:
        <a class="btn sm" href="cabinet.html" style="margin-top:10px">Войти на сайте</a>
      </p>
    </div>
  </div>
</main>
<script>
/* Баг владельца 04.10.2026: ссылка из письма «восстановить пароль» вела на главную.
   Эта страница принимает ключ из ссылки (#access_token=…&type=recovery) и меняет пароль
   запросом PUT /auth/v1/user. Ключ сразу убирается из адресной строки и никуда не сохраняется. */
(function () {
  var SB = 'https://wdxdeatphizclskfmfxi.supabase.co';
  var KEY = 'sb_publishable_dtRaEHNNPBFbHFvg8hw9iA_FqJSz9BE'; // публичный ключ сайта (как в assets/sb.js)
  var $ = function (id) { return document.getElementById(id); };
  var q = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
  });
  if (location.hash) history.replaceState(null, '', location.pathname); // ключ — прочь из адреса
  var token = q.access_token || '';
  var EXPIRED = 'Ссылка устарела или уже использована. Запросите новую: в приложении или на сайте → «Вход» → «Забыли пароль».';

  function msg(t, cls) { var m = $('rpMsg'); m.textContent = t; m.className = 'rp-msg ' + (cls || ''); }

  if (q.error || q.error_code) { $('rpLead').textContent = ''; msg(EXPIRED, 'err'); $('rpAfter').hidden = false; return; }
  if (!token || q.type !== 'recovery') {
    $('rpLead').textContent = 'Эта страница открывается по ссылке из письма «восстановить пароль».';
    msg('Чтобы получить письмо: в приложении или на сайте → «Вход» → «Забыли пароль».');
    $('rpAfter').hidden = false; return;
  }
  $('rpLead').textContent = 'Придумайте новый пароль — не короче 6 символов.';
  $('rpForm').hidden = false; $('p1').focus();

  $('rpForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var p1 = $('p1').value, p2 = $('p2').value;
    if (p1.length < 6) { msg('Пароль должен быть не короче 6 символов.', 'err'); return; }
    if (p1 !== p2) { msg('Пароли не совпадают.', 'err'); return; }
    var b = $('rpBtn'); b.disabled = true; msg('Сохраняем…');
    try {
      var r = await fetch(SB + '/auth/v1/user', {
        method: 'PUT',
        headers: { apikey: KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: p1 })
      });
      if (r.ok) {
        token = ''; $('rpForm').hidden = true; $('rpLead').textContent = '';
        msg('✅ Пароль изменён.', 'ok'); $('rpAfter').hidden = false; return;
      }
      var j = {}; try { j = await r.json(); } catch (_) {}
      var code = j.error_code || j.code || '';
      if (r.status === 401 || r.status === 403) msg(EXPIRED, 'err');
      else if (code === 'same_password') msg('Новый пароль совпадает со старым — придумайте другой.', 'err');
      else if (code === 'weak_password') msg('Пароль слишком простой — добавьте цифры и буквы, сделайте длиннее.', 'err');
      else msg('Не получилось сохранить пароль: ' + (j.msg || j.message || ('ошибка ' + r.status)), 'err');
    } catch (err) {
      msg('Нет связи. Проверьте интернет и нажмите ещё раз.', 'err');
    }
    b.disabled = false;
  });
})();
</script>
</body>
</html>
